<script>
/* دخول مباشر: لو الحساب محفوظ نودّيه على صفحته فوراً، ولو المتصفح مسح التخزين المحلي نسترجعه من مخزن النظام (Capacitor Preferences)
   index.html#stay يوقف التحويل */
(function khBootRestore(){
  if(location.hash==='#stay') return;
  function target(){ try{ var g=function(k){ return localStorage.getItem(k); };
    if(g('khafet_worker_auth')||g('khafet_staff_ok')==='1') return 'fanyeen.html';
    if(g('khafet_remember')==='0') return null;
    if(g('khafet_provider_phone')) return 'provider.html';
    if(g('khafet_admin_ok')==='1') return 'admin.html';
  }catch(e){} return null; }
  var t=target(); if(t){ location.replace(t); return; }
  var C=window.Capacitor; if(!(C&&C.isNativePlatform&&C.isNativePlatform())) return;
  var P=null; try{ P=(typeof C.registerPlugin==='function'?C.registerPlugin('Preferences'):null)||(C.Plugins&&C.Plugins.Preferences)||null; }catch(e){}
  if(!P) return;
  document.documentElement.classList.add('boot');
  var done=false; function finish(){ if(done) return; done=true; document.documentElement.classList.remove('boot'); }
  setTimeout(finish,2500);
  var KEYS=['khafet_techlang','kh_lang_chosen','khafet_worker_auth','khafet_staff_ok','khafet_provider_phone','khafet_admin_ok','khafet_remember','khafet_uilang','khafet_lang'];
  Promise.all(KEYS.map(function(k){ return P.get({key:k}).then(function(r){ if(r&&r.value!=null){ try{ localStorage.setItem(k,r.value); }catch(e){} } }).catch(function(){}); }))
    .then(function(){ var t2=target(); if(t2){ location.replace(t2); } else finish(); }).catch(finish);
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
  :root{
    --gold:#F5C518; --gold-strong:#E7B70B; --gold-deep:#B8860B;
    --ink:#1A1712;
    --bg:#FAF7EF; --panel:#F3EEE2; --card:#fff; --line:#EBE5D6;
    --text:#1A1712; --muted:#6E685B;
    --r:20px; --shadow:0 1px 2px rgba(40,32,10,.04),0 12px 30px rgba(40,32,10,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Cairo','Segoe UI',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-tap-highlight-color:transparent;min-height:100vh}
  a{color:inherit;text-decoration:none}
  .safe-top{height:env(safe-area-inset-top)}
  .wrap{max-width:560px;margin:0 auto;padding:0 18px 40px}

  /* شعار علوي — ٥ ضغطات عليه تفتح لوحة الإدارة (مخفي) */
  .head{text-align:center;padding:26px 0 10px}
  /* الشعار يبدو ثابتاً تماماً — لا مؤشّر ولا حركة ضغط (دخول الإدارة مخفي) */
  .logo{width:92px;height:92px;border-radius:26px;margin:0 auto 14px;background:var(--gold);display:grid;place-items:center;box-shadow:0 10px 30px rgba(245,197,24,.28);font-size:52px;line-height:1;cursor:default;user-select:none;-webkit-user-select:none}
  .head h1{font-size:2rem;font-weight:900;letter-spacing:1px}
  .head p{color:var(--muted);font-size:.98rem;font-weight:700;margin-top:3px}
  .head .biz{display:inline-block;margin-top:12px;background:rgba(245,197,24,.12);border:1px solid rgba(245,197,24,.35);color:var(--gold-deep);font-weight:800;font-size:.85rem;padding:6px 16px;border-radius:999px}

  /* بطاقات الأدوار */
  .cards{margin-top:24px;display:grid;gap:14px}
  .sec-label{color:var(--muted);font-weight:800;font-size:.85rem;margin:10px 4px 2px;display:flex;align-items:center;gap:8px}
  .sec-label::before{content:"";flex:1;height:1px;background:var(--line)}
  .sec-label::after{content:"";flex:1;height:1px;background:var(--line)}
  .card{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;box-shadow:var(--shadow);transition:.15s;cursor:pointer;position:relative;overflow:hidden;width:100%;text-align:right;font-family:inherit;color:inherit}
  .card:active{transform:scale(.98)}
  .card .ic{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:1.9rem;flex-shrink:0;background:rgba(245,197,24,.12)}
  .card .tx{flex:1;min-width:0}
  .card .tx h3{font-size:1.22rem;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card .tx p{color:var(--muted);font-size:.9rem;font-weight:600;margin-top:2px}
  .card .arrow{color:var(--muted);font-size:1.5rem;font-weight:900;flex-shrink:0}
  .card.prov .ic{background:rgba(56,132,255,.14)}
  .card.sufrah .ic{background:rgba(255,138,61,.15)}
  .card.soon{opacity:.72;border-style:dashed}
  .tag{background:rgba(245,197,24,.15);border:1px solid rgba(245,197,24,.35);color:var(--gold-deep);font-size:.68rem;font-weight:800;padding:3px 9px;border-radius:999px}

  .langbar{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px}
  .langbar button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-family:inherit;font-weight:800;font-size:.86rem;color:var(--text);cursor:pointer}
  .langbar button.on{background:var(--gold);border-color:var(--gold)}
  .lp{position:fixed;inset:0;z-index:50;background:rgba(14,11,5,.72);display:flex;align-items:center;justify-content:center;padding:22px}
  .lp-card{background:#fff;border-radius:24px;padding:22px 18px;max-width:420px;width:100%;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.35)}
  .lp-card .lp-ic{font-size:2.4rem} .lp-card h2{font-size:1.5rem;font-weight:900;margin-top:2px} .lp-card p{color:var(--muted);font-size:.92rem;font-weight:700;margin:4px 0 14px}
  .lp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .lp-grid button{padding:14px 10px;border-radius:15px;border:1.5px solid var(--line);background:#FBF9F3;font-family:inherit;cursor:pointer}
  .lp-grid button:first-child{grid-column:1 / -1;background:#FDF8E7;border-color:var(--gold)}
  .lp-grid b{display:block;font-size:1.2rem;font-weight:900;color:var(--text)} .lp-grid small{color:var(--muted);font-weight:700}
  .foot{text-align:center;color:var(--muted);font-size:.78rem;font-weight:700;margin-top:26px;opacity:.8}

html,body{touch-action:manipulation}
  /* شاشة بداية قصيرة أثناء استرجاع الحساب المحفوظ */
  html.boot .wrap{visibility:hidden}
  .boot-splash{display:none;position:fixed;inset:0;background:var(--bg);place-items:center;z-index:9}
  html.boot .boot-splash{display:grid}
  .boot-splash .logo{margin:0}
</style>
</head>
<body>
  <div class="boot-splash"><div class="logo">🤝</div></div>
  <div class="safe-top"></div>
  <div class="wrap">

    <div class="head">
      <div class="logo" id="logoMark">🤝</div>
      <h1 data-i="title">رزق</h1>
      <p data-i="sub">منصّة الشركاء</p>
      <span class="biz" data-i="biz">بوابة العمل · للفريق فقط</span>
      <div class="langbar" id="langbar"></div>
    </div>

    <div class="cards">

      <div class="sec-label" data-i="secK">🔧 خافِت · الصيانة</div>

      <a class="card tech" href="fanyeen.html">
        <div class="ic">🔧</div>
        <div class="tx">
          <h3 data-i="techT">فنيين خافِت</h3>
          <p data-i="techP">استقبل الطلبات، سجّل وصولك، وأنجز أعمالك</p>
        </div>
        <div class="arrow" data-arrow>‹</div>
      </a>

      <a class="card prov" href="provider.html">
        <div class="ic">🧰</div>
        <div class="tx">
          <h3 data-i="provT">مزودين خافِت</h3>
          <p data-i="provP">تابع طلبات خدماتك وأدِرها بسهولة</p>
        </div>
        <div class="arrow" data-arrow>‹</div>
      </a>

      <div class="sec-label" data-i="secS">🍲 سُفرة · الأكل</div>

      <button class="card sufrah soon" onclick="soonMsg()">
        <div class="ic">🍲</div>
        <div class="tx">
          <h3><span data-i="sufT">أسر سُفرة</span> <span class="tag" data-i="soon">قريبًا</span></h3>
          <p data-i="sufP">الأسر المنتجة · قيد التجهيز</p>
        </div>
        <div class="arrow" data-arrow>‹</div>
      </button>

    </div>

    <div class="foot" data-i="foot">رزق © 2026 · منصّة شركاء الأعمال</div>

  </div>

<script>
  function soonMsg(){
    alert(T('soonMsg'));
  }

  /* دخول الإدارة مخفي: اضغط على الشعار ٥ مرات متتالية */
  (function(){
    var taps = 0, t = null;
    var mark = document.getElementById('logoMark');
    if(!mark) return;
    mark.addEventListener('click', function(){
      taps++;
      clearTimeout(t);
      t = setTimeout(function(){ taps = 0; }, 1500);
      if(taps >= 5){ taps = 0; window.location.href = 'admin.html'; }
    });
  })();
</script>

<script>

r":{"dir":"rtl","title":"رزق","sub":"پارٹنر پلیٹ فارم","biz":"ورک پورٹل · صرف ٹیم کے لیے","secK":"🔧 خافت · مرمت","techT":"خافت ٹیکنیشن","techP":"کام وصول کریں، سائٹ پر پہنچنا درج کریں اور کام مکمل کریں","provT":"خافت فراہم کنندگان","provP":"اپنے سروس کے کام آسانی سے دیکھیں اور سنبھالیں","secS":"🍲 سفرہ · کھانا","sufT":"سفرہ گھریلو باورچی","soon":"جلد","sufP":"گھریلو باورچی · جلد آ رہا ہے","foot":"رزق © 2026 · کاروباری شراکت دار پلیٹ فارم","soonMsg":"🍲 سفرہ جلد آ رہا ہے"}};
var LANGS=[["ar","عربي","Arabic"],["en","English","English"],["ne","नेपाली","Nepali"],["hi","हिन्दी","Hindi"],["ur","اردو","Urdu"]];
function curLang(){ try{ return localStorage.getItem("khafet_techlang")||"ar"; }catch(e){ return "ar"; } }
function T(k){ var d=I18[curLang()]||I18.ar; return d[k]||I18.ar[k]||""; }
function applyI18(){
  var l=curLang(), d=I18[l]||I18.ar;
  document.documentElement.lang=l; document.documentElement.dir=d.dir;
  document.querySelectorAll("[data-i]").forEach(function(el){ var v=d[el.getAttribute("data-i")]; if(v) el.textContent=v; });
  document.querySelectorAll("[data-arrow]").forEach(function(el){ el.textContent=d.dir==="rtl"?"‹":"›"; });
  document.querySelectorAll(".card").forEach(function(el){ el.style.textAlign=d.dir==="rtl"?"right":"left"; });
  document.title=d.title;
  var bar=document.getElementById("langbar");
  if(bar) bar.innerHTML=LANGS.map(function(x){ return '<button type="button" class="'+(x[0]===l?'on':'')+'" onclick="setLang(\''+x[0]+'\')">'+x[1]+'</button>'; }).join("");
}
function setLang(l){
  try{ localStorage.setItem("khafet_techlang",l); localStorage.setItem("khafet_uilang",l==="ar"?"ar":"en"); localStorage.setItem("kh_lang_chosen","1"); }catch(e){}
  try{ var C=window.Capacitor, P=C&&(typeof C.registerPlugin==="function"?C.registerPlugin("Preferences"):null); if(P){ P.set({key:"khafet_techlang",value:l}); P.set({key:"khafet_uilang",value:l==="ar"?"ar":"en"}); P.set({key:"kh_lang_chosen",value:"1"}); } }catch(e){}
  var lp=document.getElementById("lp"); if(lp) lp.remove();
  applyI18();
}
function langPicker(){
  if(document.getElementById("lp")) return;
  document.body.insertAdjacentHTML("beforeend",'<div class="lp" id="lp"><div class="lp-card"><div class="lp-ic">🌐</div><h2>اختر لغتك</h2><p>Choose your language · भाषा छान्नुहोस्</p><div class="lp-grid">'+LANGS.map(function(x){ return '<button type="button" onclick="setLang(\''+x[0]+'\')"><b>'+x[1]+'</b><small>'+x[2]+'</small></button>'; }).join("")+'</div></div></div>');
}
function hasLang(){ try{ return !!(localStorage.getItem("kh_lang_chosen")||localStorage.getItem("khafet_techlang")); }catch(e){ return true; } }
applyI18();
(function waitBoot(){ if(document.documentElement.classList.contains("boot")){ setTimeout(waitBoot,150); return; } applyI18(); if(!hasLang()) langPicker(); })();
</script>
