<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>خافِت | لوحة المؤسسة</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23141414'/><text y='.9em' x='20' font-size='58'>🏢</text></svg>" />
<meta name="theme-color" content="#141414" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" /></noscript>
<style>
  :root{ --gold:#F5C518; --gold-strong:#E7B70B; --gold-deep:#B8860B; --gold-soft:#FBF1C9; --gold-tint:#FDF8E7;
    --ink:#1A1712; --brand-dark:#000; --bg:#FAF7EF; --card:#fff; --muted:#6E685B; --line:#EBE5D6;
    --ok:#15803D; --ok-soft:#DCFCE7; --danger:#DC2626; --danger-soft:#FBE4E4;
    --r:18px; --shadow:0 1px 2px rgba(40,32,10,.04),0 10px 28px rgba(40,32,10,.06); --shadow-sm:0 1px 2px rgba(40,32,10,.04),0 4px 12px rgba(40,32,10,.045); }
  /* ═ الرئيسية: مربّعات الأقسام ═ */
  .hgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;margin-top:16px}
  @media(max-width:520px){.hgrid{grid-template-columns:1fr}}
  .hcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:right;cursor:pointer;box-shadow:var(--shadow-sm);transition:.14s;display:flex;flex-direction:column;gap:7px}
  .hcard:hover{border-color:var(--gold);transform:translateY(-2px)}
  .hcard:active{transform:scale(.98)}
  .hc-top{display:flex;align-items:center;justify-content:space-between}
  .hc-ic{font-size:2rem;line-height:1}
  .hc-badge{background:var(--danger);color:#fff;font-weight:900;font-size:.8rem;padding:2px 10px;border-radius:999px;min-width:26px;text-align:center}
  .hcard h3{font-size:1.18rem;font-weight:900;color:var(--ink)}
  .hcard p{color:var(--muted);font-size:.82rem;font-weight:600;line-height:1.5;flex:1}
  .hc-opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .hc-opt{background:var(--gold-tint);border:1px solid var(--line);color:var(--gold-deep);font-weight:800;font-size:.76rem;padding:6px 11px;border-radius:9px}
  .hc-opt:hover{background:var(--gold);color:var(--ink)}
  .backbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 18px;font-weight:800;color:var(--ink);font-family:inherit;margin-bottom:6px;box-shadow:var(--shadow-sm)}
  .backbtn:hover{border-color:var(--gold)}
  @media print{ .admin-bar,.stats,.sechead button,#toast{display:none!important} .backbtn{display:none!important} body{background:#fff} .screen{padding:0;max-width:100%} .panel{box-shadow:none;border-color:#ccc;break-inside:avoid} }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Cairo','Segoe UI',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:960px;margin:0 auto;padding:0 18px}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit;font-size:1rem}
  a{color:inherit;text-decoration:none}
  header.top{position:sticky;top:0;z-index:30;background:rgba(250,247,239,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
  .top .wrap{display:flex;align-items:center;gap:12px;height:64px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.2rem}
  .brand .mk{width:38px;height:38px;border-radius:11px;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-size:1.1rem}
  .spacer{flex:1}
  .logout{color:var(--muted);font-weight:700;font-size:.85rem;padding:6px 10px}

  .login{max-width:380px;margin:44px auto;padding:0 18px;text-align:center}
  .login .ic{font-size:3rem;margin-bottom:8px}
  .login h1{font-size:1.5rem;font-weight:900}
  .login p{color:var(--muted);margin:6px 0 20px;font-size:.9rem}
  .login input{width:100%;padding:15px;border-radius:13px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:1.05rem;margin-bottom:12px}
  .login input:focus{outline:none;border-color:var(--gold-strong)}
  .login .btn{width:100%;background:var(--ink);color:#fff;font-weight:900;padding:16px;border-radius:13px;font-size:1.05rem}
  .login .rememberme{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 8px;margin:2px 0 12px;font-size:.95rem;font-weight:800;color:var(--ink);cursor:pointer;user-select:none;text-align:center}
  .login .rememberme input{width:18px;height:18px;margin:0;padding:0;accent-color:#F5C518;cursor:pointer}
  .login .rememberme small{flex:0 0 100%;font-weight:600;font-size:.78rem;color:var(--muted)}
  .login .lgerr{background:var(--danger-soft);color:#991B1B;border-radius:12px;padding:12px;margin-top:12px;font-weight:600;font-size:.9rem}

  .screen{padding:18px 0 40px}
  .admin-bar{background:var(--ink);color:#fff;border-radius:var(--r);padding:18px 20px;display:flex;align-items:center;gap:13px}
  .admin-bar .ico{font-size:1.7rem;color:var(--gold)}
  .admin-bar b{font-size:1.15rem}
  .admin-bar small{opacity:.7;display:block}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--shadow-sm)}
  .stat .n{font-size:1.6rem;font-weight:900;line-height:1}
  .stat .l{color:var(--muted);font-size:.85rem;margin-top:6px}
  .stat.gold .n{color:var(--gold-strong)} .stat.green .n{color:var(--ok)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:20px;margin-top:18px}
  .panel h3{font-size:1.05rem;font-weight:800;margin-bottom:12px}
  /* رأس قابل للطي — اضغط عليه لتصغير/فتح اللوحة */
  .panel h3.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;user-select:none;
    margin-bottom:0;padding:2px 0;transition:color .15s}
  .panel h3.ph:hover{color:var(--gold-deep)}
  .panel h3.ph.open{margin-bottom:12px}
  .panel h3.ph .chev{font-size:.85rem;color:var(--muted);background:var(--bg);border:1px solid var(--line);
    border-radius:8px;padding:3px 9px;font-weight:900;flex-shrink:0}
  .panel h3.ph:hover .chev{border-color:var(--gold)}
  .rline{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
  .rline:last-child{border-bottom:none}
  .rl-t{flex:1} .rl-t small{color:var(--muted);display:block;font-size:.8rem}
  .prov-card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:#fcfbf6}
  .prov-card .pc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .prov-card b{font-size:1.02rem}
  .status{font-size:.76rem;font-weight:800;padding:5px 12px;border-radius:999px;white-space:nowrap}
  .st-new{background:var(--gold-soft);color:#7a5f00} .st-confirmed{background:#E0F2FE;color:#075985}
  .st-progress{background:#FEF0C7;color:#92600A} .st-done{background:var(--ok-soft);color:#166534} .st-cancelled{background:var(--danger-soft);color:#991B1B}
  /* وصل الفني — يظهر جنب الحالة */
  .st-arrived{background:rgba(37,211,102,.2);color:#0b7a3b;animation:arrBlink 1.8s ease-in-out infinite}
  @keyframes arrBlink{0%,100%{opacity:1}50%{opacity:.6}}
  .st-delay{background:#FEF0C7;color:#92600A}
  /* شريط مراحل الطلب */
  .flow{display:flex;align-items:center;gap:5px;margin:10px 0 2px;flex-wrap:wrap}
  .flow i{font-style:normal;font-size:.72rem;font-weight:800;padding:4px 9px;border-radius:20px;
    background:var(--bg);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
  .flow i.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .flow i.arr{background:#0b7a3b;color:#fff;border-color:#0b7a3b}
  .flow span{color:var(--line);font-weight:900;font-size:.7rem}
  .mini-ok{color:#0b7a3b;font-weight:800;font-size:.82rem;align-self:center;margin-inline-end:6px}
  .paychip{display:inline-block;border-radius:8px;padding:2px 9px;font-weight:800;font-size:.84rem}
  .paychip.ok{background:var(--ok-soft);color:#166534} .paychip.due{background:#EEF6FF;color:#0b3d6b} .paychip.wait{background:#FEF0C7;color:#92600A} .paychip.bad{background:var(--danger-soft);color:#991B1B}
  .paylink{background:none;border:none;padding:0;margin-inline-start:6px;color:#7c3aed;font-weight:800;cursor:pointer;font-family:inherit;font-size:inherit}
  /* شريط الأقسام الرئيسي — يقسّم اللوحة لصفحات واضحة */
  .secbar{display:flex;gap:8px;overflow-x:auto;margin-top:16px;padding-bottom:4px;scrollbar-width:none;position:sticky;top:0;z-index:20;background:var(--bg);padding-top:8px}
  .secbar::-webkit-scrollbar{display:none}
  .secbtn{flex:1;min-width:96px;padding:12px 8px;border-radius:13px;background:var(--card);border:1.5px solid var(--line);font-weight:800;color:var(--muted);text-align:center;white-space:nowrap;position:relative;font-size:.95rem}
  .secbtn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .secbtn .bdg{position:absolute;top:-7px;left:-4px;background:#c0392b;color:#fff;font-size:.68rem;font-weight:900;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
  .fbar{display:flex;gap:8px;overflow-x:auto;margin-top:16px;padding-bottom:4px;scrollbar-width:none}
  .fbar::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;padding:9px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;color:var(--muted);font-size:.9rem}
  .tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .aorder{background:var(--card);border:1px solid var(--line);border-right:5px solid var(--gold);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:17px;margin-top:12px}
  .aorder.st-confirmed{border-right-color:#0284C7} .aorder.st-progress{border-right-color:var(--gold-strong)}
  .aorder.st-done{border-right-color:var(--ok)} .aorder.st-cancelled{border-right-color:var(--danger)}
  .aorder .ah{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
  .aorder .who b{font-size:1.05rem}
  .aorder .who a{color:var(--ink);font-weight:800;border-bottom:2px solid var(--gold)}
  .aorder .abody{display:grid;grid-template-columns:1fr 1fr;gap:9px 18px;margin-top:13px;font-size:.9rem}
  .aorder .abody .k{color:var(--muted);font-size:.8rem}
  .aorder .aitems{background:#faf8f1;border-radius:12px;padding:11px 13px;margin-top:13px;font-size:.88rem}
  .aorder .aitems .li{display:flex;justify-content:space-between;padding:3px 0}
  .aorder .actions{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
  .sbtn{padding:10px 15px;border-radius:11px;font-weight:700;font-size:.86rem;border:1.5px solid var(--line);background:#fff;transition:.15s}
  /* 🧰 تخصصات الفني */
  .trds{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
  .trd{padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:.8rem;font-family:inherit;cursor:pointer}
  .trd.on{background:var(--gold);border-color:var(--gold);color:var(--ink)}
  .trd-h{font-size:.78rem;color:var(--muted);font-weight:700;margin-top:10px}
  /* 📨 طلبات الانضمام */
  .jr-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .jr-filters button{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:.85rem;font-family:inherit;cursor:pointer}
  .jr-filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .jr{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
  .jr.new{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
  .jr-top{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
  .jr-top h4{margin:0;font-size:1.05rem;font-weight:900;flex:1;min-width:150px}
  .jr-top h4 small{display:block;color:var(--muted);font-weight:700;font-size:.78rem;margin-top:2px}
  .jr-st{padding:3px 11px;border-radius:999px;font-size:.78rem;font-weight:800;white-space:nowrap}
  .jr-st.new{background:var(--gold-soft);color:var(--gold-deep)} .jr-st.contacted{background:#e0ecff;color:#1d4ed8}
  .jr-st.accepted{background:#e3f5ea;color:#15803d} .jr-st.rejected{background:#fde8e8;color:#b91c1c}
  .jr-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .jr-meta span{background:var(--panel,#f3eee2);border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:700}
  .jr-contact{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .jr-contact a{text-decoration:none}
  .jr-cat{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
  .jr-cat b{font-weight:900}
  .jr-svc{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.92rem}
  .jr-svc:last-child{border-bottom:0}
  .jr-svc em{font-style:normal;color:var(--muted);font-size:.8rem;display:block}
  .jr-svc .pr{font-weight:900;white-space:nowrap;text-align:end}
  .jr-new{font-size:.7rem;font-weight:800;color:#7c3aed;background:#f1e9ff;border-radius:999px;padding:0 7px;margin-inline-start:6px;white-space:nowrap;display:inline-block}
  .jr details{margin-top:10px}
  .jr summary{cursor:pointer;font-weight:800;color:var(--gold-deep)}
  .jr-kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:8px;font-size:.88rem}
  .jr-kv dt{color:var(--muted);font-weight:700} .jr-kv dd{margin:0;font-weight:700}
  .jr-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .jr-acts .sbtn{flex:1;min-width:90px}
  .jr-acts .sbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .jr-note{width:100%;margin-top:10px;padding:10px;border-radius:11px;border:1px solid var(--line);font:inherit;font-size:.9rem;resize:vertical}
  .sbtn:hover{background:#f6f4ec} .sbtn.danger{color:var(--danger);border-color:#f0cccc} .sbtn.ok{color:#fff;background:var(--ok);border-color:var(--ok)}
  .cg-cat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
  .cg-cat.off{opacity:.62}
  .cg-head,.cg-svc{display:flex;align-items:center;gap:8px}
  .cg-head{padding-bottom:10px;border-bottom:1px solid var(--line)}
  .cg-main{flex:1;display:flex;align-items:center;gap:11px;background:none;border:0;padding:6px 2px;text-align:start;font-family:inherit;cursor:pointer;color:inherit;min-width:0}
  .cg-ic{width:38px;height:38px;border-radius:11px;background:#f6f4ec;display:grid;place-items:center;font-size:1.25rem;flex:none}
  .cg-ic.big{width:46px;height:46px;font-size:1.5rem;background:#FBF3D0}
  .cg-t{display:flex;flex-direction:column;min-width:0}
  .cg-t b{font-weight:800;font-size:.98rem} .cg-head .cg-t b{font-size:1.08rem;font-weight:900}
  .cg-t small{color:var(--muted);font-weight:600;font-size:.8rem}
  .cg-list{padding-top:4px}
  .cg-svc{border-bottom:1px dashed var(--line)} .cg-svc:last-child{border-bottom:0} .cg-svc.off{opacity:.55}
  .cg-ord{display:flex;gap:4px;flex:none}
  .cg-ord button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:.72rem;cursor:pointer}
  .cg-ord button:disabled{opacity:.3;cursor:default}
  .cg-empty{color:var(--muted);font-weight:600;font-size:.86rem;padding:10px 2px}
  .cg-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center}
  .cg-sheet{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 18px 26px;max-height:92vh;overflow:auto}
  .cg-sheet h3{font-weight:900;font-size:1.15rem;margin-bottom:12px}
  .cg-sheet label{display:block;font-weight:800;font-size:.86rem;margin-bottom:10px;color:#333}
  .cg-sheet input:not([type=checkbox]),.cg-sheet select,.cg-sheet textarea{display:block;width:100%;margin-top:5px;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;font-family:inherit;font-size:.95rem;font-weight:600;background:#fff}
  .cg-sheet textarea{min-height:64px;resize:vertical}
  .cg-sheet .cg-row{display:grid;grid-template-columns:1fr 1fr 80px;gap:8px}
  .cg-sheet .cg-sw{display:flex;align-items:center;gap:9px;padding:9px 0;font-weight:700}
  .cg-sheet .cg-sw input{width:20px;height:20px;accent-color:var(--ok)}
  .cg-acts{display:flex;gap:8px;margin-top:14px} .cg-acts .sbtn{flex:1;padding:13px}
  @media(min-width:700px){ .cg-overlay{align-items:center} .cg-sheet{border-radius:20px} }
  .plang-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .plang{padding:8px 14px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:.85rem;color:var(--muted);cursor:pointer;font-family:inherit}
  .plang.active{background:var(--gold,#F5C518);border-color:var(--gold,#F5C518);color:var(--ink)}
  .pr-cat{margin-top:14px} .pr-cat h4{font-size:.98rem;font-weight:900;color:var(--ink);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .pr-edit-row{display:flex;align-items:center;gap:10px;padding:7px 0}
  .pr-edit-row span{flex:1;font-weight:600;font-size:.92rem}
  .pr-edit-row input{width:90px;padding:9px 11px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-weight:800;text-align:center;font-size:1rem;color:var(--ink);font-family:inherit}
  .pr-edit-row input:focus{outline:none;border-color:var(--gold-strong,#E3AF07)}
  .pr-edit-row b{color:var(--muted);font-weight:700;font-size:.82rem;width:30px}
  .rev-ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .inv-add-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .inv-add-row input{padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-family:inherit;font-weight:700;font-size:.9rem;flex:1;min-width:110px}
  .inv-add-row input#inv_new_unit{max-width:80px;flex:0 0 auto}
  .inv-add-row input#inv_new_qty{max-width:90px;flex:0 0 auto}
  .inv-list{margin-top:14px;display:grid;gap:10px}
  .inv-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
  .inv-item.low{border-color:#f0b0b0;background:#fdf5f5}
  .inv-item.mismatch{border-color:#e0a800;background:#fffbe6}
  .inv-recon{margin-top:6px;font-size:.82rem;color:var(--muted);font-weight:600}
  .inv-recon b{color:var(--ink)}
  .recon-warn{color:#c0392b;font-weight:800}
  .recon-ok{color:#0b7a3b;font-weight:800}
  .inv-info{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .inv-info b{font-size:1.02rem}
  .inv-qty{font-weight:800;color:var(--muted);font-size:.9rem}
  .inv-item.low .inv-qty{color:var(--danger)}
  .inv-ctl{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .inv-ctl .inv-amt{width:80px;padding:9px 10px;border-radius:9px;border:1.5px solid var(--line);background:#fcfbf6;font-weight:800;text-align:center;font-family:inherit}
  .log-day{margin-bottom:14px}

async function saveService(id){
  const name=cgVal('sv_name'), cat=cgVal('sv_cat');
  if(!name){ toast(LX('اكتب اسم الخدمة','Enter the service name')); return; }
  if(!cat){ toast(LX('اختر القسم','Choose a section')); return; }
  const price=Math.max(0, Number(cgVal('sv_price'))||0), dur=Math.max(0, Math.round(Number(cgVal('sv_dur'))||0));
  const old=CATALOG.svcs.find(x=>x.id===id);
  const row={ id:id||('s'+Date.now().toString(36)), cat_id:cat, name, name_en:cgVal('sv_name_en')||null, description:cgVal('sv_desc')||null, icon:cgVal('sv_icon')||'🔧', price, duration:dur, custom:cgChk('sv_custom'), active:cgChk('sv_active') };
  if(!old || old.cat_id!==cat) row.sort=Math.max(0,...CATALOG.svcs.filter(x=>x.cat_id===cat).map(x=>+x.sort||0))+10;
  if(!old) row.quick=false;
  const { error }=await sb.from('khafet_services').upsert(row);
  if(error){ toast(LX('ما انحفظ، حاول مرة ثانية','Not saved, try again')); return; }
  closeCg(); toast(LX('✓ انحفظت الخدمة','✓ Service saved')); await loadCatalog(); render();
}
async function moveCatalog(kind, id, dir){
  const table=kind==='cat'?'khafet_categories':'khafet_services';
  const all=kind==='cat'?CATALOG.cats:CATALOG.svcs;
  const me=all.find(x=>x.id===id); if(!me) return;
  const list=(kind==='cat'?[...all]:all.filter(x=>x.cat_id===me.cat_id)).sort(bySort);
  const i=list.indexOf(me), j=i+dir; if(j<0||j>=list.length) return;
  [list[i],list[j]]=[list[j],list[i]];
  const upd=list.map((x,k)=>({x,sort:(k+1)*10})).filter(({x,sort})=>+x.sort!==sort);
  upd.forEach(({x,sort})=>{ x.sort=sort; }); render();
  const res=await Promise.all(upd.map(({x,sort})=>sb.from(table).update({sort}).eq('id',x.id)));
  if(res.some(r=>r.error)) toast(LX('ما انحفظ الترتيب','Order not saved'));
  await loadCatalog(); render();
}

function mediaPath(v){
  if(!v) return '';
  const s=String(v);
  const m=s.match(/khafet-videos\/(.+?)(\?|$)/);
  return m ? decodeURIComponent(m[1]) : s;
}
async function openMedia(v){
  const p=mediaPath(v);
  if(!p || !sb) return;
  try{
    const { data, error } = await sb.storage.from('khafet-videos').createSignedUrl(p, 600);
    if(error || !data) throw error || new Error('no url');
    window.open(data.signedUrl, '_blank', 'noopener');
  }catch(e){ console.warn('media:', e.message||e); toast('تعذّر فتح الملف'); }
}

  const remembered=(()=>{ try{ return localStorage.getItem('khafet_admin_ok')==='1' && localStorage.getItem('khafet_remember')!=='0'; }catch(e){ return false; } })();
  if(remembered && !loggedIn){ loggedIn=true; render(); }
  try{
    if(window.supabase && SUPABASE_URL){
      sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON,KH_AUTH_OPTS); cloudReady=true;
      const { data:{ session } }=await sb.auth.getSession();
      if(session){
        if(localStorage.getItem('khafet_remember')==='0'){ try{ await sb.auth.signOut(); }catch(e){} loggedIn=false; render(); return; }   // اختار عدم البقاء مسجّلاً
        const ok=await isAdminUser();

        if(ok===false){ try{ await sb.auth.signOut(); }catch(e){} localStorage.removeItem('khafet_admin_ok'); }   // جلسة بلا صلاحية أدمن
      } else if(loggedIn){ try{ localStorage.removeItem('khafet_admin_ok'); }catch(e){} }   // ما فيه جلسة محفوظة: نرجع لشاشة الدخول
      loggedIn=false; render(); return;
    }

}

function payCell(o){
  const METH={online:LX('إلكتروني','online'),tamara:LX('تمارا','Tamara'),device:LX('جهاز الفني','card machine')}[o.payMethod]||'';
  if(o.status==='cancelled'){
    if(o.payStatus==='refunded') return `<span class="paychip ok">${LX('✓ رجع المبلغ','✓ Refunded')}</span>`;
    if(o.payStatus==='refund_pending'||o.payStatus==='refund_failed') return `<span class="paychip ${o.payStatus==='refund_failed'?'bad':'wait'}">${o.payStatus==='refund_failed'?LX('فشل الاسترجاع','Refund failed'):LX('جاري الاسترجاع','Refund pending')} · ${money(o.paidAmount)}</span><button class="paylink" onclick="retryRefund('${o.id}')">${LX('إعادة المحاولة','Retry')}</button>`;
    return `<span class="paychip">—</span>`;
  }
  if(o.payRequired && !o.released) return `<span class="paychip wait">${LX('بانتظار دفع العميل','Awaiting customer payment')}</span>`;
  if(o.paidAmount>0 && o.amountDue<=0) return `<span class="paychip ok">${LX('✓ مدفوع','✓ Paid')} ${money(o.paidAmount)}${METH?' · '+METH:''}</span>`;
  if(o.amountDue>0) return `<span class="paychip due">${LX('المتبقي','Due')} ${money(o.amountDue)}${o.paidAmount>0?' · '+LX('مدفوع','paid')+' '+money(o.paidAmount):''}</span>${o.status==='progress'||o.status==='confirmed'?`<button class="paylink" onclick="adminDevicePay('${o.id}')">${LX('تسجيل دفع بالجهاز','Record card payment')}</button>`:''}`;
  return `<span class="paychip">—</span>`;
}

function techTrades(t){ return Array.isArray(t&&t.trades)?t.trades:[]; }
async function toggleTrade(uid, key){
  const t=STAFF.find(s=>s.user_id===uid); if(!t) return;
  const cur=techTrades(t), next=cur.includes(key)?cur.filter(x=>x!==key):cur.concat([key]);
  t.trades=next; render();
  const r=await sb.from('khafet_staff').update({trades:next}).eq('user_id',uid).select('user_id');
  if(r.error||!r.data||!r.data.length){ t.trades=cur; render(); toast('⚠️ '+LX('ما انحفظ التخصص','Trade not saved')); return; }
  toast(LX('✅ انحفظ','✅ Saved'));
}

/* ضغط صورة الصنف قبل الرفع: أقصى بُعد 800px، JPEG 82% */
function compressImage(file, max, q){ return new Promise((res,rej)=>{ const img=new Image(); const url=URL.createObjectURL(file);
  img.onload=()=>{ const r=Math.min(1,(max||800)/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
    c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',q||0.82); };
  img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('img')); }; img.src=url; }); }
async function uploadPartPhoto(itemId, file){

  const url=data.publicUrl+'?v='+Date.now();
  const r=await sb.from('khafet_inventory').update({image_url:url}).eq('id',itemId); if(r.error) throw r.error;
  return url;
}

function renderStockLog(){
  if(!LOG.length) return `<p style="color:var(--muted)">لا توجد حركات بعد.</p>`;
  // تجميع حسب اليوم
  const groups={};
  LOG.forEach(e=>{ const d=new Date(e.created_at); const key=dateISO(d); (groups[key]=groups[key]||[]).push(e); });
  const days=Object.keys(groups).sort().reverse().slice(0,14);
  return days.map(key=>{
    const items=groups[key];
    const addQ=items.filter(e=>+e.delta>0).reduce((a,e)=>a+ +e.delta,0);
    const subQ=items.filter(e=>+e.delta<0).reduce((a,e)=>a+Math.abs(+e.delta),0);
    const rows=items.map(e=>{ const t=new Date(e.created_at); const pos=+e.delta>0;
      return `<div class="log-row"><span class="log-t">${fmtTime(t.getHours()*60+t.getMinutes())}</span>
        <span class="log-d ${pos?'add':'sub'}">${pos?'➕':'➖'} ${ar(Math.abs(+e.delta))}</span>
        <span class="log-n">${esc(logItemName(e))}</span>
        <span class="log-a">${esc(trReason(e.reason||''))} · ${esc(trData(e.actor||''))}</span></div>`;
    }).join('');
    return `<div class="log-day"><div class="log-day-h">📅 ${dayLabel(key)} <small>(＋${ar(addQ)} · －${ar(subQ)})</small></div>${rows}</div>`;
  }).join('');
}

const AR_DAYS_SHORT=['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
const EN_DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const EN_MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const EN_DAYS_SHORT=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let calMonth=new Date(), calFilter='';
function jobsOn(iso){ return ORDERS.filter(o=>o.date===iso && o.status!=='cancelled').length; }
function calPick(iso){ calFilter=(calFilter===iso?'':iso); render(); }
function calClear(){ calFilter=''; render(); }
function calPrev(){ calMonth=new Date(calMonth.getFullYear(), calMonth.getMonth()-1, 1); render(); }
function calNext(){ calMonth=new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 1); render(); }
function renderCalendar(todayISO){
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  const days=new Date(y,m+1,0).getDate();
  let cells='';
  for(let dd=1; dd<=days; dd++){
    const d=new Date(y,m,dd), iso=dateISO(d), c=jobsOn(iso);
    const cls=[c?'has':'', iso===todayISO?'today':'', calFilter===iso?'sel':''].filter(Boolean).join(' ');
    cells+=`<button class="cal-day ${cls}" onclick="calPick('${iso}')">
      <span class="cd-w">${(_uiEN()?EN_DAYS_SHORT:AR_DAYS_SHORT)[d.getDay()]}</span>
      <b class="cd-n">${ar(dd)}</b>
      <span class="cd-c">${c?('👤 '+ar(c)):'·'}</span>
    </button>`;
  }
  const filterBar = calFilter
    ? `<div class="cal-filter"><span>${LX(`📅 ${dayLabel(calFilter)} — ${ar(jobsOn(calFilter))} طلب`,`📅 ${dayLabel(calFilter)} · ${ordersN(jobsOn(calFilter))}`)}</span><button onclick="calClear()">عرض كل الأيام</button></div>`
    : '';
  return `<div class="calbar">
    <div class="cal-head">
      <button class="cal-nav" onclick="calPrev()">${_uiEN()?'‹':'›'}</button>
      <b>${_uiEN()?EN_MON[m]:AR_MON[m]} ${_uiEN()?y:ar(y)}</b>
      <button class="cal-nav" onclick="calNext()">${_uiEN()?'›':'‹'}</button>
    </div>
    <div class="cal-strip">${cells}</div>
    ${filterBar}
  </div>`;
}

/* اجمع الطلبات تحت رأس لكل يوم — الأقرب أولاً (اليوم ثم بكرة …)، والفايت بالآخر */
function groupByDay(list, todayISO){
  if(!list.length) return `<div class="empty"><div class="ico">🗂️</div><h3>لا توجد طلبات</h3></div>`;
  const g={}; list.forEach(o=>{ (g[o.date]=g[o.date]||[]).push(o); });
  const dates=Object.keys(g).sort();
  const future=dates.filter(d=>d>=todayISO);          // اليوم وما بعده — تصاعدي
  const past=dates.filter(d=>d<todayISO).reverse();   // الفايت — الأحدث أولاً
  return [...future, ...past].map(d=>{
    const cls = d===todayISO ? 'today' : (d<todayISO ? 'past' : '');
    const cards=g[d].sort((a,b)=>a.startMin-b.startMin).map(renderAdminOrder).join('');
    return `<div class="day-head ${cls}"><span>${headLabel(d, todayISO)}</span><span class="cnt">${ordersN(g[d].length)}</span></div>${cards}`;
  }).join('');
}
function headLabel(iso, todayISO){
  const tmr=new Date(); tmr.setDate(tmr.getDate()+1);
  if(iso===todayISO) return LX('📅 اليوم · ','📅 Today · ')+dayLabel(iso);
  if(iso===dateISO(tmr)) return LX('⏭️ غداً · ','⏭️ Tomorrow · ')+dayLabel(iso);
  return dayLabel(iso);
}

function jrCopy(t){
  try{ navigator.clipboard.writeText(t).then(()=>toast(LX('📋 انتسخ','📋 Copied')),()=>toast(LX('ما قدرت أنسخ','Could not copy'))); }

async function setJoinStatus(id, st){
  const x=JOINREQ.find(r=>r.id===id); if(!x) return;
  const prev=x.status; x.status=st; render();
  const r=await sb.from('khafet_join_requests').update({status:st}).eq('id',id).select('id,status');
  if(r.error||!r.data||!r.data.length){ x.status=prev; render(); toast('⚠️ '+LX('ما انحفظ، جرّب مرة ثانية','Not saved, try again')); }

async function setJoinNote(id, note){
  const r=await sb.from('khafet_join_requests').update({admin_note:note}).eq('id',id).select('id');
  if(r.error||!r.data||!r.data.length){ toast('⚠️ '+LX('ما انحفظت الملاحظة','Note not saved')); return; }
  const x=JOINREQ.find(q=>q.id===id); if(x) x.admin_note=note; toast(LX('✅ انحفظت الملاحظة','✅ Note saved'));

async function deleteJoinReq(id){
  const x=JOINREQ.find(r=>r.id===id); if(!x) return;
  if(!confirm(LX('حذف طلب ','Delete request ')+'#'+x.ref_no+' · '+x.name+'؟')) return;
  const r=await sb.from('khafet_join_requests').delete().eq('id',id).select('id');
  if(r.error||!r.data||!r.data.length){ toast('⚠️ '+LX('ما انحذف','Not deleted')); return; }
  JOINREQ=JOINREQ.filter(q=>q.id!==id); render();
}

async function callBroadcast(payload){
  try{
    const { data:{ session } }=await sb.auth.getSession();
    if(!session) return { ok:false, reason:'no_session' };
    const r=await fetch(SUPABASE_URL+'/functions/v1/broadcast',{ method:'POST',
      headers:{ apikey:SUPABASE_ANON, Authorization:'Bearer '+session.access_token, 'Content-Type':'application/json' },
      body:JSON.stringify(payload) });
    return await r.json();
  }catch(e){ return { ok:false, reason:'network' }; }
}

async function bcTest(){
  if(!BC.title.trim()||!BC.body.trim()) return;
  BC.busy=true; bcPaint(); toast(LX('⏳ جاري الإرسال لجوالك…','⏳ Sending to your phone…'));
  const r=await callBroadcast({ mode:'test', title:BC.title.trim(), body:BC.body.trim() });
  BC.busy=false; bcPaint();
  if(r&&r.ok) toast(r.total?LX('📱 وصل لجوالك ('+ar(r.sent)+' من '+ar(r.total)+')','📱 Sent to your phone ('+r.sent+' of '+r.total+')'):LX('ما فيه جوال مسجّل لحسابك. افتحي تطبيق رزق مرة ووافقي على الإشعارات','No phone is linked to your account. Open the Rizq app once and allow notifications'));
  else toast('⚠️ '+bcReason(r));
}
function bcReason(r){ const k=(r&&r.reason)||'';
  const M={no_session:['انتهت الجلسة، سجّلي دخول','Session ended, please sign in'],network:['ما فيه اتصال','No connection'],daily_limit:['أُرسل إشعار اليوم، الإشعار الجاي بكرة','Today\'s notification was already sent, the next one is tomorrow'],too_long:['النص أطول من المسموح','The text is too long'],empty:['اكتبي العنوان والنص','Write the title and the message'],not_admin:['الإرسال للمدير فقط','Only the admin can send'],no_devices:['ما فيه أجهزة مسجلة لهذا الجمهور','No registered devices for this audience'],send_failed:['ما وصل لأي جهاز، ما انحسب من إشعار اليوم، جرّبي بعد شوي','It did not reach any device and was not counted as today\'s notification. Try again in a bit']};
  const m=Object.prototype.hasOwnProperty.call(M,k)?M[k]:['تعذّر الإرسال','Couldn\'t send']; return LX(m[0],m[1]); }
function bcConfirm(){
  if(!BC.title.trim()||!BC.body.trim()||BC.today||BC.busy) return;
  const n=BC.counts?BC.counts[BC.audience]:null;
  document.body.insertAdjacentHTML('beforeend',`<div class="bc-modal" id="bcModal" onclick="if(event.target===this)this.remove()"><div class="bc-card">
    <h3>${LX('تأكيد إرسال الإشعار','Confirm notification')}</h3>
    <div class="bc-to">${LX('إلى: ','To: ')}${bcAud(BC.audience,0)} · ${bcAud(BC.audience,1)}${n!=null?' · '+bcDev(n):''}</div>
    ${bcPreviewHtml()}
    <div class="bc-warn">${LX('⚠️ بعد الإرسال ما يمكن سحب الإشعار، ومسموح بإشعار واحد فقط اليوم.','⚠️ Once sent, it cannot be taken back, and only one notification is allowed today.')}</div>
    <div class="bc-btns"><button type="button" onclick="document.getElementById('bcModal').remove()">${LX('إلغاء','Cancel')}</button><button type="button" class="go" id="bcGo" onclick="bcSend()">${LX('نعم، أرسل الآن','Yes, send now')}</button></div>
  </div></div>`);
}
async function bcSend(){
  const go=document.getElementById('bcGo'); if(go){ go.disabled=true; go.textContent=LX('⏳ جاري الإرسال…','⏳ Sending…'); }
  BC.busy=true;
  const r=await callBroadcast({ mode:'send', audience:BC.audience, title:BC.title.trim(), body:BC.body.trim() });
  BC.busy=false;
  const m=document.getElementById('bcModal'); if(m) m.remove();
  if(r&&r.ok){ toast(LX('✅ أُرسل الإشعار، وصل '+ar(r.sent)+' من '+ar(r.total)+' جهاز','✅ Notification sent, reached '+r.sent+' of '+r.total+' '+(r.total===1?'device':'devices'))); BC.title=''; BC.body=''; }
  else toast('⚠️ '+bcReason(r));
  await loadBroadcast();
}
/* ═ تصدير إلى Excel (CSV بترميز عربي) ═ */
function csvCell(v){ v=(v==null?'':String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function downloadCSV(name, headers, rows){
  const csv='﻿'+[headers].concat(rows).map(r=>r.map(csvCell).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name+'.csv'; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },500);
}
function statusAr(s){ if(_enUI()) return ({new:'New',confirmed:'Confirmed',progress:'In progress',done:'Completed',cancelled:'Cancelled'})[s]||s; return ({new:'جديد',confirmed:'مؤكد',progress:'قيد التنفيذ',done:'مكتمل',cancelled:'ملغي'})[s]||s; }
function exportSection(k){
  try{
    const d=dateISO(new Date()), EN=_enUI();

      downloadCSV(EN?'Orders_'+d:'الطلبات-'+d, EN?['No.','Customer','Phone','City','Service','Date','Time','Status','Total']:['رقم','العميل','الجوال','المدينة','الخدمة','التاريخ','الوقت','الحالة','الإجمالي'],
        ORDERS.map(o=>[EN?_west(o.id):o.id,(o.customer&&o.customer.name)||'',(o.customer&&o.customer.phone)||'',trData((o.address&&o.address.city)||''),(o.items||[]).map(itemName).join(' + '),o.date||'',fmtTime(o.startMin||0),statusAr(o.status),o.finalPrice||o.price||0]));
    } else if(k==='store'){
      downloadCSV(EN?'Warehouse_'+d:'المستودع-'+d, EN?['Item','Category','Code','Qty','Unit','Buy price','Sell price','Reorder level','Target','Percent','Usage (6 months)']:['الصنف','الفئة','الكود','الكمية','الوحدة','سعر الشراء','سعر البيع','حد الطلب','المستهدف','النسبة','استخدام 6 أشهر'],
        INV.map(it=>[EN?whName(it):it.name,EN?(CAT_EN[it.category]||it.category||''):(it.category||''),it.code||'',it.qty,EN?whUnit(it.unit):(it.unit||''),it.buy_price||0,it.sell_price||0,it.min_qty||0,it.target_qty||0,(invPct(it)===null?'':invPct(it)+'%'),invUsage(it.id).u6]));
    } else if(k==='team'){
      const done=ORDERS.filter(o=>o.status==='done'&&o.providerPhone); const byP={};
      done.forEach(o=>{ byP[o.providerPhone]=(byP[o.providerPhone]||0)+1; });
      downloadCSV(EN?'Provider_dues_'+d:'مستحقات-المزوّدين-'+d, EN?['Provider','Phone','Completed orders','Due (SAR)']:['المزوّد','الجوال','طلبات منجزة','المستحق (ر.س)'],
        Object.keys(byP).map(ph=>[provName(ph),ph,byP[ph],byP[ph]*COMMISSION]));
    }
    toast('⤓ تم تنزيل ملف Excel');
  }catch(e){ toast('تعذّر التصدير'); }
}

const _TOK=[["ريال","SAR"],["ر.س","SAR"],["٪","%"]];
const T_DICT_N={}; for(const _k in T_DICT){ T_DICT_N[_west(_k).trim()]=T_DICT[_k]; }
const _EMO=/^((?:[←-⯿️‍\u{1F000}-\u{1FAFF}]+\s*)+)([\s\S]+)$/u;
function _uiEN(){ return (typeof UILANG!=='undefined') && UILANG==='en'; }
function LX(a,e){ return _uiEN()?e:a; }
function _tr(raw){
  if(raw==null) return raw;
  const s=String(raw);
  const m0=s.match(/^(\s*)([\s\S]*?)(\s*)$/); const lead=m0[1], core=m0[2], trail=m0[3];
  if(!core) return raw;
  const h=T_DICT_N[_west(core)];
  if(h!=null && h!=='') return lead+h+trail;
  const em=core.match(_EMO);
  if(em){ const r=T_DICT_N[_west(em[2].trim())]; if(r!=null && r!=='') return lead+em[1]+r+trail; }
  let out=core, ch=false;
  for(const [a,b] of _TOK){ if(out.indexOf(a)>=0){ out=out.split(a).join(b); ch=true; } }
  const w=_west(out); if(w!==out){ out=w; ch=true; }
  return ch? lead+out+trail : raw;
}
function TR(s){ return _uiEN()? _tr(s): s; }
const _SKIP='.notr,.art-body';
function _translateEl(root){
  if(!root) return;
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes=[]; let n; while(n=w.nextNode()) nodes.push(n);
  for(const node of nodes){
    if(node.parentElement && node.parentElement.closest(_SKIP)) continue;
    if(node.__o===undefined) node.__o=node.nodeValue;
    const t=_tr(node.__o);
    if(t!==node.nodeValue) node.nodeValue=t;
  }
  root.querySelectorAll('[placeholder]').forEach(el=>{ if(el.__po===undefined) el.__po=el.getAttribute('placeholder'); const t=T_DICT_N[_west((el.__po||'').trim())]; if(t) el.setAttribute('placeholder',t); });
}
function _restoreEl(root){
  if(!root) return;
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let n; while(n=w.nextNode()){ if(n.__o!==undefined && n.nodeValue!==n.__o) n.nodeValue=n.__o; }
  root.querySelectorAll('[placeholder]').forEach(el=>{ if(el.__po!=null) el.setAttribute('placeholder',el.__po); });
}
let _mo=null;
function _startI18n(){
  if(!_mo) _mo=new MutationObserver(()=>{ if(_uiEN()) applyLang(); });
  try{ _mo.disconnect(); }catch(e){}
  const app=document.getElementById('app'), hd=document.querySelector('header.top');
  if(app) _mo.observe(app,{childList:true,subtree:true,characterData:true});
  if(hd)  _mo.observe(hd,{childList:true,subtree:true,characterData:true});
}
function applyLang(){
  if(!_uiEN()) return;
  if(_mo){ try{_mo.disconnect();}catch(e){} }
  _translateEl(document.querySelector('header.top'));
  _translateEl(document.getElementById('app'));
  _startI18n();
}
function syncLangBtn(){ const b=document.getElementById('langBtn'); if(b){ const s=b.querySelector('.ht'); if(s) s.textContent = _uiEN()?'ع':'EN'; } }
function syncTitle(){ document.title = _uiEN()?'Khafet | Company Dashboard':'خافِت | لوحة المؤسسة'; }
function setUILang(l){
  UILANG=l; try{localStorage.setItem('khafet_uilang',l);}catch(e){}
  document.documentElement.lang = l==='en'?'en':'ar';
  document.documentElement.dir  = l==='en'?'ltr':'rtl';
  if(l==='en') priceLangPicked=false;   // محرّر الأسعار يتبع الواجهة الإنجليزية من جديد
  syncTitle();
  render();
  if(l==='en') applyLang(); else _restoreEl(document.querySelector('header.top'));
  syncLangBtn();
  try{window.scrollTo(0,0);}catch(e){}
}
function toggleLang(){ setUILang(_uiEN()?'ar':'en'); }

document.documentElement.dir  = UILANG==='en'?'ltr':'rtl';

/* 👁 إظهار/إخفاء كلمة المرور — يُطبَّق تلقائياً على أي حقل كلمة مرور يظهر بالصفحة */
const _EYE_OPEN='<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
const _EYE_OFF='<svg viewBox="0 0 24 24"><path d="M10.6 5.2A9.9 9.9 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3 3.8M6.2 6.2A17 17 0 0 0 2 12s3.6 7 10 7a9.8 9.8 0 0 0 4.2-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M2 2l20 20"/></svg>';
function _pwToggle(btn){
  const inp=btn.parentNode.querySelector('input');
  if(!inp) return;
  const show = inp.type==='password';
  inp.type = show?'text':'password';
  btn.innerHTML = show?_EYE_OFF:_EYE_OPEN;
  btn.setAttribute('aria-label', show?'إخفاء كلمة المرور':'إظهار كلمة المرور');
  try{ inp.focus({preventScroll:true}); }catch(e){}
}
function applyPwEyes(){
  document.querySelectorAll('input[type="password"]').forEach(function(inp){
    if(inp.parentNode && inp.parentNode.classList && inp.parentNode.classList.contains('pwwrap')) return;
    const w=document.createElement('span'); w.className='pwwrap';
    inp.parentNode.insertBefore(w, inp); w.appendChild(inp);
    const b=document.createElement('button');
    b.type='button'; b.className='pweye'; b.innerHTML=_EYE_OPEN;
    b.setAttribute('aria-label','إظهار كلمة المرور');
    b.setAttribute('tabindex','-1');
    b.onclick=function(e){ e.preventDefault(); e.stopPropagation(); _pwToggle(b); };
    w.appendChild(b);
  });
}
/* يراقب الصفحة: أي حقل كلمة مرور جديد يُرسم، ينضاف له الزر تلقائياً */
try{
  new MutationObserver(function(){ applyPwEyes(); })
    .observe(document.documentElement,{childList:true,subtree:true});
}catch(e){}
document.addEventListener('DOMContentLoaded', applyPwEyes);
setTimeout(applyPwEyes, 300);
</script>
