<style>

.lang{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding-top:10px}

.lang button{border:0;border-radius:999px;min-height:58px;padding:0 20px;font-size:21px;font-weight:700;background:var(--card);color:var(--ink);cursor:pointer;transition:transform .25s var(--spring)}

.fake.tap::after{content:"👆";position:absolute;inset-inline-end:14px;bottom:-14px;font-size:30px;animation:tap 1.4s ease-in-out infinite}
.fake.pick{background:var(--brown);color:#FFF8EF}
.otp{display:flex;gap:8px;justify-content:center;direction:ltr}
