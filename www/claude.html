<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- شات الإدارة مع Claude: أي رسالة هنا توصل جلسة Claude على جهاز فادية (جدول khafet_claude_chat) والرد يرجع لنفس الصفحة. للإدارة فقط (is_admin) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://zulogtqxbuqxmdmjpzqj.supabase.co wss://zulogtqxbuqxmdmjpzqj.supabase.co; frame-src 'none'; worker-src 'self'" />
<title>خافِت | كلود</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23141414'/><path d='M50 18l7 20 20 7-20 7-7 20-7-20-20-7 20-7z' fill='%23F5C518'/></svg>" />
<meta name="theme-color" content="#141414" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" />
<style>
  :root{ --gold:#F5C518; --gold-soft:#FBF1C9; --gold-tint:#FDF8E7; --gold-deep:#B8860B; --ink:#1A1712; --bg:#FAF7EF; --card:#fff; --muted:#6E685B; --line:#EBE5D6;
    --ok:#15803D; --ok-soft:#DCFCE7; --danger:#DC2626; --teal:#0F766E; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Cairo','Segoe UI',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer}
  [hidden]{display:none!important}
  .top{flex:none;display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 14px 10px;background:var(--card);border-bottom:1px solid var(--line);z-index:5}
  .top .in{display:flex;align-items:center;gap:10px;width:100%;max-width:760px;margin:0 auto}
  .back{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);color:var(--ink);text-decoration:none;background:#fff;flex:none}
  .back svg{transform:scaleX(1)} [dir=ltr] .back svg{transform:scaleX(-1)}
  .who{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
  .avatar{width:44px;height:44px;border-radius:14px;background:var(--ink);color:var(--gold);display:grid;place-items:center;flex:none}
  .who h1{font-size:1.12rem;font-weight:900;line-height:1.15}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:800;color:var(--muted);margin-top:1px;line-height:1.3}
  .pill i{width:9px;height:9px;border-radius:50%;background:#C8C1B2;flex:none}
  .pill.on{color:var(--ok)} .pill.on i{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
  .lang{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font-weight:800;font-size:.82rem;color:var(--muted);flex:none}
  main{flex:1;min-height:0;display:flex;flex-direction:column}
  .list{flex:1;overflow:auto;padding:14px 14px 6px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .wrap{display:flex;flex-direction:column;gap:8px;width:100%;max-width:760px;margin:0 auto;min-height:100%}
  .day{align-self:center;background:#EFE9DA;color:var(--muted);font-size:.74rem;font-weight:800;padding:4px 12px;border-radius:999px;margin:6px 0 2px}
  .msg{display:flex;max-width:100%}
  .msg.me{justify-content:flex-end}
  .msg.ai{justify-content:flex-start}
  .bub{max-width:min(82%,620px);padding:9px 13px 6px;border-radius:18px;box-shadow:0 1px 2px rgba(40,32,10,.05);line-height:1.65;font-size:.98rem;overflow-wrap:anywhere}
  .me .bub{background:var(--gold-soft);border-end-start-radius:6px}
  .ai .bub{background:#fff;border:1px solid var(--line);border-end-end-radius:6px}
  .nm{font-size:.72rem;font-weight:900;color:var(--gold-deep);margin-bottom:1px}
  .ai .nm{color:var(--teal)}
  .tx b{font-weight:900}
  .tx code{font-family:ui-monospace,Consolas,monospace;font-size:.86em;background:rgba(0,0,0,.06);padding:1px 5px;border-radius:6px;direction:ltr;unicode-bidi:embed}
  .tx pre{font-family:ui-monospace,Consolas,monospace;font-size:.82rem;background:#1A1712;color:#F3EEDD;padding:10px 12px;border-radius:12px;overflow:auto;direction:ltr;text-align:left;margin:6px 0;white-space:pre-wrap}
  .tx .li{padding-inline-start:16px;position:relative}
  .tx .li::before{content:'•';position:absolute;inset-inline-start:2px;color:var(--gold-deep)}
  .tx a{color:var(--teal);font-weight:800;word-break:break-all}
  .mt{display:flex;gap:8px;justify-content:flex-end;align-items:center;font-size:.68rem;color:var(--muted);margin-top:2px}
  .st{font-weight:800}
  .st-working .st{color:var(--teal)} .st-done .st{color:var(--ok)} .st-error .st{color:var(--danger)}
  .typing .bub{display:inline-flex;gap:5px;align-items:center;padding:13px 16px}
  .typing i{width:7px;height:7px;border-radius:50%;background:#B8B09C;animation:bl 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
  @keyframes bl{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
  @media (prefers-reduced-motion:reduce){.typing i{animation:none}}
  .empty{margin:auto;text-align:center;color:var(--muted);max-width:430px;padding:24px 10px}
  .empty .big{width:72px;height:72px;border-radius:22px;background:var(--ink);color:var(--gold);display:grid;place-items:center;margin:0 auto 12px}
  .empty h2{font-size:1.15rem;font-weight:900;color:var(--ink);margin-bottom:6px}
  .empty p{font-size:.92rem;line-height:1.7}
  .composer{flex:none;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  .chips{display:flex;gap:6px;overflow:auto;padding-bottom:8px;scrollbar-width:none;max-width:760px;margin:0 auto}
  .chips::-webkit-scrollbar{display:none}
  .chips:empty{display:none}
  .chip{flex:none;border:1px solid var(--line);background:var(--gold-tint);color:var(--gold-deep);border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:800}
  .box{display:flex;gap:8px;align-items:flex-end;max-width:760px;margin:0 auto}
  textarea{flex:1;resize:none;border:1.5px solid var(--line);border-radius:16px;padding:11px 14px;font:inherit;font-size:1rem;line-height:1.5;background:#fff;color:var(--ink);max-height:160px;outline:none}
  textarea:focus{border-color:var(--gold)}
  .send{width:48px;height:48px;border-radius:16px;background:var(--ink);color:var(--gold);display:grid;place-items:center;border:0;flex:none}
  .send:disabled{opacity:.45;cursor:default}
  .send svg{transform:scaleX(-1)} [dir=ltr] .send svg{transform:none}
  .gate{margin:auto;padding:24px 16px;width:100%;max-width:420px;text-align:center}
  .gcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px 20px;box-shadow:0 10px 28px rgba(40,32,10,.06)}
  .gi{width:64px;height:64px;border-radius:20px;background:var(--gold-tint);display:grid;place-items:center;margin:0 auto 10px;font-size:1.8rem}
  .gcard h2{font-size:1.15rem;font-weight:900;margin-bottom:6px}
  .gcard p{color:var(--muted);font-size:.92rem;margin-bottom:16px;line-height:1.7}
  .gbtn{display:inline-block;background:var(--ink);color:#fff;font-weight:900;padding:12px 22px;border-radius:13px;text-decoration:none;border:0;font-size:1rem}
  #toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;z-index:60;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%)}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="back" id="back" href="admin.html" aria-label="الرجوع للوحة الإدارة"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></a>
  <div class="who">
    <div class="avatar"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.3L20.5 10.5l-6.3 2.2L12 19l-2.2-6.3L3.5 10.5l6.3-2.2z"/></svg></div>
    <div><h1 id="ttl">كلود</h1><div id="pill" class="pill off"><i></i><span>…</span></div></div>
  </div>
  <button class="lang" id="langBtn" type="button" onclick="toggleLang()">EN</button>
</div></header>
<main>
  <section id="gate" class="gate" hidden></section>
  <section id="list" class="list" hidden><div class="wrap"></div></section>
</main>
<footer id="composer" class="composer" hidden>
  <div class="chips" id="chips"></div>
  <div class="box">
    <textarea id="ta" rows="1" placeholder="اكتب لكلود وش تبي…" autocomplete="off"></textarea>
    <button id="send" class="send" type="button" onclick="send()" aria-label="إرسال"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg></button>
  </div>
</footer>
<div id="toast" role="status"></div>
<script defer src="vendor/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://zulogtqxbuqxmdmjpzqj.supabase.co';
const SUPABASE_ANON='sb_publishable_ssggqTzT4GG4sreXV1LObQ_C3yiYhaG';
const COLS='id,at,role,sender_id,sender_name,body,status,reply_to';
const HB_FRESH_MS=30000;
let sb=null, MSGS=[], BYID=new Map(), HB=null, ME=null, ch=null, pollT=null, sending=false, unseen=0, maxId=0, toastT=null;
let EN=false; try{ EN=localStorage.getItem('khafet_uilang')==='en'; }catch(e){}
const LX=(a,e)=>EN?e:a;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const SUGS=[
  ['كم طلب عندنا اليوم ومين ما دفع فاتورته؟','How many orders today and who has not paid yet?'],
  ['اعرض شكاوى هذا الأسبوع ووش صار فيها','Show this week\'s complaints and where they stand'],
  ['سوّ لي تقرير بالدخل من أول الشهر','Make me an income report since the start of the month'],
];

function setTitle(){ document.title=(unseen?'('+unseen+') ':'')+LX('خافِت | كلود','Khafet | Claude'); }
function applyLang(){
  document.documentElement.lang=EN?'en':'ar'; document.documentElement.dir=EN?'ltr':'rtl';
  setTitle(); $('ttl').textContent=LX('كلود','Claude'); $('langBtn').textContent=EN?'عربي':'EN';
  $('ta').placeholder=LX('اكتب لكلود وش تبي…','Tell Claude what you need…');
  $('back').setAttribute('aria-label',LX('الرجوع للوحة الإدارة','Back to the admin dashboard'));
  $('send').setAttribute('aria-label',LX('إرسال','Send'));
}
function toggleLang(){ EN=!EN; try{ localStorage.setItem('khafet_uilang',EN?'en':'ar'); }catch(e){} applyLang(); render(); renderPill(); renderChips(); }
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2600); }

function time(ts){ const d=new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function dayKey(ts){ const d=new Date(ts); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dayLabel(ts){
  const k=dayKey(ts); if(k===dayKey(Date.now())) return LX('اليوم','Today'); if(k===dayKey(Date.now()-864e5)) return LX('أمس','Yesterday');
  try{ return new Date(ts).toLocaleDateString(EN?'en-GB':'ar-u-ca-gregory-nu-latn',{weekday:'long',day:'numeric',month:'long'}); }catch(e){ return k; }
}
/* تنسيق خفيف لردود كلود: عريض، كود، روابط، نقاط */
function md(s){
  s=esc(s);
  s=s.replace(/```(?:[a-z]*\n)?([\s\S]*?)```/g,(m,c)=>'<pre>'+c.replace(/^\n+|\n+$/g,'')+'</pre>');
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  s=s.split('\n').map(l=>/^\s*[-•]\s+/.test(l)?'<div class="li">'+l.replace(/^\s*[-•]\s+/,'')+'</div>':l).join('\n');
  s=s.replace(/\n/g,'<br>').replace(/(<\/pre>|<\/div>)<br>/g,'$1').replace(/<br>(<pre>|<div class="li">)/g,'$1');
  return s;
}
function stLabel(m){
  return {new:LX('بانتظار كلود','Waiting for Claude'),seen:LX('وصلت لكلود','Delivered to Claude'),working:LX('كلود يشتغل عليها الآن','Claude is working on it'),done:'✓✓',error:LX('تعذّر التنفيذ','Could not be done')}[m.status]||'';
}
function render(){
  const list=$('list'), wrap=list.querySelector('.wrap');
  const near=list.scrollHeight-list.scrollTop-list.clientHeight<160;
  const rows=MSGS.slice().sort((a,b)=>a.id-b.id);
  let html='';
  if(!rows.length){
    html=`<div class="empty"><div class="big"><svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.3L20.5 10.5l-6.3 2.2L12 19l-2.2-6.3L3.5 10.5l6.3-2.2z"/></svg></div>
      <h2>${LX('اكتب أي طلب أو سؤال عن خافت','Write any request or question about Khafet')}</h2>
      <p>${LX('كلود يستلمه على طول، ينفّذه، ويرد عليك هنا. اللي يمس العملاء أو الأسعار أو النشر يرجع فيه لفادية قبل.','Claude picks it up right away, does it, and replies here. Anything touching customers, prices or publishing is confirmed with Fadia first.')}</p></div>`;
  }
  let lastDay='';
  for(const m of rows){
    const dk=dayKey(m.at); if(dk!==lastDay){ html+=`<div class="day">${esc(dayLabel(m.at))}</div>`; lastDay=dk; }
    const mine=m.role==='user', who=mine?(m.sender_name||LX('الإدارة','Admin')):LX('كلود','Claude');
    html+=`<article class="msg ${mine?'me':'ai'} st-${esc(m.status)}" data-id="${m.id}"><div class="bub"><div class="nm">${esc(who)}</div><div class="tx">${md(m.body)}</div><div class="mt">${mine?`<span class="st">${esc(stLabel(m))}</span>`:''}<span>${time(m.at)}</span></div></div></article>`;
  }
  if(rows.some(m=>m.role==='user'&&(m.status==='seen'||m.status==='working'))) html+=`<div class="msg ai typing" aria-label="${LX('كلود يكتب','Claude is typing')}"><div class="bub"><i></i><i></i><i></i></div></div>`;
  wrap.innerHTML=html;
  if(near) list.scrollTop=list.scrollHeight;
}
function renderChips(){ $('chips').innerHTML=MSGS.length?'':SUGS.map(([a,e])=>`<button class="chip" type="button" data-t="${esc(LX(a,e))}">${esc(LX(a,e))}</button>`).join(''); }
function renderPill(){
  const p=$('pill'); const age=HB?Date.now()-new Date(HB).getTime():Infinity; const on=age<HB_FRESH_MS;
  p.className='pill '+(on?'on':'off');
  p.querySelector('span').textContent=on?LX('متصل الآن','Online now'):LX('غير متصل · رسالتك تنحفظ ويرد أول ما يرجع','Offline · your message is saved and answered when back');
}
setInterval(renderPill,5000);

function upsert(r){
  if(!r||!r.id) return;
  const old=BYID.get(r.id);
  if(old) Object.assign(old,r);
  else{ BYID.set(r.id,r); MSGS.push(r); if(r.role==='assistant'&&document.hidden&&ME){ unseen++; setTitle(); } }
  if(r.id>maxId) maxId=r.id;
}
async function loadAll(initial){
  let qy=sb.from('khafet_claude_chat').select(COLS).order('id',{ascending:false}).limit(initial?150:60);
  if(!initial){
    const open=MSGS.filter(m=>m.role==='user'&&m.status!=='done'&&m.status!=='error').map(m=>m.id);
    qy=qy.or('id.gt.'+maxId+(open.length?',id.in.('+open.join(',')+')':''));
  }
  const [a,b]=await Promise.all([qy, sb.from('khafet_claude_chat_state').select('k,at,v').eq('k','watcher').maybeSingle()]);
  if(a.error) throw a.error;
  (a.data||[]).forEach(upsert);
  if(b&&b.data) HB=b.data.at;
  render(); renderPill(); renderChips();
}
function subscribe(){
  try{
    ch=sb.channel('kc-chat')
      .on('postgres_changes',{event:'*',schema:'public',table:'khafet_claude_chat'},p=>{ if(p.new&&p.new.id){ upsert(p.new); render(); renderChips(); } })
      .on('postgres_changes',{event:'*',schema:'public',table:'khafet_claude_chat_state'},p=>{ if(p.new&&p.new.k==='watcher'){ HB=p.new.at; renderPill(); } })
      .subscribe();
  }catch(e){}
}
function poll(){ clearTimeout(pollT); pollT=setTimeout(async()=>{ if(!document.hidden){ try{ await loadAll(false); }catch(e){} } poll(); },6000); }

function autosize(){ const ta=$('ta'); ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,160)+'px'; }
async function send(){
  const ta=$('ta'), body=ta.value.trim();
  if(!body||sending||!sb) return;
  sending=true; $('send').disabled=true;
  try{
    const {data,error}=await sb.from('khafet_claude_chat').insert({body}).select(COLS).single();
    if(error) throw error;
    upsert(data); ta.value=''; autosize(); render(); renderChips(); $('list').scrollTop=$('list').scrollHeight;
  }catch(e){ toast(LX('تعذّر الإرسال، حاول مرة ثانية','Could not send, try again')); }
  finally{ sending=false; $('send').disabled=false; ta.focus(); }
}

function gate(kind){
  $('list').hidden=true; $('composer').hidden=true;
  const g=$('gate'); g.hidden=false;
  const C={
    login:['🔒',LX('سجّل الدخول من لوحة الإدارة أولًا','Sign in from the admin dashboard first'),LX('هذه الصفحة للإدارة، وتفتح مباشرة بعد الدخول.','This page is for admins and opens right after signing in.'),`<a class="gbtn" href="admin.html">${LX('فتح لوحة الإدارة','Open the admin dashboard')}</a>`],
    noadmin:['🚫',LX('هذه الصفحة للإدارة فقط','This page is for admins only'),LX('حسابك ما عنده صلاحية إدارة. اطلب من فادية تضيفك.','Your account has no admin permission. Ask Fadia to add you.'),`<a class="gbtn" href="admin.html">${LX('الرجوع','Back')}</a>`],
    error:['⚠️',LX('تعذّر فتح الشات','Could not open the chat'),LX('تأكد من الاتصال بالإنترنت ثم حدّث الصفحة.','Check your connection, then refresh the page.'),`<button class="gbtn" type="button" onclick="location.reload()">${LX('تحديث','Refresh')}</button>`],
  }[kind]||[];
  g.innerHTML=`<div class="gcard"><div class="gi">${C[0]}</div><h2>${C[1]}</h2><p>${C[2]}</p>${C[3]}</div>`;
}
async function boot(){
  applyLang();
  try{
    if(!sb){
      if(!window.supabase) throw new Error('nolib');
      sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false},global:{headers:{'X-Client-Info':'khafet-claude/1'}}});
      try{ sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT'){ ME=null; gate('login'); } }); }catch(e){}
    }
    const { data:{ session } }=await sb.auth.getSession();
    if(!session) return gate('login');
    const r=await sb.rpc('staff_role'); if(r.error) throw r.error;
    if(r.data!=='admin') return gate('noadmin');
    ME=session.user.id;
    $('gate').hidden=true; $('list').hidden=false; $('composer').hidden=false;
    await loadAll(true); subscribe(); poll();
    $('list').scrollTop=$('list').scrollHeight;
    if(matchMedia('(pointer:fine)').matches) $('ta').focus();
  }catch(e){ gate('error'); }
}
window.addEventListener('DOMContentLoaded',()=>{
  $('ta').addEventListener('input',autosize);
  $('ta').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey&&(e.ctrlKey||e.metaKey||matchMedia('(pointer:fine)').matches)){ e.preventDefault(); send(); } });
  $('chips').addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; $('ta').value=b.dataset.t; autosize(); $('ta').focus(); });
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ unseen=0; setTitle(); if(ME){ loadAll(false).catch(()=>{}); } } });
  boot();
});
</script>
</body>
