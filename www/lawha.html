<title>خافِت</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F5C518'/%3E%3Cpath d='M14 34 32 18l18 16v16H14z' fill='none' stroke='%2318181b' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E" />

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" />
<style>
/* ═══ لوحة خافت الجديدة (2026-11-13) · أسلوب shadcn/ui: رمادي محايد، حدود 1px، زوايا 10px، ظل خفيف · العربي أولًا ═══ */
:root{
  --bg:#ffffff; --fg:#09090b; --card:#ffffff; --muted:#f4f4f5; --muted-fg:#71717a; --border:#e4e4e7; --input:#e4e4e7; --ring:#a1a1aa;
  --primary:#18181b; --primary-fg:#fafafa; --brand:#F5C518; --brand-ink:#1f1b16; --radius:10px;
  --sh:0 1px 2px rgba(9,9,11,.06); --sh-md:0 8px 24px -12px rgba(9,9,11,.18);
  --green:#16a34a; --green-bg:#ecfdf3; --green-bd:#bbf7d0; --yellow:#ca8a04; --yellow-bg:#fefce8; --yellow-bd:#fde68a;
  --blue:#2563eb; --blue-bg:#eff6ff; --blue-bd:#bfdbfe; --red:#dc2626; --red-bg:#fef2f2; --red-bd:#fecaca;
  --c-dark:#264653; --c-green:#2A9D8F; --c-yellow:#E9C46A; --c-orange:#F4A261; --c-red:#E76F51; --pink:#db2777; --pink-bg:#fdf2f8; --pink-bd:#fbcfe8; --gray:#71717a; --gray-bg:#fafafa; --gray-bd:#e4e4e7;
  --fh:"Cairo","Segoe UI",Tahoma,sans-serif; --fb:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --side:232px; --top:56px;
}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 var(--fb);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{font-family:var(--fh);margin:0;letter-spacing:-.01em}
[hidden]{display:none!important}
::selection{background:#fde68a}
.notr{unicode-bidi:plaintext}
/* ── الهيكل ── */
.top{position:sticky;top:0;z-index:40;height:var(--top);background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 14px}
.top .brand{display:flex;align-items:center;gap:9px;font:800 17px/1 var(--fh);color:var(--fg)}
.top .brand .mk{width:30px;height:30px;border-radius:9px;background:var(--brand);display:grid;place-items:center}
.top .brand .mk svg{width:18px;height:18px}
.top .sp{flex:1}
.ibtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--card);display:grid;place-items:center;color:var(--fg);box-shadow:var(--sh)}
.ibtn:hover{background:var(--muted)}
.ibtn svg{width:18px;height:18px}
.layout{display:grid;grid-template-columns:var(--side) 1fr;min-height:calc(100vh - var(--top))}
.side{border-inline-end:1px solid var(--border);padding:14px 10px;position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow:auto;background:var(--bg)}
.side .grp{font:700 11px/1.4 var(--fh);color:var(--muted-fg);text-transform:uppercase;letter-spacing:.06em;padding:10px 10px 4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;font:600 14px/1.3 var(--fb);color:#3f3f46;text-align:start}
.nav button svg{width:18px;height:18px;flex:0 0 auto;color:#71717a}
.nav button:hover{background:var(--muted)}
.nav button.on{background:var(--muted);color:var(--fg);font-weight:700}
.nav button.on svg{color:var(--fg)}
.nav button .bd{margin-inline-start:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--primary);color:var(--primary-fg);font:700 11px/20px var(--fh);text-align:center}
.nav button .bd.red{background:var(--red)}
.nav button .ext{margin-inline-start:auto;color:#a1a1aa}
main{min-width:0;padding:18px 18px 90px}
.page{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.page>*,.day>*,.card .cb>*,.row,.strip,.strip>*{min-width:0}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph h1{font-size:20px}
.ph .sub{color:var(--muted-fg);font-size:13px}
.ph .sp{flex:1}
/* ── مكونات ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--sh)}
.card .ch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--border)}
.card .ch h2{font-size:15px;white-space:nowrap}
.card .ch .sub{color:var(--muted-fg);font-size:12.5px}
.card .ch .sp{flex:1}
.card .cb{padding:12px 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);font:600 13.5px/1 var(--fb);color:var(--fg);box-shadow:var(--sh);white-space:nowrap}
.btn:hover{background:var(--muted)} .btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)} .btn.pri:hover{background:#27272a}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;box-shadow:none}
.btn.danger{color:var(--red)}
.btn svg{width:16px;height:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--border);background:var(--card);font:600 12.5px/1 var(--fb);color:#3f3f46;display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:var(--muted)} .chip.on{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.chip i{font-style:normal;font-size:11px;opacity:.8}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font:700 11.5px/1 var(--fh);border:1px solid transparent}
.badge.g{background:var(--green-bg);color:#15803d;border-color:var(--green-bd)} .badge.y{background:var(--yellow-bg);color:#a16207;border-color:var(--yellow-bd)}
.badge.b{background:var(--blue-bg);color:#1d4ed8;border-color:var(--blue-bd)} .badge.r{background:var(--red-bg);color:#b91c1c;border-color:var(--red-bd)}
.badge.p{background:var(--pink-bg);color:#be185d;border-color:var(--pink-bd)} .badge.n{background:var(--gray-bg);color:#52525b;border-color:var(--gray-bd)}
/* الأرقام */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{text-align:start;padding:13px 14px;display:grid;gap:4px;transition:transform .12s,box-shadow .12s}
.kpi:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.kpi small{color:var(--muted-fg);font:600 12.5px/1.3 var(--fb)}
.kpi b{font:800 26px/1.1 var(--fh);font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;color:var(--muted-fg);font-size:12px}
.kpi.warn b{color:var(--red)}
/* الأيام */
.day{display:grid;gap:8px}
.day .dh{display:flex;align-items:baseline;gap:10px;padding:2px 2px 0;flex-wrap:wrap}
.day .dh h3{font-size:15px}
.day .dh span{color:var(--muted-fg);font-size:12.5px}
.day .dh .n{font:800 15px/1.2 var(--fh);font-variant-numeric:tabular-nums;color:var(--fg);padding-inline-start:6px;border-inline-start:1px solid var(--border)}
.day .dh .n.g{color:var(--c-green)}
.empty{padding:14px;border:1px dashed var(--border);border-radius:var(--radius);color:var(--muted-fg);text-align:center;font-size:13px}
/* الشرائط: ارتفاع واحد 60px، لون كامل، الوقت ثم الحالة ثم الإجمالي والربح، ويسار: دائرة الرسالة واختصار الرد */
.row{border-radius:var(--radius);box-shadow:var(--sh);transition:box-shadow .2s}
.row.open{box-shadow:var(--sh-md)}
.strip{display:grid;grid-template-columns:72px auto auto 1fr;align-items:center;gap:10px;width:100%;height:60px;padding:0 12px;border:1px solid transparent;border-radius:var(--radius);background:var(--card);text-align:start;color:var(--fg);cursor:pointer;transition:filter .15s}
.strip:hover{filter:brightness(.97)}
.row.open .strip{border-end-start-radius:0;border-end-end-radius:0}
.strip .t{font:800 14px/1.15 var(--fh);font-variant-numeric:tabular-nums;white-space:nowrap}
.strip .t small{display:block;font:600 10.5px/1.3 var(--fb);opacity:.75}
.strip .lb{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.strip .lb b{font:700 13.5px/1.3 var(--fb)}
.strip .lb em{font:600 11.5px/1 var(--fb);font-style:normal;opacity:.85;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.12)}
.strip .mn{display:flex;gap:10px;font:600 12px/1 var(--fb);opacity:.85;font-variant-numeric:tabular-nums;white-space:nowrap}
.strip .mn b{font-weight:800;opacity:1}
.strip .mi{display:flex;align-items:center;gap:8px;justify-self:end;min-width:0;max-width:100%}
.strip .mi .snip{font-size:12px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.strip .mi .rd{font:700 12px/1 var(--fb);padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.9);color:#1f1b16;border:1px solid rgba(0,0,0,.08);white-space:nowrap}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.dot.r{background:var(--c-red)} .dot.g{background:var(--c-green)}
.strip.s-green .dot.g,.strip.s-red .dot.r{background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
/* لوحة فادية: #264653 #2A9D8F #E9C46A #F4A261 #E76F51 */
.strip.s-green{background:var(--c-green);color:#fff}
.strip.s-dark{background:var(--c-dark);color:#fff}
.strip.s-red{background:var(--c-red);color:#fff}
.strip.s-yellow{background:var(--c-yellow);color:#1f1b16}
.strip.s-orange{background:var(--c-orange);color:#1f1b16}
.strip.s-gray{background:#e4e4e7;color:#52525b} .strip.s-gray .lb b{text-decoration:line-through}
.strip.s-lone{background:var(--card);border-color:var(--border);color:var(--fg)}
.strip.s-lone .lb em{background:var(--muted);color:var(--muted-fg)}
.strip.s-lone .mi .rd{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.strip.s-lone .dot{box-shadow:0 0 0 2px var(--card)}
.strip.s-cmp{border-color:#f3c4d3;background:#fff7fa}
/* التمدد الناعم: الرد فوق ثم التفاصيل */
.ex{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.row.open .ex{grid-template-rows:1fr}
.exi{overflow:hidden;min-height:0}
.row.open .exi{border:1px solid var(--border);border-top:0;border-radius:0 0 var(--radius) var(--radius);padding:12px;display:grid;gap:12px;background:var(--card)}
.rp{display:grid;gap:8px}
.ml-list{display:grid;gap:4px}
.ml{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;background:var(--muted);font-size:12.5px;color:#3f3f46}
.ml>span{flex:1;min-width:0;overflow-wrap:anywhere}
.ml small{color:var(--muted-fg);white-space:nowrap;font-variant-numeric:tabular-nums}
.ml .act{display:flex;gap:4px}
.ml .act button{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:#fff;display:grid;place-items:center}
.rb{display:grid;gap:8px;padding:10px;border:1px dashed #cfd4d9;border-radius:9px;background:#fafafa}
.rh{font:700 12px/1.3 var(--fh);color:var(--muted-fg)}
.rbtn{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rbtn .sp{flex:1}
.kv{display:grid;grid-template-columns:76px 1fr;gap:5px 10px;font-size:13px}
.kv small{color:var(--muted-fg);font-weight:600} .kv div{min-width:0;overflow-wrap:anywhere}
.items{display:grid;gap:5px}
.items div{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:12.5px}
.items div b{font-variant-numeric:tabular-nums;white-space:nowrap}
.note{background:var(--muted);border-radius:8px;padding:9px 11px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.note.g{background:#e6f4f1;border:1px solid #bfe3dc}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.acts .sp{flex:1}
textarea.ta{width:100%;min-height:96px;padding:10px 12px;border:1px solid var(--input);border-radius:9px;resize:vertical;background:var(--card);line-height:1.7}
textarea.ta:focus,input.in:focus{outline:2px solid var(--ring);outline-offset:1px}
input.in{width:100%;height:40px;padding:0 12px;border:1px solid var(--input);border-radius:9px;background:var(--card)}
.hint{color:var(--muted-fg);font-size:12px}
.chbtn{width:100%;text-align:start;cursor:pointer} .chbtn .chev{color:var(--muted-fg);font-size:14px}
.card .chbtn:hover{background:var(--muted)} .card>.chbtn:only-child{border-bottom:0}
@media (max-width:900px){
  .strip{grid-template-columns:60px 1fr auto;grid-template-rows:auto auto;row-gap:1px;column-gap:8px;padding:0 10px;align-content:center}
  .strip .t{grid-row:1/3;grid-column:1} .strip .lb{grid-row:1;grid-column:2;align-self:end} .strip .mn{grid-row:2;grid-column:2;align-self:start;font-size:11px;gap:8px} .strip .mi{grid-row:1/3;grid-column:3}
  .strip .mn:empty{display:none} .strip .lb:has(+.mn:empty){grid-row:1/3;align-self:center}
  .strip .mi .snip{display:none}
  .strip .lb b{font-size:13px}
  .day .dh span{display:none} .day .dh .n{font-size:14px}
}
/* الرسم */
.chart{width:100%;height:170px;display:block}
.chart text{font:600 10.5px var(--fb);fill:var(--muted-fg)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted-fg);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
/* المزيد */
.more{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.more button{display:flex;align-items:center;gap:9px;padding:11px 12px;border:1px solid var(--border);border-radius:9px;background:var(--card);font:600 13px/1.3 var(--fb);text-align:start;box-shadow:var(--sh)}
.more button:hover{background:var(--muted)}
.more button svg{width:18px;height:18px;color:#71717a;flex:0 0 auto}
/* التواريخ */
.dates{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.dates::-webkit-scrollbar{display:none}
.dates button{flex:0 0 auto;width:56px;padding:7px 4px;border:1px solid var(--border);border-radius:9px;background:var(--card);display:grid;gap:1px;text-align:center;position:relative}
.dates button small{font:600 10.5px/1.2 var(--fb);color:var(--muted-fg)} .dates button b{font:800 16px/1.1 var(--fh)} .dates button span{font:600 10px/1.2 var(--fb);color:var(--muted-fg)}
.dates button.on{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)} .dates button.on small,.dates button.on span{color:#d4d4d8}
.dates button i{position:absolute;top:-6px;inset-inline-end:-4px;min-width:18px;height:18px;border-radius:999px;background:var(--blue);color:#fff;font:700 10.5px/18px var(--fh);padding:0 5px;font-style:normal}
.dates button i.red{background:var(--red)}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sum div{padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--card)}
.sum small{display:block;color:var(--muted-fg);font-size:12px} .sum b{font:800 18px/1.2 var(--fh);font-variant-numeric:tabular-nums}
/* القائمة ⋯ */
.menu{position:fixed;top:calc(var(--top) + 4px);inset-inline-end:12px;z-index:60;min-width:220px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh-md);padding:6px;display:grid;gap:2px}
.menu button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font:600 13.5px/1.3 var(--fb);text-align:start;width:100%}
.menu button:hover{background:var(--muted)} .menu button svg{width:17px;height:17px;color:#71717a}
.menu .sep{height:1px;background:var(--border);margin:4px 6px}
.menu .lbl{padding:6px 10px 2px;font:700 11px/1.3 var(--fh);color:var(--muted-fg)}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(9,9,11,.35)}
/* الدخول */
.login{max-width:380px;margin:12vh auto 0;display:grid;gap:12px;padding:22px}
.login .mk{width:48px;height:48px;border-radius:14px;background:var(--brand);display:grid;place-items:center;margin:0 auto 6px}
.login h1{font-size:20px;text-align:center}
.login p{margin:0;color:var(--muted-fg);text-align:center;font-size:13.5px}
.login label{display:flex;gap:8px;align-items:center;font-size:13px;color:#3f3f46}
.login .err{color:var(--red);font-weight:700;font-size:13px;text-align:center}
/* الشريط السفلي للجوال */
.bottom{display:none;position:fixed;bottom:0;inset-inline:0;z-index:40;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.bottom button{flex:1;display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:9px;font:600 11px/1.2 var(--fb);color:#71717a;position:relative}
.bottom button svg{width:20px;height:20px} .bottom button.on{color:var(--fg);background:var(--muted)}
.bottom button .bd{position:absolute;top:2px;inset-inline-end:calc(50% - 20px);min-width:16px;height:16px;border-radius:999px;background:var(--red);color:#fff;font:700 10px/16px var(--fh);padding:0 4px}
.toast{position:fixed;bottom:calc(74px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:calc(100% - 32px);background:var(--primary);color:var(--primary-fg);padding:10px 14px;border-radius:10px;font:600 13px/1.4 var(--fb);z-index:90;box-shadow:var(--sh-md);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.demo{background:var(--yellow-bg);border:1px solid var(--yellow-bd);color:#854d0e;border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:600}
@media (max-width:900px){
  .layout{grid-template-columns:1fr} .side{display:none} main{padding:14px 14px 92px} .bottom{display:flex}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .kpi b{font-size:22px}
  .sum{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){.kpi,.strip,.ex{transition:none}}
</style>
</head>
<body>
<header class="top">

function stripState(o){
  const f=FIN.get(o.dbId);
  if(o.status==='cancelled') return {c:'gray', lb:LX('ملغي','Cancelled')};
  const total=f? +f.total||0 : (o.finalPrice||o.price||0);
  const due=f? +f.due||0 : o.due;
  const paidAll=f? f.pay_state==='paid' : (o.payStatus==='paid'||(o.paid>0&&o.due<=0));
  const invoiced=f? (!!f.invoiced||!!f.wa_at) : o.invoicedApp;
  if(o.status==='done'){
    if(paidAll && total>0) return {c:'green', lb:LX('مكتمل ودفع','Done & paid')};
    if(!invoiced && !(total>0)) return {c:'yellow', lb:LX('مكتمل بدون فاتورة','Done, no invoice')};
    if(due>0||!paidAll){
      const since=o.doneAt?Math.floor((Date.now()-new Date(o.doneAt).getTime())/864e5):daysBetween(o.date,todayISO());
      return since>2 ? {c:'red', lb:LX('متأخر بالدفع','Payment overdue'), since} : {c:'yellow', lb:LX('مكتمل وما دفع','Done, unpaid')};
    }
    return {c:'green', lb:LX('مكتمل','Done')};
  }
  if(o.status==='progress'||o.arrived||o.onTheWay) return {c:'yellow', lb:LX('قيد التنفيذ','In progress')};
  if(invoiced && due>0) return {c:'yellow', lb:LX('فاتورة بانتظار الدفع','Invoice awaiting payment')};
  if(o.status==='new') return {c:'orange', lb:LX('بانتظار التأكيد','Awaiting confirmation')};
  return {c:'dark', lb:LX('محجوز','Booked')};
}

function filterFn(k){

  if(k==='new') return o=>o.status==='new';
  return o=>{ if(o.status==='cancelled') return false; const s=stripState(o); if(k==='work') return s.c==='yellow'&&(o.status==='progress'||o.onTheWay||o.arrived); if(k==='unpaid') return o.status==='done'&&(s.c==='yellow'||s.c==='red'); if(k==='late') return s.c==='red'; if(k==='book') return s.c==='dark'||s.c==='orange'; return true; };
}

function msgsOf(key){ if(ATT.byOrder.has(key)) return ATT.byOrder.get(key); const it=msgItems().find(i=>i.key===key); return it?[it]:[]; }
function targetOf(key){ const ms=msgsOf(key); return ms.filter(m=>m.open).slice(-1)[0]||null; }
function localDraft(t, draft){
  const d=(draft||'').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,'').replace(/\s+/g,' ').trim();
  if(t.kind==='cmp'){ const K={quality:'نعتذر إن الشغل ما كان بالمستوى المطلوب. بنرسل لك الفني يراجع الشغل ويعدّله بدون أي تكلفة إضافية، وقول لنا الوقت اللي يناسبك.',late:'نعتذر عن التأخير، وهذا شي ما نرضاه. راجعنا الموضوع مع الفريق، وبنحرص إن الموعد الجاي يكون أدق.',price:'نقدّر ملاحظتك على السعر. بنراجع الفاتورة بند بند ونوضّح لك كل بند، ولو فيه أي خطأ نصحّحه على طول.',tech:'نعتذر عن أسلوب التعامل، وهذا ما يمثّل خافت. وصلت ملاحظتك للإدارة وتعاملنا معها.',app:'نعتذر عن المشكلة في التطبيق أو الدفع. فريقنا يراجعها الحين، ولو تحتاج تكمّل طلبك نقدر نكمّله لك من هنا.'};
    return (d||K[t.c.kind]||'وصلت ملاحظتك للإدارة. بنراجعها ونرجع لك بأقرب وقت.')+'\nونعتذر عن أي إزعاج، ونحن بالخدمة دائمًا.'; }
  return d? d.replace(/[.،,]*$/,'.')+' وشكرًا لتواصلك معنا.' : 'وصلتنا رسالتك، وبنرد عليك بالتفصيل خلال وقت قصير.';
}
async function prepDraft(key){

  DRAFT[key]={text:localDraft(t,''), busy:false, via:'tpl', touched:false}; syncTa(key);
  const out=await askSuggest(t,''); if(out&&out.ok&&out.text&&DRAFT[key]&&!DRAFT[key].touched){ DRAFT[key]={text:out.text,busy:false,via:out.via,touched:false}; syncTa(key); }
}
async function askSuggest(t, draft){
  try{
    let auth=SUPABASE_ANON;
    if(!DEMO){ if(!sb) return null; const { data:{ session } }=await sb.auth.getSession(); if(!session) return null; auth=session.access_token; }
    const r=await fetch(SUPABASE_URL+'/functions/v1/wa-bot/suggest-reply',{ method:'POST', headers:{ apikey:SUPABASE_ANON, Authorization:'Bearer '+auth, 'Content-Type':'application/json' }, body:JSON.stringify({ kind:t.kind==='cmp'?(t.c.kind||'other'):'msg', text:t.text, name:t.name, order_no:t.kind==='cmp'?t.c.order_no:'', draft, demo:DEMO, phone:t.phone||'', at:new Date(t.ts).toISOString() }) });
    return await r.json(); }catch(e){ return null; }

async function sendDraft(key){

  DRAFT[key]=Object.assign(DRAFT[key]||{},{busy:true}); render();
  if(DEMO){ await new Promise(r=>setTimeout(r,500)); if(t.kind==='cmp'){ t.c.reply=text; t.c.status='progress'; } else MSTATE[t.key]='done'; DRAFT[key]={text:'',busy:false}; render(); toast(LX('✅ (تجريبي) انرسل الرد','✅ (demo) sent')); return; }
  let w=null;

      const r=await sb.from('khafet_complaints').update({reply:text, status:st}).eq('id',t.id).select('id'); if(r.error) throw r.error; t.c.reply=text; t.c.status=st;

      if(w&&w.ok){ MSTATE[t.key]='done'; sb.from('khafet_admin_msg_state').upsert({msg_key:t.key, state:'done', at:new Date().toISOString()}).then(()=>{}); }
    }
  }catch(e){ w={ok:false}; }
  DRAFT[key]={text:(w&&w.ok)?'':text, busy:false, touched:true}; render();

  else toast(LX('تعذّر الإرسال بالواتساب','WhatsApp send failed'));
}

window.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(MENU){ MENU=false; renderOverlay(); } else if(OPEN){ OPEN=null; render(); } } });

async function initCloud(){
  try{ await khRestore(); }catch(e){}
  const remembered=(()=>{ try{ return localStorage.getItem('khafet_admin_ok')==='1' && localStorage.getItem('khafet_remember')!=='0'; }catch(e){ return false; } })();
  if(remembered && !loggedIn){ loggedIn=true; render(); }
  try{
    if(window.supabase){
      sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON,KH_AUTH_OPTS); cloudReady=true;
      const { data:{ session }, error:sessErr }=await sb.auth.getSession();
      if(session){
        if(localStorage.getItem('khafet_remember')==='0'){ try{ await sb.auth.signOut(); }catch(e){} loggedIn=false; render(); return; }
        const ok=await isAdminUser();
        if(ok===true || (ok==='err' && localStorage.getItem('khafet_admin_ok')==='1')){ if(ok===true) localStorage.setItem('khafet_admin_ok','1'); loggedIn=true; render(); loadCore(); subscribe(); initPush(); return; }
        if(ok===false){ try{ await sb.auth.signOut(); }catch(e){} localStorage.removeItem('khafet_admin_ok'); }
      } else if(sessErr && admNetErr(sessErr)){ /* بلا نت: نبقي الشاشة */ }
      else { try{ localStorage.removeItem('khafet_admin_ok'); }catch(e){} }
      loggedIn=false; render(); return;
    }
  }catch(e){}
  render();
}
