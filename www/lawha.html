<title>خافِت</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F5C518'/%3E%3Cpath d='M14 34 32 18l18 16v16H14z' fill='none' stroke='%2318181b' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E" />

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" />
<style>
/* ═══ لوحة خافت الجديدة (2026-11-13) · أسلوب shadcn/ui: رمادي محايد، حدود 1px، زوايا 10px، ظل خفيف · العربي أولًا ═══ */
:root{
  --bg:#ffffff; --fg:#09090b; --card:#ffffff; --muted:#f4f4f5; --muted-fg:#71717a; --border:#e4e4e7; --input:#e4e4e7; --ring:#a1a1aa;
  --primary:#18181b; --primary-fg:#fafafa; --brand:#F5C518; --brand-ink:#1f1b16; --radius:10px;
  --sh:0 1px 2px rgba(9,9,11,.06); --sh-md:0 8px 24px -12px rgba(9,9,11,.18);
  --green:#16a34a; --green-bg:#ecfdf3; --green-bd:#bbf7d0; --yellow:#ca8a04; --yellow-bg:#fefce8; --yellow-bd:#fde68a;
  --blue:#2563eb; --blue-bg:#eff6ff; --blue-bd:#bfdbfe; --red:#dc2626; --red-bg:#fef2f2; --red-bd:#fecaca;
  --c-dark:#264653; --c-green:#2A9D8F; --c-yellow:#E9C46A; --c-orange:#F4A261; --c-red:#E76F51; --pink:#db2777; --pink-bg:#fdf2f8; --pink-bd:#fbcfe8; --gray:#71717a; --gray-bg:#fafafa; --gray-bd:#e4e4e7;
  --fh:"Cairo","Segoe UI",Tahoma,sans-serif; --fb:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --side:232px; --top:56px;
}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 var(--fb);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{font-family:var(--fh);margin:0;letter-spacing:-.01em}
[hidden]{display:none!important}
::selection{background:#fde68a}
.notr{unicode-bidi:plaintext}
/* ── الهيكل ── */
.top{position:sticky;top:0;z-index:40;height:var(--top);background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 14px}
.top .brand{display:flex;align-items:center;gap:9px;font:800 17px/1 var(--fh);color:var(--fg)}
.top .brand .mk{width:30px;height:30px;border-radius:9px;background:var(--brand);display:grid;place-items:center}
.top .brand .mk svg{width:18px;height:18px}
.top .sp{flex:1}
.ibtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--card);display:grid;place-items:center;color:var(--fg);box-shadow:var(--sh)}
.ibtn:hover{background:var(--muted)}
.ibtn svg{width:18px;height:18px}
.layout{display:grid;grid-template-columns:var(--side) 1fr;min-height:calc(100vh - var(--top))}
.side{border-inline-end:1px solid var(--border);padding:14px 10px;position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow:auto;background:var(--bg)}
.side .grp{font:700 11px/1.4 var(--fh);color:var(--muted-fg);text-transform:uppercase;letter-spacing:.06em;padding:10px 10px 4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;font:600 14px/1.3 var(--fb);color:#3f3f46;text-align:start}
.nav button svg{width:18px;height:18px;flex:0 0 auto;color:#71717a}
.nav button:hover{background:var(--muted)}
.nav button.on{background:var(--muted);color:var(--fg);font-weight:700}
.nav button.on svg{color:var(--fg)}
.nav button .bd{margin-inline-start:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--primary);color:var(--primary-fg);font:700 11px/20px var(--fh);text-align:center}
.nav button .bd.red{background:var(--red)}
.nav button .ext{margin-inline-start:auto;color:#a1a1aa}
main{min-width:0;padding:18px 18px 90px}
.page{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.page>*,.day>*,.card .cb>*,.row,.strip,.strip>*{min-width:0}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph h1{font-size:20px}
.ph .sub{color:var(--muted-fg);font-size:13px}
.ph .sp{flex:1}
/* ── مكونات ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--sh)}
.card .ch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--border)}
.card .ch h2{font-size:15px;white-space:nowrap}
.card .ch .sub{color:var(--muted-fg);font-size:12.5px}
.card .ch .sp{flex:1}
.card .cb{padding:12px 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);font:600 13.5px/1 var(--fb);color:var(--fg);box-shadow:var(--sh);white-space:nowrap}
.btn:hover{background:var(--muted)} .btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)} .btn.pri:hover{background:#27272a}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;box-shadow:none}
.btn.danger{color:var(--red)}
.btn svg{width:16px;height:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--border);background:var(--card);font:600 12.5px/1 var(--fb);color:#3f3f46;display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:var(--muted)} .chip.on{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.chip i{font-style:normal;font-size:11px;opacity:.8}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font:700 11.5px/1 var(--fh);border:1px solid transparent}
.badge.g{background:var(--green-bg);color:#15803d;border-color:var(--green-bd)} .badge.y{background:var(--yellow-bg);color:#a16207;border-color:var(--yellow-bd)}
.badge.b{background:var(--blue-bg);color:#1d4ed8;border-color:var(--blue-bd)} .badge.r{background:var(--red-bg);color:#b91c1c;border-color:var(--red-bd)}
.badge.p{background:var(--pink-bg);color:#be185d;border-color:var(--pink-bd)} .badge.n{background:var(--gray-bg);color:#52525b;border-color:var(--gray-bd)}
/* الأرقام */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{text-align:start;padding:13px 14px;display:grid;gap:4px;transition:transform .12s,box-shadow .12s}
.kpi:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.kpi small{color:var(--muted-fg);font:600 12.5px/1.3 var(--fb)}
.kpi b{font:800 26px/1.1 var(--fh);font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;color:var(--muted-fg);font-size:12px}
.kpi.warn b{color:var(--red)}
/* الأيام */
.day{display:grid;gap:8px}
.day .dh{display:flex;align-items:baseline;gap:10px;padding:2px 2px 0;flex-wrap:wrap}
.day .dh h3{font-size:15px}
.day .dh span{color:var(--muted-fg);font-size:12.5px}
.day .dh .n{font:800 15px/1.2 var(--fh);font-variant-numeric:tabular-nums;color:var(--fg);padding-inline-start:6px;border-inline-start:1px solid var(--border)}
.day .dh .n.g{color:var(--c-green)}
.empty{padding:14px;border:1px dashed var(--border);border-radius:var(--radius);color:var(--muted-fg);text-align:center;font-size:13px}
/* الشرائط: ارتفاع واحد 60px، لون كامل، الوقت ثم الحالة ثم الإجمالي والربح، ويسار: دائرة الرسالة واختصار الرد */
.row{border-radius:var(--radius);box-shadow:var(--sh);transition:box-shadow .2s}
.row.open{box-shadow:var(--sh-md)}
.row{position:relative}
.hx{position:absolute;inset-inline-end:8px;top:16px;width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.9);color:#1f1b16;display:grid;place-items:center;cursor:pointer;z-index:1}
.hx:hover{background:#fff}
.strip{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;height:60px;padding:0 44px 0 12px;padding-inline-start:12px;padding-inline-end:44px;border:1px solid transparent;border-radius:var(--radius);background:var(--card);text-align:start;color:var(--fg);cursor:pointer;transition:filter .15s}
.strip:hover{filter:brightness(.97)}
.row.open .strip{border-end-start-radius:0;border-end-end-radius:0}
.strip .t{font:800 14px/1.15 var(--fh);font-variant-numeric:tabular-nums;white-space:nowrap}
.strip .t small{display:block;font:600 10.5px/1.3 var(--fb);opacity:.75}
.strip .lb{display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden}
.strip .lb b{font:800 14px/1.3 var(--fh);overflow:hidden;text-overflow:ellipsis;min-width:0}
.strip .lb em{font:600 11.5px/1 var(--fb);font-style:normal;opacity:.85;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.12)}
.strip .mn{display:flex;gap:10px;font:600 12px/1 var(--fb);opacity:.85;font-variant-numeric:tabular-nums;white-space:nowrap}
.strip .mn b{font-weight:800;opacity:1}
.strip .mi{display:flex;align-items:center;gap:8px;justify-self:end;min-width:0;max-width:100%}
.strip .mi .snip{font-size:12px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.strip .mi .rd{font:700 12px/1 var(--fb);padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.9);color:#1f1b16;border:1px solid rgba(0,0,0,.08);white-space:nowrap}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.dot.r{background:var(--c-red)} .dot.g{background:var(--c-green)} .dot.y{background:var(--c-yellow)} .dot.n{background:#d4d4d8}
.tri{border-radius:9px;padding:9px 11px;font-size:12.5px;display:grid;gap:3px;border:1px solid var(--border);background:var(--muted)}
.tri.r{background:#fdf1ee;border-color:#f3c7bd} .tri.g{background:#e6f4f1;border-color:#bfe3dc} .tri.n{color:var(--muted-fg)}
.tri .th{display:flex;align-items:center;gap:6px;flex-wrap:wrap} .tri .th b{font:800 13px/1.3 var(--fh)} .tri.r .th b{color:#b3412a} .tri.g .th b{color:#1d7a6c}
.tri small{color:var(--muted-fg)}
.strip.s-green .dot.g,.strip.s-red .dot.r{background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
/* لوحة فادية: #264653 #2A9D8F #E9C46A #F4A261 #E76F51 */
.strip.s-green{background:var(--c-green);color:#fff}
.strip.s-dark{background:var(--c-dark);color:#fff}
.strip.s-red{background:var(--c-red);color:#fff}
.strip.s-yellow{background:var(--c-yellow);color:#1f1b16}
.strip.s-orange{background:var(--c-orange);color:#1f1b16}
.strip.s-gray{background:#e4e4e7;color:#52525b} .strip.s-gray .lb b{text-decoration:line-through}
.strip.s-lone{background:var(--card);border-color:var(--border);color:var(--fg)}
.strip.s-lone .lb em{background:var(--muted);color:var(--muted-fg)}
.strip.s-lone .mi .rd{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.strip.s-lone .dot{box-shadow:0 0 0 2px var(--card)}
.strip.s-cmp{border-color:#f3c4d3;background:#fff7fa}
/* التمدد الناعم: الرد فوق ثم التفاصيل */
.ex{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.row.open .ex{grid-template-rows:1fr}
.exi{overflow:hidden;min-height:0}
.row.open .exi{border:1px solid var(--border);border-top:0;border-radius:0 0 var(--radius) var(--radius);padding:12px;display:grid;gap:12px;background:var(--card)}
.rp{display:grid;gap:8px}
.ml-list{display:grid;gap:4px}
.ml{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;background:var(--muted);font-size:12.5px;color:#3f3f46}
.ml.me{background:#e6f4f1;color:#0f5a50;margin-inline-start:28px} .ml.me svg{flex:0 0 auto;color:var(--c-green)}
.ml.ack{opacity:.6}
.ml>span{flex:1;min-width:0;overflow-wrap:anywhere}
.ml small{color:var(--muted-fg);white-space:nowrap;font-variant-numeric:tabular-nums}
/* المحادثة: مربع واحد، فقاعات العميل يمين وردودك يسار، وأحداث الطلب كأسطر وسط (فادية 2026-11-13) */
.thread{display:grid;gap:6px;padding:10px;border-radius:10px;background:var(--muted)}
.thh{display:flex;align-items:center;gap:8px;font:800 12.5px/1.3 var(--fh);color:var(--muted-fg);margin-bottom:2px}
.stsel{appearance:none;-webkit-appearance:none;border:1px solid var(--border);border-radius:999px;padding:6px 12px;font:700 12px/1 var(--fb);background:#fff;color:#1f1b16;cursor:pointer}
.stsel.open{background:#fdf1ee;border-color:#f3c7bd;color:#b3412a} .stsel.done{background:#e6f4f1;border-color:#bfe3dc;color:#1d7a6c}
.bb{justify-self:start;max-width:88%;padding:7px 10px;border-radius:12px 12px 12px 3px;background:#fff;font-size:12.5px;color:#27272a;overflow-wrap:anywhere;white-space:pre-wrap;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.bb.me{justify-self:end;background:#dcefe9;color:#0f5a50;border-radius:12px 12px 3px 12px}
.bb.ack{opacity:.6}
.bb small{display:block;font-size:10.5px;color:var(--muted-fg);margin-top:3px;white-space:normal;font-variant-numeric:tabular-nums}
.bb b{font-weight:800}
.ev{justify-self:center;display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted-fg);padding:3px 10px;border:1px dashed #cfd4d9;border-radius:999px;background:#fff;font-variant-numeric:tabular-nums}
.ev svg{color:var(--c-green)}
.trl{font-size:12.5px;padding:7px 10px;border-radius:9px;border:1px solid var(--border);background:var(--muted)}
.trl.r{background:#fdf1ee;border-color:#f3c7bd;color:#b3412a} .trl.g{background:#e6f4f1;border-color:#bfe3dc;color:#1d7a6c} .trl.n{color:var(--muted-fg)}
.rb{display:grid;gap:8px;padding:10px;border:1px dashed #cfd4d9;border-radius:9px;background:#fafafa}
.rh{font:700 12px/1.3 var(--fh);color:var(--muted-fg)}
.rbtn{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rbtn .sp{flex:1}
.kv{display:grid;grid-template-columns:76px 1fr;gap:5px 10px;font-size:13px}
.kv small{color:var(--muted-fg);font-weight:600} .kv div{min-width:0;overflow-wrap:anywhere}
.items{display:grid;gap:5px}
.items div{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:12.5px}
.items div b{font-variant-numeric:tabular-nums;white-space:nowrap}
.note{background:var(--muted);border-radius:8px;padding:9px 11px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.note.g{background:#e6f4f1;border:1px solid #bfe3dc}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.acts .sp{flex:1}
textarea.ta{width:100%;min-height:96px;padding:10px 12px;border:1px solid var(--input);border-radius:9px;resize:vertical;background:var(--card);line-height:1.7}
textarea.ta:focus,input.in:focus{outline:2px solid var(--ring);outline-offset:1px}
input.in{width:100%;height:40px;padding:0 12px;border:1px solid var(--input);border-radius:9px;background:var(--card)}
.bcbtn{margin-top:-4px;padding:10px;border:1px solid var(--border);border-top:0;border-radius:0 0 9px 9px;text-align:center;font:700 13px var(--fb);color:#0b57d0;background:#fff}
.bcl{border:1px solid var(--border);border-radius:9px;overflow:hidden}
.bclh{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--muted);font-size:13px} .bclh input.in{height:32px;flex:1;min-width:0;font-size:13px}
.bcrows{max-height:320px;overflow:auto;display:grid}
.bcr{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;align-items:center;gap:8px;padding:7px 10px;border-top:1px solid var(--border);font-size:12.5px;cursor:pointer}
.bcr b{font:700 13px var(--fb);overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .bcr span{font-variant-numeric:tabular-nums;color:var(--muted-fg)} .bcr small{color:var(--muted-fg);white-space:nowrap} .bcr em{font-style:normal;font-size:10.5px;padding:2px 7px;border-radius:999px;background:#e6f4f1;color:#1d7a6c}
.bcr.off{opacity:.45} .bcr input{width:16px;height:16px}
.audr{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted-fg)} .audr input.in.n{width:72px;height:34px;padding:0 8px;text-align:center;font:700 14px var(--fh);color:#1f1b16}
.hint{color:var(--muted-fg);font-size:12px}
.chbtn{width:100%;text-align:start;cursor:pointer} .chbtn .chev{color:var(--muted-fg);font-size:14px}
.card .chbtn:hover{background:var(--muted)} .card>.chbtn:only-child{border-bottom:0}
@media (max-width:900px){
  .strip{grid-template-columns:minmax(0,1fr) auto;column-gap:8px;padding-inline-start:10px;padding-inline-end:42px}
  .strip .lb{gap:6px} .strip .lb em{font-size:11px}
  .strip .mi .snip{display:none}
  .strip .lb b{font-size:13px}
  .day .dh span{display:none} .day .dh .n{font-size:14px}
}
/* الرسم */
.chart{width:100%;height:170px;display:block}
.chart text{font:600 10.5px var(--fb);fill:var(--muted-fg)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted-fg);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
/* المزيد */
.more{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.more button{display:flex;align-items:center;gap:9px;padding:11px 12px;border:1px solid var(--border);border-radius:9px;background:var(--card);font:600 13px/1.3 var(--fb);text-align:start;box-shadow:var(--sh)}
.more button:hover{background:var(--muted)}
.more button svg{width:18px;height:18px;color:#71717a;flex:0 0 auto}
/* التواريخ */
.dates{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.dates::-webkit-scrollbar{display:none}
.dates button{flex:0 0 auto;width:56px;padding:7px 4px;border:1px solid var(--border);border-radius:9px;background:var(--card);display:grid;gap:1px;text-align:center;position:relative}
.dates button small{font:600 10.5px/1.2 var(--fb);color:var(--muted-fg)} .dates button b{font:800 16px/1.1 var(--fh)} .dates button span{font:600 10px/1.2 var(--fb);color:var(--muted-fg)}
.dates button.on{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)} .dates button.on small,.dates button.on span{color:#d4d4d8}
.dates button i{position:absolute;top:-6px;inset-inline-end:-4px;min-width:18px;height:18px;border-radius:999px;background:var(--blue);color:#fff;font:700 10.5px/18px var(--fh);padding:0 5px;font-style:normal}
.dates button i.red{background:var(--red)}

async function bcCancel(){
  if(!BC.cur) return; const sent=(BC.prog&&BC.prog.sent)||BC.cur.sent||0;
  if(!confirm(sent?LX('إلغاء الحملة؟ انرسلت لـ'+sent+' رقم وما ينرسل للباقي.','Cancel? Already sent to '+sent+'. The rest will not be sent.'):LX('إلغاء هذه الرسالة؟ ما ينرسل شي.','Cancel this message? Nothing will be sent.'))) return;
  BC.stop=true; const r=await bcApi({mode:'cancel',id:BC.cur.id}); clearTimeout(BC.pollT);
  BC.cur=null; BC.prog=null; BC.busy=false; render(); toast(r&&r.ok?LX('أُلغيت الرسالة','Message cancelled'):LX('تعذّر الإلغاء','Could not cancel')); bcList();
}
async function bcPrepare(){
  const t=BC.text.trim(); if(t.length<10){ toast(LX('اكتب الرسالة أول','Write the message first')); return; }
  if(!confirm(LX('تجهيز القالب عند واتساب بهذا النص؟ ما ينرسل شي الحين، الإرسال بعد الاعتماد وبزر منك.','Prepare the WhatsApp template with this text?'))) return;
  BC.busy=true; render(); const r=await bcApi({mode:'prepare',text:t,aud:bcAud(),exclude:bcExList(),btn:BC.btn||''}); BC.busy=false;
  if(!r.ok){ toast(LX('تعذّر إنشاء القالب: ','Template failed: ')+(r.tpl_reason||r.reason||'')); render(); return; }
  BC.cur=Object.assign({_n:0,text:t},r); render(); bcPoll();
}
async function bcPoll(){
  clearTimeout(BC.pollT); if(!BC.cur||BC.cur.tpl_status==='APPROVED'||BC.cur.tpl_status==='REJECTED') return;
  const r=await bcApi({mode:'status',id:BC.cur.id}); if(r&&r.ok){ BC.cur=Object.assign(BC.cur,r,{_n:(BC.cur._n||0)+1}); render(); }
  if(BC.cur.tpl_status==='PENDING') BC.pollT=setTimeout(bcPoll,20000);
}
async function bcSend(){
  if(!BC.cur||BC.cur.tpl_status!=='APPROVED') return;
  const n=BC.cur.total||(BC.prev&&BC.prev.total)||0;
  if(!confirm(LX('إرسال الرسالة الآن إلى '+n+' رقم؟ ما ينفع التراجع بعدها.','Send now to '+n+' numbers? This cannot be undone.'))) return;
  BC.busy=true; BC.stop=false; BC.prog={sent:0,failed:0,total:n,remaining:n}; render();
  for(let i=0;i<60&&!BC.stop;i++){ const r=await bcApi({mode:'send',id:BC.cur.id}); if(BC.stop||!BC.cur) break; if(!r.ok){ toast(LX('توقف الإرسال: ','Stopped: ')+(r.reason||'')); break; } BC.prog=r; render(); if(r.done) break; }
  BC.busy=false; render(); if(BC.stop) return; if(BC.prog&&BC.prog.done){ toast(LX('✅ انرسلت لـ'+BC.prog.sent+' رقم','✅ Sent to '+BC.prog.sent)); BC.cur=null; BC.text=''; BC.prev=null; bcList(); }
}

let CH={range:14, rows:null, busy:false};
const CH_RANGES=[[7,'أسبوع','Week'],[14,'أسبوعان','2 weeks'],[30,'شهر بالأسابيع','Month by weeks'],[90,'3 أشهر','3 months']];

function chartSeries(){
  const t=todayISO(), R=CH.range, src=R>14?(CH.rows||[]):null, out=[];
  const cntOf=(a,b)=> src? src.filter(r=>r.date>=a&&r.date<=b&&r.status!=='cancelled').length : ORDERS.filter(o=>o.date>=a&&o.date<=b&&o.status!=='cancelled').length;
  const profOf=(a,b)=> (src||FINROWS).filter(r=>r.date>=a&&r.date<=b&&r.status!=='cancelled').reduce((s,r)=>s+(+r.profit||0),0);
  if(R<=14){ for(let i=R-1;i>=0;i--){ const d=addDays(t,-i); out.push({a:d,b:d,lb:String(parseISO(d).getDate())}); } }
  else if(R===30){ for(let w=3;w>=0;w--){ const b=addDays(t,-7*w), a=addDays(b,-6); out.push({a,b,lb:parseISO(a).getDate()+'–'+parseISO(b).getDate()}); } }
  else { const d=parseISO(t); for(let k=2;k>=0;k--){ const f=new Date(d.getFullYear(),d.getMonth()-k,1), l=new Date(d.getFullYear(),d.getMonth()-k+1,0); out.push({a:isoOf(f.getTime()),b:isoOf(Math.min(l.getTime(),d.getTime())),lb:EN()?EN_MON[f.getMonth()]:AR_MON[f.getMonth()]}); } }
  out.forEach(s=>{ s.cnt=cntOf(s.a,s.b); s.prof=profOf(s.a,s.b); });
  return out;
}

const FILTERS=[['', 'الكل','All'],['reply','يحتاج ردك','Needs your reply'],['unpaid','غير مدفوع','Unpaid'],['late','متأخر بالسداد','Overdue'],['work','الفني يشتغل','Technician working'],['book','محجوز','Booked'],['new','بانتظار التأكيد','Awaiting confirmation'],['complaints','الشكاوى','Complaints'],['msgs','الرسائل','Messages'],['cancelled','ملغي','Cancelled']];
function openCount(){ const a=msgItems().filter(i=>i.open); return {all:a.length, cmp:a.filter(i=>i.kind==='cmp').length, wa:a.filter(i=>i.kind==='wa').length}; }
function filterChips(home){
  const oc=openCount(), unpaid=ORDERS.filter(o=>!hiddenOrder(o)&&filterFn('unpaid')(o)).length, late=ORDERS.filter(o=>!hiddenOrder(o)&&filterFn('late')(o)).length;
  const N={reply:oc.all, complaints:oc.cmp, msgs:oc.wa, unpaid, late};
  return '<div class="chips">'+FILTERS.filter(f=>!home||['reply','unpaid','late','complaints','new'].includes(f[0])).map(f=>{ const n=N[f[0]]||0; return '<button class="chip '+(!home&&FILTER===f[0]?'on':'')+'" onclick="'+(home?'openOrders(todayISO(),\''+f[0]+'\')':'setFilter(\''+f[0]+'\')')+'">'+LX(f[1],f[2])+(n?'<i>'+n+'</i>':'')+'</button>'; }).join('')+'</div>';

function filterFn(k){
  if(!k) return o=>o.status!=='cancelled';
  if(k==='cancelled') return o=>o.status==='cancelled';
  if(k==='new') return o=>o.status==='new';
  return o=>{ if(o.status==='cancelled') return false; const s=stripState(o); if(k==='work') return s.c==='yellow'&&(o.status==='progress'||o.onTheWay||o.arrived); if(k==='unpaid') return o.status==='done'&&(s.c==='yellow'||s.c==='red'); if(k==='late') return s.c==='red'; if(k==='book') return s.c==='dark'||s.c==='orange'; return true; };
}

/* ── المسودات: مقترح فوري من القالب ثم تحسين من الخادم (كلود لو مفتاحه موجود) ── */
function msgsOf(key){ if(ATT.byOrder.has(key)) return ATT.byOrder.get(key); if(GROUPS[key]) return GROUPS[key]; const it=msgItems().find(i=>i.key===key); return it?[it]:[]; }
function targetOf(key){ const ms=msgsOf(key).filter(m=>m.kind!=='out'); return ms.filter(m=>m.open).slice(-1)[0]||((DRAFT[key]||{}).force?ms[ms.length-1]:null)||null; }
function ctxText(key){ const ms=msgsOf(key); let i=ms.length; while(i>0&&ms[i-1].kind!=='out') i--; const part=ms.slice(i).filter(m=>m.kind!=='out'&&m.text&&!/^(📷|🎥|🎤|📎|📍)/.test(m.text)); return part.map(m=>m.text).join(String.fromCharCode(10))||(ms.filter(m=>m.kind!=='out').slice(-1)[0]||{}).text||''; }
function forceReply(key){ DRAFT[key]=Object.assign(DRAFT[key]||{text:'',busy:false},{force:true,touched:true}); render(); }
function localDraft(t, draft){
  const d=(draft||'').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,'').replace(/\s+/g,' ').trim();
  if(t.kind==='cmp'){ const K={quality:'نعتذر إن الشغل ما كان بالمستوى المطلوب. بنرسل لك الفني يراجع الشغل ويعدّله بدون أي تكلفة إضافية، وقول لنا الوقت اللي يناسبك.',late:'نعتذر عن التأخير، وهذا شي ما نرضاه. راجعنا الموضوع مع الفريق، وبنحرص إن الموعد الجاي يكون أدق.',price:'نقدّر ملاحظتك على السعر. بنراجع الفاتورة بند بند ونوضّح لك كل بند، ولو فيه أي خطأ نصحّحه على طول.',tech:'نعتذر عن أسلوب التعامل، وهذا ما يمثّل خافت. وصلت ملاحظتك للإدارة وتعاملنا معها.',app:'نعتذر عن المشكلة في التطبيق أو الدفع. فريقنا يراجعها الحين، ولو تحتاج تكمّل طلبك نقدر نكمّله لك من هنا.'};
    return (d||K[t.c.kind]||'وصلت ملاحظتك للإدارة. بنراجعها ونرجع لك بأقرب وقت.')+'\nونعتذر عن أي إزعاج، ونحن بالخدمة دائمًا.'; }
  return d? d.replace(/[.،,]*$/,'.')+' وشكرًا لتواصلك معنا.' : 'وصلتنا رسالتك، وبنرد عليك بالتفصيل خلال وقت قصير.';
}
async function prepDraft(key){
  const t=targetOf(key); if(!t) return; t.text=ctxText(key)||t.text;
  if(DRAFT[key]&&(DRAFT[key].text||DRAFT[key].touched)) return;
  // أولًا تقييم كلود (يرجّع الرد الجاهز)، ولو ما فيه مفتاح نرجع للمقترح العادي
  const tri=await fetchTriage(key); if(tri&&tri.ok&&tri.reply) return;
  DRAFT[key]={text:localDraft(t,''), busy:false, via:'tpl', touched:false}; syncTa(key);
  const out=await askSuggest(t,''); if(out&&out.ok&&out.text&&DRAFT[key]&&!DRAFT[key].touched){ DRAFT[key]={text:out.text,busy:false,via:out.via,touched:false}; syncTa(key); }
}
async function askSuggest(t, draft){
  try{
    let auth=SUPABASE_ANON;
    if(!DEMO){ if(!sb) return null; const { data:{ session } }=await sb.auth.getSession(); if(!session) return null; auth=session.access_token; }
    const r=await fetch(SUPABASE_URL+'/functions/v1/wa-bot/suggest-reply',{ method:'POST', headers:{ apikey:SUPABASE_ANON, Authorization:'Bearer '+auth, 'Content-Type':'application/json' }, body:JSON.stringify({ kind:t.kind==='cmp'?(t.c.kind||'other'):'msg', text:t.text, name:t.name, order_no:t.kind==='cmp'?t.c.order_no:'', draft, demo:DEMO, phone:t.phone||'', at:new Date(t.ts).toISOString() }) });
    return await r.json(); }catch(e){ return null; }
}
function syncTa(key){ const ta=document.getElementById('ta-'+cssId(key)); const d=DRAFT[key]; if(ta&&d){ ta.value=d.text; ta.disabled=!!d.busy; } else render(); }
function draftEdit(key,v){ DRAFT[key]=Object.assign(DRAFT[key]||{},{text:v,touched:true}); }
function clearDraft(key){ DRAFT[key]={text:'',busy:false,touched:true}; const ta=document.getElementById('ta-'+cssId(key)); if(ta){ ta.value=''; ta.focus(); } }
async function polish(key){
  const t=targetOf(key); if(!t) return; t.text=ctxText(key)||t.text; const raw=((DRAFT[key]||{}).text||'').trim();
  DRAFT[key]=Object.assign(DRAFT[key]||{},{busy:true}); render();
  const out=await askSuggest(t, raw);
  const text=out&&out.ok&&out.text? out.text : localDraft(t, raw.replace(/\s*(ونعتذر عن أي إزعاج[^\n]*|وشكرًا لتواصلك معنا\.?|وحنا بالخدمة دايم.*)$/,'').trim());
  DRAFT[key]={text, busy:false, via:out&&out.via, touched:true}; render();
}
async function sendDraft(key){
  const t=targetOf(key); if(!t) return; const text=((DRAFT[key]||{}).text||'').trim();
  if(!text){ toast(LX('اكتب الرد أول','Write the reply first')); return; }
  DRAFT[key]=Object.assign(DRAFT[key]||{},{busy:true}); render();
  if(DEMO){ await new Promise(r=>setTimeout(r,500)); if(t.kind==='cmp'){ t.c.reply=text; t.c.status='progress'; } else MSTATE[t.key]='done'; DRAFT[key]={text:'',busy:false}; render(); toast(LX('✅ (تجريبي) انرسل الرد','✅ (demo) sent')); return; }
  let w=null;
  try{
    const { data:{ session } }=await sb.auth.getSession(); const H={ apikey:SUPABASE_ANON, Authorization:'Bearer '+session.access_token, 'Content-Type':'application/json' };
    if(t.kind==='cmp'){
      const st=t.c.status==='open'||!t.c.status?'progress':t.c.status;
      const r=await sb.from('khafet_complaints').update({reply:text, status:st}).eq('id',t.id).select('id'); if(r.error) throw r.error; t.c.reply=text; t.c.status=st;
      w=await fetch(SUPABASE_URL+'/functions/v1/wa-bot/complaint-reply',{ method:'POST', headers:H, body:JSON.stringify({ id:t.id }) }).then(r=>r.json());
    } else {
      w=await fetch(SUPABASE_URL+'/functions/v1/wa-bot/admin-say',{ method:'POST', headers:H, body:JSON.stringify({ phone:t.phone, text, reply_to:t.key }) }).then(r=>r.json());
      if(w&&w.ok){ const all=msgsOf(key).filter(m=>m.kind==='wa'&&m.open); (all.length?all:[t]).forEach(m=>{ MSTATE[m.key]='done'; sb.from('khafet_admin_msg_state').upsert({msg_key:m.key, state:'done', at:new Date().toISOString()}).then(()=>{}); }); }
    }
  }catch(e){ w={ok:false}; }
  DRAFT[key]={text:(w&&w.ok)?'':text, busy:false, touched:true}; render();
  if(w&&w.ok) toast(LX('✅ وصل الرد للعميل بالواتساب','✅ Reply delivered on WhatsApp'));
  else if(w&&w.reason==='closed') toast(t.kind==='cmp'?LX('💬 انحفظ ويظهر له في التطبيق · نافذة الواتساب مقفلة','💬 Saved · visible in app · WhatsApp window closed'):LX('نافذة الواتساب مقفلة (مرّ أكثر من 24 ساعة)','WhatsApp window closed (over 24h)'));
  else if(w&&w.reason==='phone') toast(LX('ما فيه رقم جوال صالح','No valid phone'));
  else toast(LX('تعذّر الإرسال بالواتساب','WhatsApp send failed'));
}
async function setMsg(key, state){

}

async function askSend(){

  ASK.busy=false; ASK.msgs.push({role:'assistant',content:text}); renderAsk();
}
function toggleLang(){ UILANG=EN()?'ar':'en'; try{ localStorage.setItem('khafet_uilang',UILANG); }catch(e){} document.documentElement.lang=EN()?'en':'ar'; document.documentElement.dir=EN()?'ltr':'rtl'; render(); }

/* ── الدخول ── */
function loginHTML(){
  return '<div class="card login"><div class="mk"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1f1b16" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/></svg></div><h1>'+LX('لوحة خافت','Khafet dashboard')+'</h1>'
    +'<p>'+(otpSent?LX('أدخل الرمز المُرسل إلى ','Enter the code sent to ')+'<span dir="ltr">'+esc(otpPhone)+'</span>':LX('ادخل برقم جوالك، يوصلك رمز برسالة','Enter your mobile number, a code will be sent by SMS'))+'</p>'
    +(otpSent?'<input class="in" id="ac" inputmode="numeric" maxlength="6" placeholder="'+LX('رمز التحقق','Code')+'" style="letter-spacing:.4em;text-align:center;font-weight:700" /><button class="btn pri" id="lgbtn" onclick="verifyOtp()">'+LX('تأكيد ودخول','Confirm')+'</button><button class="btn ghost" onclick="otpSent=false;otpPhone=\'\';render()">'+LX('تغيير الرقم','Change number')+'</button>'
      :'<input class="in" id="au" inputmode="tel" placeholder="05xxxxxxxx" autocomplete="tel" dir="ltr" /><label><input type="checkbox" id="lg_rem" '+((()=>{ try{ return localStorage.getItem('khafet_remember')==='0'; }catch(e){ return false; } })()?'':'checked')+'> '+LX('ابقَ مسجّل الدخول','Stay signed in')+'</label><button class="btn pri" id="lgbtn" onclick="sendOtp()">'+LX('أرسل الرمز','Send code')+'</button>')
    +(lgErr?'<div class="err">'+esc(lgErr)+'</div>':'')+'</div>';
}
function afterLogin(){ const f=document.getElementById(otpSent?'ac':'au'); if(f){ f.addEventListener('keydown',e=>{ if(e.key==='Enter'){ otpSent?verifyOtp():sendOtp(); } }); } }
function normPhone(v){ let d=String(v||'').replace(/\D+/g,''); if(d.startsWith('00')) d=d.slice(2); if(d.startsWith('05')) d='966'+d.slice(1); else if(d.startsWith('5')&&d.length===9) d='966'+d; return d; }
function lgFail(m){ lgErr=m; render(); }
async function sendOtp(){
  const d=normPhone((document.getElementById('au')||{}).value||''); if(d.length<12){ lgFail(LX('رقم الجوال غير صحيح','Invalid number')); return; }
  if(!cloudReady){ lgFail(LX('لا يوجد اتصال بالخادم','No connection')); return; }
  const b=document.getElementById('lgbtn'); if(b){ b.disabled=true; b.textContent='⏳'; }
  try{ remChoice=!!((document.getElementById('lg_rem')||{checked:true}).checked); const { error }=await sb.auth.signInWithOtp({ phone:'+'+d, options:{ channel:'sms' } }); if(error) throw error; otpPhone='+'+d; otpSent=true; lgErr=''; render(); }
  catch(e){ lgFail(LX('تعذّر إرسال الرمز، تأكد من الرقم','Could not send the code')); }
}
async function isAdminUser(){ try{ const { data, error }=await sb.rpc('staff_role'); if(error) return 'err'; return data==='admin'; }catch(e){ return 'err'; } }
async function verifyOtp(){
  const code=((document.getElementById('ac')||{}).value||'').trim(); if(code.length<4){ lgFail(LX('أدخل الرمز','Enter the code')); return; }
  const b=document.getElementById('lgbtn'); if(b){ b.disabled=true; b.textContent='⏳'; }
  try{ const { error }=await sb.auth.verifyOtp({ phone:otpPhone, token:code, type:'sms' }); if(error) throw error;
    const ok=await isAdminUser(); if(ok==='err') throw new Error('net'); if(ok!==true){ await sb.auth.signOut(); throw new Error('no-admin'); }
    try{ localStorage.setItem('khafet_admin_ok','1'); localStorage.setItem('khafet_remember', remChoice?'1':'0'); }catch(e){}
    otpSent=false; lgErr=''; loggedIn=true; render(); loadCore(); subscribe(); initPush();
  }catch(e){ lgFail(e&&e.message==='no-admin'?LX('هذا الرقم ليس له صلاحية إدارة','This number has no admin access'):e&&e.message==='net'?LX('تعذّر الاتصال بالخادم','Could not reach the server'):LX('الرمز غير صحيح','Wrong code')); }
}
function admNetErr(e){ return /fetch|network|load failed|timed? ?out|offline|ECONN/i.test(String((e&&(e.message||e.name))||e||'')); }
async function logout(){ if(!confirm(LX('تسجيل الخروج؟ يحتاج رمز جديد عند الدخول القادم.','Sign out? You will need a new code next time.'))) return; rtStop(); try{ await khPushOff(); }catch(e){} try{ if(sb) await sb.auth.signOut(); }catch(e){} loggedIn=false; ['khafet_admin_ok','kh_inv_cache','kh_pinv_cache'].forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} }); MENU=false; render(); }
/* إشعارات الجوال داخل التطبيق (نفس اللوحة القديمة) */
function inApp(){ return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); }
function getPushPlugin(){ const C=window.Capacitor; if(!C) return null; try{ if(typeof C.registerPlugin==='function') return C.registerPlugin('PushNotifications'); }catch(e){} return (C.Plugins && C.Plugins.PushNotifications) || null; }
let _pn=null, _pnReady=false;
async function khPushOff(){ let tk=''; try{ tk=localStorage.getItem('kh_push_tok')||''; }catch(e){} if(!tk||!sb||!cloudReady) return; try{ await Promise.race([ sb.rpc('unregister_staff_device', { p_token:tk }), new Promise(r=>setTimeout(r,3000)) ]); }catch(e){} }
async function initPush(){
  if(!inApp() || !cloudReady || !loggedIn) return;
  try{ const PN=_pn||getPushPlugin(); if(!PN) return; _pn=PN;
    if(!_pnReady){
      await PN.addListener('registration', async (t)=>{ try{ localStorage.setItem('kh_push_tok', String(t.value||'')); }catch(e){} try{ await sb.rpc('register_staff_device', { p_token:t.value, p_platform:((window.Capacitor&&window.Capacitor.getPlatform&&window.Capacitor.getPlatform())||'ios') }); }catch(e){} });
      await PN.addListener('registrationError', e=> console.warn('push', e));
      await PN.addListener('pushNotificationReceived', (n)=>{ try{ const t=String((n&&n.title)||''), b=String((n&&n.body)||''); if(t||b) toast((t?t+' · ':'')+b); }catch(e){} loadCore(); });
      _pnReady=true;
    }
    let perm=await PN.checkPermissions(); if(perm.receive==='prompt'||perm.receive==='prompt-with-rationale') perm=await PN.requestPermissions(); if(perm.receive==='granted') await PN.register();
  }catch(e){}
}
/* ── الوقت الحقيقي والتحديث الدوري ── */
let _ch=null, _liveT=null, _pollT=null;
function subscribe(){ if(DEMO||!cloudReady||!sb) return; rtStop(); try{ _ch=sb.channel('khafet_admin2_'+Date.now()); _ch.on('postgres_changes',{event:'*',schema:'public',table:'khafet_orders'},p=>{ try{ if(window.orderAlert) window.orderAlert(p); }catch(e){} clearTimeout(_liveT); _liveT=setTimeout(()=>{ loadCore(); FINAT=0; },500); }).subscribe(); }catch(e){}
  clearInterval(_pollT); _pollT=setInterval(()=>{ if(document.visibilityState==='visible'){ loadCore(); } },60000); }
function rtStop(){ try{ if(_ch&&sb) sb.removeChannel(_ch); }catch(e){} _ch=null; clearInterval(_pollT); }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&loggedIn&&cloudReady){ loadCore(); } });
window.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(MENU){ MENU=false; renderOverlay(); } else if(OPEN){ OPEN=null; render(); } } });

async function initCloud(){
  try{ await khRestore(); }catch(e){}
  const remembered=(()=>{ try{ return localStorage.getItem('khafet_admin_ok')==='1' && localStorage.getItem('khafet_remember')!=='0'; }catch(e){ return false; } })();
  if(remembered && !loggedIn){ loggedIn=true; render(); }
  try{
    if(window.supabase){
      sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON,KH_AUTH_OPTS); cloudReady=true;
      const { data:{ session }, error:sessErr }=await sb.auth.getSession();
      if(session){
        if(localStorage.getItem('khafet_remember')==='0'){ try{ await sb.auth.signOut(); }catch(e){} loggedIn=false; render(); return; }
        const ok=await isAdminUser();
        if(ok===true || (ok==='err' && localStorage.getItem('khafet_admin_ok')==='1')){ if(ok===true) localStorage.setItem('khafet_admin_ok','1'); loggedIn=true; render(); loadCore(); subscribe(); initPush(); return; }
        if(ok===false){ try{ await sb.auth.signOut(); }catch(e){} localStorage.removeItem('khafet_admin_ok'); }
      } else if(sessErr && admNetErr(sessErr)){ /* بلا نت: نبقي الشاشة */ }
      else { try{ localStorage.removeItem('khafet_admin_ok'); }catch(e){} }
      loggedIn=false; render(); return;
    }
  }catch(e){}
  render();
}
