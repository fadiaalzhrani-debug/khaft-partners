<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>خافِت | بوابة المزوّد</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23141414'/><text y='.9em' x='18' font-size='60'>🤝</text></svg>" />
<meta name="theme-color" content="#141414" />
<!-- سياسة أمان المحتوى: سكربتات الصفحة فقط، والاتصال بمشروع Supabase فقط -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://zulogtqxbuqxmdmjpzqj.supabase.co; media-src 'self' blob: https://zulogtqxbuqxmdmjpzqj.supabase.co; connect-src 'self' https://zulogtqxbuqxmdmjpzqj.supabase.co wss://zulogtqxbuqxmdmjpzqj.supabase.co; frame-src 'self' blob:">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" /></noscript>
<style>
  :root{ --gold:#F5C518; --gold-strong:#E7B70B; --gold-deep:#B8860B; --gold-soft:#FBF1C9; --gold-tint:#FDF8E7;
    --ink:#1A1712; --bg:#FAF7EF; --panel:#F3EEE2; --card:#fff; --text:#1A1712; --muted:#6E685B; --line:#EBE5D6;
    --ok:#15803D; --ok-soft:#DCFCE7; --danger:#DC2626; --danger-soft:#FBE4E4;
    --r:18px; --shadow:0 1px 2px rgba(40,32,10,.04),0 10px 28px rgba(40,32,10,.06); --shadow-sm:0 1px 2px rgba(40,32,10,.04),0 4px 12px rgba(40,32,10,.045); }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Cairo','Segoe UI',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit;font-size:1rem}
  a{color:inherit;text-decoration:none}
  header.top{position:sticky;top:0;z-index:30;background:rgba(250,247,239,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
  .top .wrap{display:flex;align-items:center;gap:12px;min-height:64px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.15rem}
  .brand .mk{width:36px;height:36px;border-radius:10px;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-size:1.1rem;flex-shrink:0}
  .brand small{display:block;color:var(--muted);font-size:.72rem;font-weight:700}
  .spacer{flex:1}
  .logout{color:var(--muted);font-weight:700;font-size:.85rem}

  .login{max-width:400px;margin:40px auto;padding:0 18px;text-align:center}
  .login-top{display:flex;justify-content:flex-start;margin:-20px 0 14px}
  .login-back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:.95rem}
  .login .ic{font-size:3rem;margin-bottom:8px}
  .login h1{font-size:1.5rem;font-weight:900}
  .login p{color:var(--muted);margin:6px 0 20px}
  .login input{width:100%;padding:15px;border-radius:13px;background:var(--card);border:1px solid var(--line);color:var(--text);text-align:center;font-weight:700;font-size:1.1rem;margin-bottom:12px}
  .btn{width:100%;background:var(--gold);color:var(--ink);font-weight:900;padding:16px;border-radius:13px;font-size:1.05rem;transition:.15s}
  .btn:hover{background:var(--gold-strong)}
  .login .reg{display:block;margin-top:16px;color:var(--gold-deep);font-weight:800}
  .login .reg2{display:block;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);color:var(--muted);font-weight:700;font-size:.9rem}
  .login .reg2:hover{color:var(--text)}
  .login .msg{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:#fca5a5;border-radius:12px;padding:12px;margin-top:12px;font-weight:600}
  .login .msg.wait{background:rgba(245,197,24,.12);border-color:rgba(245,197,24,.3);color:var(--gold-deep)}

  .hero{padding:18px 0 6px}
  .hero h1{font-size:1.3rem;font-weight:900}
  .hero .sub{color:var(--muted);font-size:.9rem}
  .owed{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;margin-top:10px;font-size:.85rem;font-weight:700;color:var(--muted)}
  .owed b{color:var(--gold-deep)}
  .tabs{display:flex;gap:7px;margin:16px 0;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:10px 15px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:800;color:var(--muted);text-align:center;white-space:nowrap;font-size:.93rem}
  .tab.active{background:var(--gold);color:var(--ink);border-color:var(--gold-deep)}
  .tab .cnt{opacity:.7}
  /* عناصر المخزن/العملاء */
  .biz-add{display:flex;gap:8px;margin-bottom:12px}
  .biz-add input{flex:1}
  .irow{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:9px}
  .irow .in-nm{flex:1;min-width:0}
  .irow .in-nm b{font-weight:900;font-size:.98rem;display:block}
  .irow .in-nm small{color:var(--muted);font-size:.8rem}
  .irow .qty{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .irow .qbtn{width:32px;height:32px;border-radius:9px;background:#FBF9F3;border:1px solid var(--line);color:var(--text);font-size:1.2rem;font-weight:900;display:grid;place-items:center}
  .irow .qbtn:active{background:var(--gold)}
  .irow .qn{min-width:34px;text-align:center;font-weight:900;font-size:1.05rem}
  .irow .qn.low{color:#c0392b}
  .pill{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--gold-tint);color:var(--gold-deep);border:1px solid var(--line)}
  .x-btn{background:rgba(220,70,70,.14);border:1px solid rgba(220,70,70,.35);color:#c0392b;border-radius:9px;padding:6px 10px;font-weight:800;font-size:.82rem;flex-shrink:0}
  .assign-sel{flex:1;min-width:150px;padding:11px;border-radius:11px;border:1px solid var(--line);background:#FBF9F3;color:var(--text);font-weight:700;font-family:inherit;font-size:.9rem}
  /* لوحة الأرقام */
  .fin-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .fin-cell{background:#FBF9F3;border:1px solid var(--line);border-radius:12px;padding:13px 10px;text-align:center}
  .fin-cell b{display:block;font-size:1.28rem;font-weight:900;color:var(--ink);line-height:1.2}
  .fin-cell small{color:var(--muted);font-size:.76rem;font-weight:700}
  .fin-cell.rev b{color:var(--ok)}
  .fin-cell.cost b{color:#c0392b}
  .fin-cell.net b{color:var(--gold-deep)}
  .fin-cell.neg b{color:#c0392b}
  .fin-cell.kpi{background:var(--gold-tint);border-color:var(--gold)}
  .fin-cell.kpi b{color:var(--gold-deep)}
  /* عرض حصري «معروض عليك» */
  .tjob-offer{border:2px solid var(--gold);box-shadow:0 0 0 4px rgba(245,197,24,.14)}
  .offer-banner{background:var(--gold);color:#1A1712;font-weight:900;font-size:.9rem;text-align:center;padding:9px 12px;border-radius:12px;margin-bottom:10px;line-height:1.4}
  .status.offer{background:var(--gold);color:#1A1712}
  /* الإعدادات */
  .set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--ink);font-family:inherit;text-align:right}
  .set-row:last-child{border-bottom:0}
  .set-row .sr-l{display:flex;align-items:center;gap:11px;font-weight:700;font-size:.95rem}
  .set-row .sr-ic{font-size:1.2rem}
  .set-row .sr-ar{color:var(--muted);font-weight:900;font-size:1.2rem}
  .set-row.danger .sr-l{color:#c0392b}
  .set-body{padding:6px 2px 12px}
  .set-body input{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:#FBF9F3;color:var(--text);font-weight:700;font-size:1rem}
  /* اختيار أرقام الداشبورد · شرائط مضغوطة */
  .mchips{display:flex;flex-wrap:wrap;gap:8px}
  .mchip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:#FBF9F3;color:var(--muted);font-weight:800;font-size:.85rem}
  .mchip.on{background:var(--gold);color:#1A1712;border-color:var(--gold-deep)}
  /* شرائح اختيار متعدد (مدن/خدمات) */
  .picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px;margin:6px 0;max-height:300px;overflow-y:auto;padding:2px}
  .pick-chip{display:flex;align-items:center;justify-content:center;gap:5px;border:1.5px solid var(--line);border-radius:12px;padding:9px 6px;font-size:.82rem;cursor:pointer;background:var(--card);font-weight:700;color:var(--text);text-align:center;min-height:42px}
  .pick-chip input{margin:0;width:15px;height:15px;accent-color:var(--gold-deep);flex-shrink:0}
  .city-search{width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:#FBF9F3;color:var(--text);font-weight:700;font-size:.95rem}
  .city-results{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .city-add{background:var(--gold-tint);border:1px solid var(--gold);color:var(--gold-deep);border-radius:10px;padding:8px 13px;font-weight:800;font-size:.88rem;cursor:pointer}
  .city-add:active{background:var(--gold)}
  .chosen-cities{display:flex;flex-wrap:wrap;gap:8px}
  .ccity{display:inline-flex;align-items:center;gap:7px;background:var(--gold);color:#1A1712;border-radius:999px;padding:7px 8px 7px 14px;font-weight:800;font-size:.9rem}
  .ccity button{background:rgba(0,0,0,.14);border:none;color:#1A1712;width:22px;height:22px;border-radius:50%;font-weight:900;font-size:1.05rem;cursor:pointer;line-height:1;padding:0}
  .pick-chip:has(input:checked){background:var(--gold);color:#1A1712;border-color:var(--gold-deep)}
  /* ═ مربّعات الرئيسية (زي لوحة الإدارة) ═ */
  .hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}
  @media(max-width:520px){.hgrid{grid-template-columns:repeat(2,1fr);gap:8px}}
  .hcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 11px;text-align:start;cursor:pointer;box-shadow:var(--shadow-sm,var(--shadow));transition:.14s;display:flex;flex-direction:column;gap:1px}
  .hcard:hover{border-color:var(--gold);transform:translateY(-2px)}
  .hcard:active{transform:scale(.98)}
  .hcard .hc-ic{font-size:1.3rem;line-height:1}
  .hcard h3{font-size:.9rem;font-weight:900;color:var(--ink);line-height:1.3}
  .hcard p{color:var(--muted);font-size:.7rem;font-weight:700;flex:1;margin:0}
  .hcard .hc-open{color:var(--gold-deep);font-weight:800;font-size:.7rem;margin-top:1px}
  .hcard .hc-badge{position:absolute;top:14px;left:14px;background:#e11d48;color:#fff;font-weight:900;font-size:.75rem;padding:2px 9px;border-radius:999px;min-width:24px;text-align:center}
  .backbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 16px;font-weight:800;color:var(--ink);font-family:inherit;cursor:pointer}
  .backbtn:hover{border-color:var(--gold)}
  /* صلاحيات الفني */
  .tech-card{background:#FBF9F3;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:10px}
  .tc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .perm-title{color:var(--muted);font-size:.78rem;font-weight:800;margin:9px 0 6px}
  .perm-chips{display:flex;flex-wrap:wrap;gap:7px}
  .pchip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);font-weight:800;font-size:.82rem}
  .pchip.on{background:var(--ok);color:#fff;border-color:var(--ok)}
  /* مفتاح تشغيل/إيقاف */
  .sw-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
  .sw-row:last-child{border-bottom:0}
  .sw-row .sw-tx b{font-weight:800;font-size:.95rem}
  .sw-row .sw-tx small{display:block;color:var(--muted);font-size:.78rem}
  .sw{width:50px;height:29px;border-radius:999px;background:#d9d2c2;border:none;position:relative;flex-shrink:0;transition:.15s;cursor:pointer}
  .sw.on{background:var(--ok)}
  .sw::after{content:"";position:absolute;top:3px;right:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:.15s}
  .sw.on::after{right:24px}
  /* لوحة نظيفة: إحصاءات + بطاقات إدارة */
  .stats{display:flex;gap:9px;margin-top:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:3px}
  .stats::-webkit-scrollbar{display:none}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 15px;text-align:center;flex:0 0 auto;min-width:96px}
  .stat b{display:block;font-size:1.45rem;font-weight:900;color:var(--gold-deep);line-height:1.2}
  .stat small{color:var(--muted);font-size:.78rem;font-weight:700}
.jcode{font-family:ui-monospace,Consolas,monospace;font-size:1.7rem;letter-spacing:.22em;font-weight:900;background:#FFF8DD;border:1.5px dashed #E7B70B;border-radius:12px;padding:10px 14px;text-align:center;direction:ltr;user-select:all}
.jrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.jpend{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.jpend:last-child{border-bottom:0}
.jpend .t{flex:1;min-width:0} .jpend .t b{display:block} .jpend .t small{color:var(--muted);font-size:.8rem}
  .mpanel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .mpanel h3{font-size:1rem;font-weight:900;margin-bottom:6px}
  .mpanel .hint{color:var(--muted);font-size:.84rem;margin-bottom:10px;line-height:1.7}
  .mpanel input{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:#FBF9F3;color:var(--text);font-size:1rem;font-weight:700}
  .mrow{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
  .mrow:last-child{border-bottom:none}
  .code-card{background:linear-gradient(135deg,rgba(245,197,24,.16),rgba(245,197,24,.05));border:1px solid rgba(245,197,24,.45);border-radius:16px;padding:18px;text-align:center;margin-bottom:14px}
  .code-card .cc-code{font-size:1.9rem;font-weight:900;color:var(--gold-deep);letter-spacing:6px;margin:6px 0}
  .code-card small{color:var(--muted);font-size:.84rem;line-height:1.7;display:block}
  /* تقويم أيام المزوّد · طلباته هو فقط */
  .calbar{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:14px}
  .cal-head{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px;font-weight:900}
  .cal-nav{background:#FBF9F3;border:1px solid var(--line);color:var(--text);width:32px;height:32px;border-radius:10px;font-size:1.1rem}
  .cal-nav:active{background:var(--gold);color:var(--ink)}
  .cal-strip{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
  .cal-day{flex-shrink:0;width:56px;background:#FBF9F3;border:1px solid var(--line);border-radius:11px;padding:7px 2px;text-align:center;color:var(--muted)}
  .cal-day .cd-w{display:block;font-size:.68rem;font-weight:700}
  .cal-day .cd-n{display:block;font-size:1.05rem;font-weight:900;color:var(--text)}
  .cal-day .cd-c{display:block;font-size:.68rem;font-weight:800;color:var(--gold-deep)}
  .cal-day.has{border-color:rgba(245,197,24,.5)}
  .cal-day.today{border-color:var(--gold-deep);background:rgba(245,197,24,.12)}
  .cal-day.sel{background:var(--gold);border-color:var(--gold-deep)}
  .cal-day.sel .cd-n,.cal-day.sel .cd-w,.cal-day.sel .cd-c{color:var(--ink)}
  .cal-filter{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;font-weight:800;font-size:.9rem}
  .cal-filter button{background:var(--ink);color:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 14px;font-weight:800;font-size:.82rem}

  .tjob{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
  .tj-head{background:linear-gradient(90deg,rgba(245,197,24,.14),rgba(245,197,24,.04));padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
  .tj-when{font-weight:900;font-size:1.2rem}
  .status{font-size:.76rem;font-weight:800;padding:5px 12px;border-radius:999px;background:var(--gold-tint);color:var(--muted);border:1px solid var(--line)}
  .status.new{background:var(--gold-tint);color:#8a6d00;border-color:var(--gold-soft)}
  .status.confirmed,.status.progress{background:#E6F1FB;color:#185FA5;border-color:#B5D4F4}
  .status.done{background:var(--ok-soft);color:var(--ok);border-color:#BBF7D0}
  .tj-body{padding:15px 18px}
  .tj-row{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:1.05rem}
  .tj-row:last-child{border-bottom:none}
  .tj-k{min-width:110px;color:var(--muted);font-weight:700;font-size:.95rem;flex-shrink:0}
  .tj-v{flex:1;font-weight:800}
  .tj-v a{color:var(--gold-deep)}
  .quick-tag{display:inline-block;background:var(--gold);color:var(--ink);font-weight:900;padding:6px 14px;border-radius:999px;font-size:.9rem;margin-bottom:6px}
  .tvideo{display:inline-flex;gap:6px;background:#7c3aed;color:#fff !important;padding:9px 15px;border-radius:11px;font-weight:800;font-size:.92rem;margin-top:4px}
  .tmap{display:inline-flex;gap:6px;margin-top:8px;background:var(--gold);color:var(--ink);padding:9px 15px;border-radius:11px;font-weight:800;font-size:.9rem}
  .tacts{display:flex;gap:10px;padding:0 18px 16px}
  .tbtn{flex:1;padding:16px;border-radius:13px;font-weight:900;font-size:1.1rem;text-align:center}
  .tbtn.accept{background:var(--gold);color:var(--ink)}
  .tbtn.done{background:var(--ok);color:#fff}
  .tbtn.devpay{background:#2563eb;color:#fff}
  .tbtn.waitpay{background:#EEF6FF;color:#0b3d6b;border:1px solid #BBD6F5}
  .status.paidb{background:var(--ok-soft);color:var(--ok);border-color:#BBF7D0;margin-inline-end:6px}
  .status.dueb{background:#EEF6FF;color:#0b3d6b;border-color:#BBD6F5;margin-inline-end:6px}
  .tbtn.inv{background:var(--gold-tint);border:1px solid var(--gold-soft);color:var(--gold-deep)}
  .tbtn.inv.sent{background:var(--ok-soft);color:var(--ok)}
  .tbtn.donelbl{background:var(--ok-soft);color:var(--ok)}
  /* طلب الإلغاء: زر بعرض البطاقة، قائمة الأسباب، وشارات الحالة */
  .tacts{flex-wrap:wrap}
  .tacts .tbtn.reject{flex:1 1 100%;font-size:.95rem;padding:12px}
  .rj-list{display:grid;gap:9px}
  .rj-opt{width:100%;text-align:start;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:14px 15px;font-weight:700;font-size:1rem;cursor:pointer;font-family:inherit}
  .rj-opt.on{background:#FBE4E1 !important;box-shadow:inset 0 0 0 2px #B42318;color:#B42318}

async function pvObFlush(){

  try{ const uid=pvUid(); if(!uid) return;   // بدون جلسة: تبقى لحين دخول صاحبها
    const rest=[], done=new Set(); let mine=0;
    for(const op of q){
      if(pvUid()!==uid) return;   // تبدّلت الجلسة أثناء الإرسال (خروج أو حساب ثانٍ): نوقف ولا نعيد كتابة الصندوق
      done.add(JSON.stringify(op));

      mine++; try{ const r=await pvObRun(op); if(r.error && !pvRejected(r)) rest.push(op); }catch(e){ rest.push(op); } }
    if(pvUid()!==uid) return;
    // ما أُضيف للصندوق أثناء الإرسال يبقى (لا يُكتب فوقه)
    pvObSave(rest.concat(pvObLoad().filter(x=>!done.has(JSON.stringify(x)))));

}catch(e){} }

async function autoLogin(){

    const r1 = await sb.from('khafet_providers').select('*').eq('phone',saved);

    const data=r1.data; let p=(data||[])[0];

    if(p && (p.status||'')==='approved'){ me=p; loadOrders(); initPush(); return; }
    // مو مزوّد؟ جرّب فني
    const r2=await sb.rpc('my_staff_info');

    const r3=await sb.rpc('my_tech_state');

/* رسالة مفهومة لردود rpc تغيير الجوال وأخطاء Supabase Auth (تُترجم عبر T_DICT عند العرض) */
function pcMsg(e){
  const R={ bad_phone:'رقم الجوال غير صحيح', same_phone:'هذا هو رقمك الحالي', phone_taken:'هذا الرقم مستخدم في حساب آخر', blocked:'ما يمكن استخدام هذا الرقم',

    no_phone:'الحساب بلا جوال موثّق', no_request:'ابدأ من جديد بكتابة الرقم', expired:'ابدأ من جديد بكتابة الرقم', not_verified:'ما اكتمل التحقق من الرقم الجديد' };
  if(typeof e==='string' && R[e]) return R[e];
  const m=[e&&e.message, e&&e.msg, e&&e.error_description, e&&e.code, e&&e.error_code].filter(x=>typeof x==='string').join(' ');
  const st=+((e&&e.status)||0);
  if(st===429 || /rate limit|too many|over_sms_send_rate_limit/i.test(m)) return 'تجاوزت حد الإرسال، حاول بعد شوي';
  if(st===422 || /already.*(registered|exists)|phone_exists/i.test(m)) return 'هذا الرقم مستخدم في حساب آخر';
  if(/otp|token|expired|invalid/i.test(m)) return 'الرمز غير صحيح أو انتهى';
  if(/fetch|network|Failed to fetch/i.test(m)) return 'لا يوجد اتصال بالخادم';
  if(/session/i.test(m)) return 'سجّل دخولك ثم أعد المحاولة';
  const am=String((e&&(e.message||e.msg))||'');
  if(/[؀-ۿ]/.test(am)) return am.slice(0,120);   // رسالة عربية من دالة sms-hook (مثل الأرقام غير السعودية أو حدود الإرسال)
  return 'تعذّر، حاول مرة ثانية';
}

}
async function phoneChangeVerify(){
  if(!_pc){ toast('ابدأ من جديد بكتابة الرقم'); return; }
  const code=(((document.getElementById('pc_code')||{}).value)||'').replace(/\D/g,'');
  if(code.length<4){ toast('اكتب رمز التأكيد'); return; }

  try{
    const { error }=await sb.auth.verifyOtp({ phone:_pc.e164, token:code, type:'phone_change' });
    if(error) throw error;
    // الرقم تغيّر في Auth؛ ننقل بياناتنا في القاعدة للرقم الجديد (ولو فشل الاتصال نكمل عند الفتح القادم)
    try{ localStorage.setItem('khafet_phone_sync','1'); }catch(e){}

/* نقل صفوف الحساب للرقم الجديد (rpc في سياق النظام) ثم إعادة تحميل بياناتي */
async function pvPhoneSync(local){
  let r=null; try{ r=await sb.rpc('khafet_after_phone_change'); }catch(e){ r={ error:e }; }
  const d=r&&!r.error&&r.data;
  if(d && (d.ok===true || d.reason==='no_request' || d.reason==='not_verified')){
    try{ localStorage.removeItem('khafet_phone_sync'); }catch(e){}
    if(d.ok===true) await pvReloadMe(String(d.phone||local||''));
    return d.ok===true;
  }
  return false;
}
async function pvReloadMe(local){
  try{
    if(me&&me.tech){ const { data:info }=await sb.rpc('my_staff_info'); if(info&&info.role==='tech'){ await enterTechMode(info, normPhone(local)); render(); return; } }
    else{ const { data }=await sb.from('khafet_providers').select('*').eq('phone',local); const p=(data||[])[0]; if(p&&(p.status||'')==='approved'){ me=p; localStorage.setItem('khafet_provider_phone',p.phone); loadOrders(); render(); return; } }
  }catch(e){}
  if(me){ me.phone=local; try{ localStorage.setItem('khafet_provider_phone',local); }catch(e){} loadOrders(); }
  render();
}
/* احتياط في مسار الدخول: ملف المزوّد غير موجود بجوال الحساب؟ ربما نجح تحقق تغيير الجوال وانقطع الاتصال قبل النقل
   (أو مُسحت علامة الجهاز)، فنكمل النقل ونرجع الرقم الجديد لإعادة البحث؛ الدالة idempotent فلا خطر من تكرارها */
async function pcAutoFinish(){
  // ok مع already: النقل تم سابقًا (من جهاز آخر مثلًا) والرقم المحفوظ هنا قديم، فنرجع الرقم الجديد للبحث به أيضًا
  try{ const r=await sb.rpc('khafet_after_phone_change'); if(r&&!r.error&&r.data&&r.data.ok===true){ try{ localStorage.removeItem('khafet_phone_sync'); }catch(e){} return String(r.data.phone||''); } }catch(e){}
  return '';
}
/* عند فتح التطبيق: لو نجح التحقق سابقًا وانقطع الاتصال قبل نقل البيانات، نكمل النقل */
async function pvPhoneSyncRetry(){
  try{ if(localStorage.getItem('khafet_phone_sync')!=='1') return; }catch(e){ return; }
  if(!cloudReady||!sb) return;
  let local='';
  try{ const { data:{ session } }=await sb.auth.getSession(); if(!session) return; local='0'+String((session.user&&session.user.phone)||'').replace(/\D/g,'').slice(3); }catch(e){ return; }
  if(await pvPhoneSync(local)) toast('✅ تم تحديث بياناتك بالرقم الجديد');
}

/* ═ طلب الإلغاء ═ المزوّد أو فنيّه ما يلغي الطلب بنفسه: يرسل طلب إلغاء بالسبب (rpc khafet_request_cancel) والإدارة تقبل أو ترفض.
   الحالة تبقى كما هي محليًا، وتظهر شارة «بانتظار موافقة الإدارة» من عمود cancel_req بعد إعادة التحميل. */
const CX_REASONS=['المشكلة تحتاج قطع غيار غير متوفرة حالياً','المشكلة خارج تخصّصي','الموقع خارج نطاق تغطيتي','الوقت المحجوز غير كافٍ لحجم العمل','ظرف طارئ منعني من الحضور'];
let cxSel=null;
/* شارة «الإدارة رفضت الإلغاء» تختفي بعد أول ضغطة أو فتح لطلب إلغاء جديد (محفوظ بالجهاز، لأن cancel_req لا يعدّله الطاقم) */
function cxSeen(){ try{ return new Set(JSON.parse(localStorage.getItem('khafet_cx_seen')||'[]')); }catch(e){ return new Set(); } }
function cxDismiss(dbId){ if(!dbId) return; try{ const s=cxSeen(); s.add(dbId); localStorage.setItem('khafet_cx_seen',JSON.stringify([...s].slice(-200))); }catch(e){} render(); }
function cxBadgeP(o){
  if(!o||!o.dbId||o.status==='done'||o.status==='cancelled') return '';
  if(o.cancelReq==='pending') return `<span class="status cxpend">بانتظار موافقة الإدارة على الإلغاء</span>`;
  if(o.cancelReq==='rejected' && !cxSeen().has(o.dbId)) return `<button type="button" class="status cxrej" data-id="${esc(o.dbId)}" onclick="cxDismiss(this.dataset.id)">الإدارة رفضت الإلغاء</button>`;
  return '';
}
function openCancelReq(id){
  const o=ORDERS.find(x=>x.id===id); if(!o) return;
  const m=document.getElementById('invModal'); if(!m) return;
  if(o.cancelReq==='pending'){ toast('فيه طلب إلغاء لهذا الطلب قيد المراجعة'); return; }
  if(o.cancelReq==='rejected' && o.dbId) cxDismiss(o.dbId);
  cxSel=null;
  const opts=CX_REASONS.map((r,i)=>`<button type="button" class="rj-opt" data-i="${i}" onclick="pickCancelReason(this)">${esc(r)}</button>`).join('');
  m.innerHTML=`<div class="inv-card">
    <div class="inv-head"><b>طلب إلغاء الطلب <small style="color:var(--muted);font-weight:800">${esc(o.id)}</small></b><button type="button" onclick="closeCancelReq()">✕</button></div>
    <p style="color:var(--muted);margin:2px 0 14px;font-size:.95rem">اختر السبب · الإدارة تقرّر قبول الإلغاء أو رفضه</p>
    <div class="rj-list" id="cxList">${opts}</div>
    <textarea id="cxNote" class="cx-note" rows="2" maxlength="300" placeholder="تفاصيل إضافية (اختياري)"></textarea>
    <button type="button" class="tbtn reject" id="cxSend" style="width:100%;margin-top:12px;font-size:1.05rem;padding:15px" data-id="${esc(o.id)}" onclick="sendCancelReq(this.dataset.id)">أرسل طلب الإلغاء</button>
  </div>`;
  if(_uiEN()) _translateEl(m);   // النافذة خارج #app فلا يراقبها المترجم التلقائي
  m.classList.add('show');
}
function pickCancelReason(btn){
  const i=+((btn&&btn.dataset&&btn.dataset.i)||-1); if(!(i>=0)) return;
  cxSel = (cxSel===i) ? null : i;
  document.querySelectorAll('#cxList .rj-opt').forEach(b=>b.classList.toggle('on', +b.dataset.i===cxSel));
}
function closeCancelReq(){ const m=document.getElementById('invModal'); if(m){ m.classList.remove('show'); m.innerHTML=''; } cxSel=null; }
async function sendCancelReq(id){
  const o=ORDERS.find(x=>x.id===id); if(!o) return;
  if(window._cxBusy) return;
  const base=(cxSel!=null && CX_REASONS[cxSel]) ? CX_REASONS[cxSel] : '';
  const note=String(((document.getElementById('cxNote')||{}).value)||'').trim().slice(0,300);
  const reason=[base, note].filter(Boolean).join(' · ').slice(0,500);
  if(reason.trim().length<3){ toast('اختر سببًا أو اكتب السبب'); return; }
  if(!cloudReady || !sb || !o.dbId){ toast('لا يوجد اتصال بالخادم'); return; }
  const btn=document.getElementById('cxSend'); if(btn){ btn.disabled=true; btn.textContent='⏳'; }
  window._cxBusy=true;
  try{
    const r=await sb.rpc('khafet_request_cancel',{ p_order:o.dbId, p_reason:reason });
    if(r.error) throw r.error;
    o.cancelReq='pending'; o.rejectReason=reason;   // الحالة status ما تتغيّر محليًا · القرار للإدارة
    closeCancelReq(); toast('وصل طلب الإلغاء للإدارة، بانتظار الموافقة'); render(); loadOrders();
  }catch(e){
    toast(srvMsgP(e));
    if(btn){ btn.disabled=false; btn.textContent=TR('أرسل طلب الإلغاء'); }
    if(/KHAFET_CANCEL_PENDING/.test(String((e&&e.message)||''))){ o.cancelReq='pending'; closeCancelReq(); render(); }
  }
  finally{ window._cxBusy=false; }
}

/* ---- الفاتورة (نفس منطق بوابة الفنيين) ---- */
let invEditing=null, invItems=[];
/* الفاتورة بصيغة v2 (نفس مخطط تطبيق الفني، الخادم يرفض الصيغة القديمة من الطاقم): بنود الحجز مقفولة (booked) وأجرتها داخل booked_final،
   والإضافات يسعّرها الخادم من الكتالوج (khafet_pay_calc)، والبند الحر (custom) بسعر الطاقم. المعروض تقدير والمعتمد من الخادم بعد الحفظ. */
function openInvoice(id){ const o=ORDERS.find(x=>x.id===id); if(!o) return; invEditing=id;
  if(o.invoice && Array.isArray(o.invoice.items)) invItems=o.invoice.items.filter(it=>it&&it.id!=='swap').map(it=>({id:it.id||'custom',stockId:it.stockId||null,name:it.name||'',qty:+it.qty||1,price:+it.price||0,booked:!!it.booked}));
  else if(o.dbId && !o.quick) invItems=(o.items||[]).filter(it=>it&&it.id&&it.id!=='quick').map(it=>{ if(String(it.id).startsWith('part:')||it.stockId) return {id:'stock',stockId:it.stockId||String(it.id).slice(5),name:it.name||'',qty:+it.qty||1,price:+it.price||0,booked:true}; const s=svc(it.id); return {id:it.id,name:it.name||(s&&s.name)||'',qty:+it.qty||1,price:s?(+s.price||0):(+it.price||0),booked:true}; });
  else invItems=[];
  renderInvoice(); }
function closeInvoice(){ invEditing=null; const m=document.getElementById('invModal'); m.classList.remove('show'); m.innerHTML=''; }
function captureInvPrices(){ document.querySelectorAll('.ir-price').forEach(inp=>{ const i=+inp.dataset.i; if(invItems[i]) invItems[i].price=+inp.value||0; }); }
function addInvItem(id){ if(!id) return; captureInvPrices(); const s=svc(id); if(s) invItems.push({id:s.id,name:s.name,qty:1,price:s.price}); renderInvoice(); }
function addCustomItem(){ captureInvPrices(); const nm=prompt(LX('اسم الخدمة:','Service name:')); if(!nm) return; const pr=+prompt(LX('السعر:','Price:'))||0; invItems.push({id:'custom',name:nm,qty:1,price:pr}); renderInvoice(); }
function invQty(i,d){ captureInvPrices(); if(invItems[i]&&!invItems[i].booked) invItems[i].qty=Math.max(1,(invItems[i].qty||1)+d); renderInvoice(); }
function invRemove(i){ captureInvPrices(); if(invItems[i]&&invItems[i].booked) return; invItems.splice(i,1); renderInvoice(); }
function invTotal(){ return invItems.reduce((a,it)=>a+(+it.price||0)*(+it.qty||1),0); }
/* بند حر (سعره بيد الطاقم) أم خدمة من الكتالوج يسعّرها الخادم */
function invLineFree(it){ if(!it||it.booked) return false; if(it.id==='custom'||it.id==='part') return true; const s=svc(it.id); return !s || !!s.custom; }
function invLineAmt(it){ const q=Math.max(1,+it.qty||1); if(invLineFree(it)) return Math.round(q*Math.max(0,+it.price||0)*100)/100; const s=svc(it.id); const p=s?(+s.price||0):(+it.price||0); const ex=(s&&s.extra!=null)?+s.extra:p; return Math.round((p+(q-1)*ex)*100)/100; }
function invExtras(){ return Math.round(invItems.filter(it=>!it.booked).reduce((a,it)=>a+invLineAmt(it),0)*100)/100; }
function invBooked(){ const o=ORDERS.find(x=>x.id===invEditing); return (o&&o.dbId)?(+o.bookedFinal||0):0; }
function invGrand(){ return Math.max(0, Math.round((invBooked()+invExtras())*100)/100); }
async function saveInvoice(){
  if(window._invSaving) return;
  captureInvPrices(); const o=ORDERS.find(x=>x.id===invEditing); if(!o) return;
  invItems.forEach(it=>{ if(!(+it.price>=0)) it.price=0; if(!(+it.qty>=1)) it.qty=1; });
  if(!invItems.length){ toast('أضف بندًا واحدًا على الأقل'); return; }
  const invoice={ v:2, items:invItems.map(it=>({id:it.id||'custom',stockId:it.stockId||null,name:it.name,qty:+it.qty||1,price:+it.price||0,deducted:0,img:'',booked:!!it.booked})), subtotal:invTotal(), discountPct:0, total:invGrand(), dropped:[], adj:0, refund:0, createdAt:Date.now() };
  window._invSaving=true;
  let r=null;
  try{ r=await sb.from('khafet_orders').update({invoice:invoice}).eq('id',o.dbId); }catch(e){}
  window._invSaving=false;
  if(!r || r.error){ toast(r&&r.error?srvMsgP(r.error):LX('ما انحفظت الفاتورة، حاول مرة ثانية','Invoice not saved, try again')); return; }   // الخادم رفض: المحرر يبقى مفتوحًا للتصحيح
  o.invoice=invoice;
  toast('أُرسلت الفاتورة ✓'); closeInvoice(); loadOrders();   // المبلغ المعتمد من الخادم
}
function invSig(items){ return JSON.stringify((items||[]).filter(it=>it&&it.id!=='swap').map(it=>[String(it.id||'custom'),String(it.stockId||''),+it.qty||1,Math.round((+it.price||0)*100)/100,!!it.booked,String(it.name||'')])); }
function printInv(){ captureInvPrices(); const o=ORDERS.find(x=>x.id===invEditing); if(!o) return;
  // طلب على الخادم: تُطبع النسخة المحفوظة بمبلغها المعتمد، والتعديلات غير المحفوظة تُحفظ أولًا
  if(o.dbId){ if(!(o.invoice&&Array.isArray(o.invoice.items)&&invSig(o.invoice.items)===invSig(invItems))){ toast(LX('احفظ الفاتورة أولًا، ثم اطبعها','Save the invoice first, then print it')); return; } printInvoiceDoc(o); return; }
  printInvoiceDoc({...o,invoice:{v:2,items:invItems,total:invGrand()}}); }
/* جولة الإصلاح 3 (بند 28): أرقام فاتورة الطلب على الخادم: الإجمالي من final_price، وأسعار الأسطر تُعرض فقط لو كتبها الخادم (srv=1)
   ومعادلته صحيحة (المجموع − خصم المؤسسة + التسوية = الإجمالي)، أو (فاتورة بلا علامة الخادم) لو طابق مجموعها الإجمالي */
function pvInvNums(o){
  const inv=(o&&o.invoice)||{items:[]}; const r2=v=>Math.round((+v||0)*100)/100;
  const srv=!!(o&&o.dbId&&o._srv!==false);
  const sub=r2((inv.items||[]).reduce((a,it)=>a+(+it.price||0)*(+it.qty||1),0));
  const tot=srv?Math.max(0,+o.finalPrice||0):(inv.total!=null?(+inv.total||0):sub);
  let orgDisc=0, adj=0, lines=true;
  if(srv){
    if(+inv.srv===1){ orgDisc=Math.max(0,r2(inv.orgDisc)); adj=r2(inv.adj); lines=Math.abs(sub-(+inv.subtotal||0))<=0.5 && Math.abs(r2(sub-orgDisc+adj)-tot)<=0.5; }
    else lines=Math.abs(sub-tot)<=0.5;
    if(!lines){ orgDisc=0; adj=0; }
  }
  return {sub,tot,orgDisc,adj,lines};
}
function printInvoiceDoc(o){
  const inv=o.invoice||{items:[],total:0};
  const en=_uiEN(), num=en?(x=>String(x)):ar, cur=en?' SAR':' ر.س', brand=en?'Khafet':BRAND, oid=en?_west(o.id):o.id;
  const N=pvInvNums(o); const r2=v=>Math.round((+v||0)*100)/100;
  const rows=(inv.items||[]).map(it=>`<tr><td>${esc(svcName(it.name))}</td><td>${num(+it.qty||1)}</td>${N.lines?`<td>${num(+it.price||0)}${cur}</td><td>${num(r2((+it.price||0)*(+it.qty||1)))}${cur}</td>`:''}</tr>`).join('');
  const subRows=(N.lines&&(N.orgDisc>0||Math.abs(N.adj)>=0.01))
    ? '<div class="sb"><span>'+LX('المجموع','Subtotal')+'</span><span>'+num(N.sub)+cur+'</span></div>'
      +(N.orgDisc>0?'<div class="sb"><span>'+LX('خصم المؤسسة','Business discount')+'</span><span>− '+num(N.orgDisc)+cur+'</span></div>':'')
      +(N.adj<=-0.01?'<div class="sb"><span>'+LX('خصومات وتسويات','Discounts and adjustments')+'</span><span>− '+num(r2(-N.adj))+cur+'</span></div>':'')
      +(N.adj>=0.01?'<div class="sb"><span>'+LX('فرق القطع والتسويات','Parts difference and adjustments')+'</span><span>+ '+num(N.adj)+cur+'</span></div>':'')
    : '';
  const d=new Date(); const ds=num(d.getDate())+'/'+num(d.getMonth()+1)+'/'+num(d.getFullYear());
  const html='<!doctype html><html dir="'+(en?'ltr':'rtl')+'" lang="'+(en?'en':'ar')+'"><head><meta charset="utf-8"><title>'+LX('فاتورة ','Invoice ')+oid+'</title>'
   +'<style>body{font-family:Cairo,Arial,sans-serif;padding:24px;color:#141414;max-width:520px;margin:0 auto}.h{display:flex;justify-content:space-between;border-bottom:3px solid #F5C518;padding-bottom:12px}.h .b{font-size:1.5rem;font-weight:900}.h .b span{background:#F5C518;padding:2px 10px;border-radius:8px}.meta{color:#555;font-size:.9rem;margin:12px 0}table{width:100%;border-collapse:collapse;margin-top:8px}th,td{text-align:'+(en?'left':'right')+';padding:9px 6px;border-bottom:1px solid #eee}th{background:#FBF3D0}.sb{display:flex;justify-content:space-between;color:#444;font-weight:700;margin-top:8px}.tot{display:flex;justify-content:space-between;font-weight:900;font-size:1.2rem;margin-top:14px;border-top:2px solid #141414;padding-top:10px}.ft{margin-top:22px;text-align:center;color:#888;font-size:.85rem}@media print{.noprint{display:none}}</style></head><body>'
   +'<div class="h"><div class="b">🔧 <span>'+brand+'</span></div><div style="text-align:'+(en?'right':'left')+'"><b>'+LX('فاتورة','Invoice')+'</b><br>'+oid+'</div></div>'
   +'<div class="meta"><div>'+LX('العميل: ','Customer: ')+esc(o.customer.name)+' · '+esc(o.customer.phone)+'</div><div>'+LX('المزوّد: ','Provider: ')+esc(me?me.name:'')+'</div><div>'+LX('التاريخ: ','Date: ')+ds+'</div></div>'
   +'<table><thead><tr><th>'+LX('الخدمة','Service')+'</th><th>'+LX('العدد','Qty')+'</th>'+(N.lines?'<th>'+LX('السعر','Price')+'</th><th>'+LX('الإجمالي','Total')+'</th>':'')+'</tr></thead><tbody>'+rows+'</tbody></table>'
   +subRows
   +'<div class="tot"><span>'+LX('الإجمالي','Total')+'</span><span>'+num(N.tot)+cur+'</span></div>'
   +'<div class="ft">'+LX('شكراً لتعاملك مع ','Thank you for choosing ')+brand+' · '+CONTACT+'</div>'
   +'<div class="noprint" style="text-align:center;margin-top:18px"><button onclick="print()" style="padding:10px 22px;font-weight:800;border:none;background:#141414;color:#fff;border-radius:10px;cursor:pointer">'+LX('🖨️ طباعة','🖨️ Print')+'</button></div></body></html>';
  const w=window.open('','_blank'); if(!w){ toast('اسمح بالنوافذ المنبثقة'); return; } w.document.write(html); w.document.close();
}
function renderInvoice(){
  const m=document.getElementById('invModal'); if(!invEditing){ m.classList.remove('show'); m.innerHTML=''; return; }
  const opts=SERVICES.filter(s=>!s.inactive && !s.hidden).map(s=>`<option value="${esc(s.id)}">${esc(s.ico)} ${LX(`${esc(s.name)} · ${ar(+s.price||0)}`, `${esc(svcName(s.name))} · ${+s.price||0} SAR`)}</option>`).join('');
  const rows=invItems.length?invItems.map((it,i)=>{
    if(it.booked) return `<div class="inv-row"><span class="ir-name">${esc(it.name)} <span style="font-size:.8rem;font-weight:800;color:var(--ok)">🔒 محجوز</span></span><span style="min-width:60px;text-align:center;font-weight:900">×${ar(it.qty)}</span></div>`;
    // السعر يُكتب للبند الحر فقط · خدمات الكتالوج يسعّرها الخادم
    const free=invLineFree(it); const amt=invLineAmt(it); const unit=Math.round(amt/Math.max(1,+it.qty||1)*100)/100;
    return `<div class="inv-row"><span class="ir-name">${esc(it.name)}</span>
    <div class="ir-qty"><button onclick="invQty(${i},1)">+</button><span>${ar(it.qty)}</span><button onclick="invQty(${i},-1)">−</button></div>
    ${free?`<input class="ir-price" type="number" inputmode="numeric" value="${it.price}" data-i="${i}" />`:`<span class="ir-price-ro" title="السعر من الخادم">${ar(unit)}</span>`}
    <button class="ir-del" onclick="invRemove(${i})">🗑️</button></div>`; }).join('') : `<div class="inv-empty">＋ أضف خدمة</div>`;
  const bk=invBooked();
  m.innerHTML=`<div class="inv-card"><div class="inv-head"><b>🧾 ${LX('فاتورة','Invoice')} ${invEditing}</b><button onclick="closeInvoice()">✕</button></div>
    <div class="inv-add"><select${_uiEN()?' style="min-width:0"':''} onchange="addInvItem(this.value);this.value=''"><option value="">＋ أضف خدمة</option>${opts}</select><button class="cust" onclick="addCustomItem()">بند مخصص</button></div>
    <div class="inv-items">${rows}</div>
    ${bk?`<div class="inv-pay"><div><span>أجرة الحجز</span><span>${ar(bk)} ر.س</span></div><div><span>الإضافات</span><span>${ar(invExtras())} ر.س</span></div></div>`:''}
    <div class="inv-total"><span>الإجمالي</span><b>${ar(invGrand())} ر.س</b></div>
    <div style="color:var(--muted);font-size:.8rem;font-weight:700;margin-top:4px">المبالغ تقديرية بأسعار الخادم، والمبلغ المعتمد يظهر على الطلب بعد الحفظ</div>
    <div class="inv-acts"><button class="tbtn done" onclick="saveInvoice()">حفظ وإرسال للعميل</button><button class="tbtn inv" onclick="printInv()">🖨️ طباعة</button></div></div>`;
  if(_uiEN()) _translateEl(m);   // النافذة خارج #app فلا يراقبها المترجم التلقائي
  m.classList.add('show');
}

/* ---- ملخص الطلب للمزوّد: عرض فقط ---- */
function sumRow(ic,a,b){ return b? `<div class="sm-r"><span class="sm-k">${ic} ${a}</span><b>${b}</b></div>` : ''; }
function openSummary(id){
  const o=ORDERS.find(x=>x.id===id); if(!o) return;
  const m=document.getElementById('invModal'); if(!m) return;
  const inv=o.invoice||null;
  const items=(inv&&inv.items&&inv.items.length) ? inv.items : (o.items||[]);
  const money=v=>LX(ar(v)+' ر.س', v+' SAR');
  const tot=o.dbId ? Math.max(0,+o.finalPrice||0) : (inv&&inv.total!=null ? (+inv.total||0) : items.reduce((a,it)=>a+(+it.price||0)*(+it.qty||1),0));   // المعتمد من الخادم للطلبات السحابية
  // فاتورة على الخادم: أسعار الأسطر والخصم والتسوية من أرقامه فقط لو معادلته صحيحة (جولة الإصلاح 3، بند 28)
  const N=inv&&inv.items&&inv.items.length ? pvInvNums(o) : {lines:true,orgDisc:0,adj:0,sub:0};
  const stLbl=({new:'جديد',confirmed:'مؤكد',progress:'قيد التنفيذ',done:'مكتمل'})[o.status]||o.status||'';
  const when=[o.date?dayLabel(o.date):'', o.startMin!=null?fmtTime(o.startMin):(o.time||'')].filter(Boolean).join(' · ');
  const isPart=it=>/^part:/.test(String(it.id||'')) || !!it.part || !!it.stockId || it.id==='stock';
  const isFee =it=>it.id==='fee'||it.id==='smallfee';
  const sorted=items.slice().sort((a,b)=>(isFee(a)?2:isPart(a)?1:0)-(isFee(b)?2:isPart(b)?1:0));
  const rows=sorted.length
    ? sorted.map(it=>{ const q=+it.qty||1, k=isFee(it)?'fee':(isPart(it)?'part':'svc');
        return `<div class="sm-i ${k}"><span class="sm-ic">${k==='fee'?'🚚':(k==='part'?'🔩':'🔧')}</span>
          <span class="sm-n">${esc(svcName(it.name))}${q>1?'<i>×'+ar(q)+'</i>':''}</span>
          ${N.lines?`<b>${money(Math.round((+it.price||0)*q*100)/100)}</b>`:''}</div>`; }).join('')
    : `<div class="inv-empty">${LX('ما فيه بنود بعد','Nothing yet')}</div>`;
  const adjRows=(N.lines&&(N.orgDisc>0||Math.abs(N.adj)>=0.01))
    ? (N.orgDisc>0?`<div class="sm-tot" style="font-size:.9rem;border-top:0"><span>${LX('خصم المؤسسة','Business discount')}</span><b>− ${money(N.orgDisc)}</b></div>`:'')
      +(Math.abs(N.adj)>=0.01?`<div class="sm-tot" style="font-size:.9rem;border-top:0"><span>${N.adj<0?LX('خصومات وتسويات','Discounts and adjustments'):LX('فرق القطع والتسويات','Parts difference and adjustments')}</span><b>${N.adj<0?'− ':'+ '}${money(Math.round(Math.abs(N.adj)*100)/100)}</b></div>`:'')
    : '';
  m.innerHTML=`<div class="inv-card sm">
    <div class="sm-head"><div><b>🧾 ${LX('فاتورة الطلب','Order invoice')}</b><small>${esc(o.id)}</small></div>
      <span class="sm-st ${esc(o.status||'')}">${esc(stLbl)}</span>
      <button class="sm-x" onclick="closeSummary()" aria-label="إغلاق">✕</button></div>
    <div class="sm-box">
      ${sumRow('👤', LX('العميل','Customer'), esc(o.customer.name))}
      ${sumRow('📞', LX('الجوال','Mobile'), esc(o.customer.phone))}
      ${sumRow('📍', LX('العنوان','Address'), esc(o.address||''))}
      ${sumRow('🕐', LX('الموعد','Time'), esc(when))}
    </div>
    <div class="sm-list">${rows}</div>
    ${adjRows}
    <div class="sm-tot"><span>${LX('الإجمالي','Total')}</span><b>${money(tot)}</b></div>
  </div>`;
  if(_uiEN()) _translateEl(m);
  m.classList.add('show');
}
function closeSummary(){ const m=document.getElementById('invModal'); if(!m) return; m.classList.remove('show'); m.innerHTML=''; }

let _fgPhone=null;   // الجوال بصيغة E164 بعد إرسال الكود

async function sendForgotCode(){
  const fgEl=document.getElementById('fg_phone');
  const d=normPhone(fgEl?fgEl.value:String(_fgPhone||'').replace(/\D/g,''));

async function autoLoginAfterReset(){

    const { data:info }=await sb.rpc('my_staff_info');

    // فني ينتظر موافقة مؤسسته: شاشة الانتظار بدل «قدّم طلب انضمام»

      if(p){ showLogin(LX('⏳ حسابك قيد المراجعة. بننتظر اعتماد الإدارة.','⏳ Your account is under review.'), true); return; }
      showLogin(LX('هذا الرقم ما عليه حساب مزوّد معتمد. قدّم طلب انضمام، وبعد الاعتماد فعّل حسابك.','This number has no approved provider account. Send a join request first.')); return; }
    showLogin('✅ تم تغيير كلمة المرور · سجّل الدخول الآن.');

async function submitSignup(){
  const g=id=>((document.getElementById(id)||{}).value||'').trim();
  const name=g('su_name'), pass=g('su_pass'), d=normPhone(g('su_phone'));
  const cities=[...document.querySelectorAll('#su_cities input:checked')].map(c=>c.value);
  const svcs=[...document.querySelectorAll('#su_svcs input:checked')].map(c=>c.value);
  const cr=g('su_cr').replace(/[^0-9]/g,'');
  const crEl=document.getElementById('su_crdoc'); const crFile=crEl&&crEl.files&&crEl.files[0];
  if(!name){ showSignup('اكتب الاسم'); return; }
  if(d.length<12){ showSignup('رقم الجوال غير صحيح'); return; }
  if(pass.length<6){ showSignup('كلمة المرور 6 أحرف على الأقل'); return; }
  if(!cities.length){ showSignup('اكتب مدن الخدمة'); return; }
  if(!svcs.length){ showSignup('اختر نوع الخدمات'); return; }
  if(!/^[0-9]{10}$/.test(cr)){ showSignup('اكتب رقم السجل التجاري (10 أرقام)'); return; }
  if(!crFile){ showSignup('أرفق صورة السجل التجاري'); return; }
  if(crFile.size>8*1024*1024){ showSignup('حجم ملف السجل أكبر من 8 ميجا'); return; }
  if(!cloudReady){ showSignup('لا يوجد اتصال، حاول بعد قليل'); return; }
  signupCtx={ name, pass, cities, svcs, cr, crFile, e164:'+'+d, local:'0'+d.slice(3) };
  const btn=document.querySelector('.login .btn'); if(btn){ btn.disabled=true; btn.textContent='⏳ نرسل رمز التحقق...'; }
  try{
    const { data, error }=await sb.auth.signUp({ phone:signupCtx.e164, password:pass });
    if(error){
      if(/already|registered|exists/i.test(error.message||'')){ signupCtx.existing=true;
        const r=await sb.auth.signInWithOtp({ phone:signupCtx.e164 }); if(r.error) throw r.error; }
      else throw error;
    } else if(data && data.user && Array.isArray(data.user.identities) && data.user.identities.length===0){
      // رقم له حساب مسبقاً: signUp يرجّع «نجاحاً وهمياً» بلا رسالة · نرسل رمز دخول فعلياً
      signupCtx.existing=true;
      const r=await sb.auth.signInWithOtp({ phone:signupCtx.e164 }); if(r.error) throw r.error;
    }
    showSignupOtp('');
  }catch(e){ showSignup('تعذّر إرسال الرمز · تأكد من الرقم وحاول ثانية'); }
}

async function verifySignupOtp(){
  const code=((document.getElementById('su_otp')||{}).value||'').trim();
  if(code.length<4){ showSignupOtp('اكتب الرمز كاملاً'); return; }
  const btn=document.querySelector('.login .btn'); if(btn){ btn.disabled=true; btn.textContent='⏳ نتحقق...'; }
  try{
    const { error }=await sb.auth.verifyOtp({ phone:signupCtx.e164, token:code, type:'sms' });
    if(error){ showSignupOtp('❌ الرمز غير صحيح · حاول ثانية'); return; }
    if(signupCtx.existing){ try{ await sb.auth.updateUser({ password:signupCtx.pass }); }catch(e){} }
    // صورة السجل التجاري إلى الخزن الخاص (مجلد صاحب الحساب)، ثم ملف المزوّد. الاعتماد يدوي من الإدارة بعد مراجعة السجل
    let crPath=null;
    try{ const u=(await sb.auth.getUser()).data.user; const f=signupCtx.crFile;
      if(u&&f){ const ext=(((f.name||'').split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,''))||'jpg'; const p=u.id+'/cr_'+Date.now()+'.'+ext;
        const up=await sb.storage.from('khafet-docs').upload(p,f,{upsert:false,contentType:f.type||'image/jpeg'}); if(!up.error) crPath=p; } }catch(e){}
    try{ await sb.from('khafet_providers').insert({ name:signupCtx.name, phone:signupCtx.local, city:signupCtx.cities[0]||'', cities:signupCtx.cities, services:signupCtx.svcs, cr_number:signupCtx.cr||null, cr_doc_path:crPath }); }catch(e){}
    const { data }=await sb.from('khafet_providers').select('*').in('phone',[signupCtx.local, signupCtx.e164.slice(1), signupCtx.e164]);
    const p=(data||[])[0];
    if(p && (p.status||'')==='approved'){ me=p; localStorage.setItem('khafet_provider_phone',p.phone); loadOrders(); initPush(); }
    else{ showLogin('✅ تم التسجيل. نراجع السجل التجاري ونعتمد حسابك، وبعدها تدخل بجوالك وكلمة المرور', true); }
  }catch(e){ showSignupOtp('تعذّر الإكمال · حاول مرة ثانية'); }
}

async function registerInstall(app, build){

function verGt(a,b){ const x=String(a||'').split('.').map(n=>parseInt(n,10)||0), y=String(b||'').split('.').map(n=>parseInt(n,10)||0); for(let i=0;i<Math.max(x.length,y.length);i++){ if((x[i]||0)!==(y[i]||0)) return (x[i]||0)>(y[i]||0); } return false; }
let _storeChk=0;
async function checkStoreUpdate(){
  try{
    const C=window.Capacitor; if(!(C&&C.isNativePlatform&&C.isNativePlatform())) return;
    if(Date.now()-_storeChk < 3600000) return; _storeChk=Date.now();
    const AU=(C.Plugins&&C.Plugins.AppUpdate)||(typeof C.registerPlugin==='function'?C.registerPlugin('AppUpdate'):null); if(!AU) return;
    const info=await AU.getAppUpdateInfo({ country:'SA' }); if(!info) return;
    const plat=C.getPlatform();
    const newer = plat==='android' ? (info.updateAvailability===2 && (+info.availableVersionCode||0) > (+info.currentVersionCode||0))
                                   : verGt(info.availableVersionName, info.currentVersionName);
    if(!newer || document.getElementById('updWall')) return;
    // أول يوم من نزول النسخة في آب ستور: ممكن ما توصل لكل الأجهزة، فنسمح بـ«لاحقًا»
    const rel=info.availableVersionReleaseDate ? new Date(info.availableVersionReleaseDate).getTime() : 0;
    const soft = plat==='ios' && rel>0 && (Date.now()-rel < 86400000);
    const A=!(typeof _uiEN==='function'&&_uiEN());
    const w=document.createElement('div'); w.id='updWall'; w.setAttribute('role','dialog'); w.setAttribute('aria-modal','true');
    w.innerHTML='<div class="uw-box"><div class="uw-ic">⬆️</div><h2>'+(A?'فيه نسخة جديدة':'New version available')+'</h2><p>'+(A?'حدّث خافت شركاء لآخر نسخة عشان تكمل.':'Update خافت شركاء to the latest version to continue.')+'</p>'
      +'<button type="button" class="uw-btn" id="uwGo">'+(A?'حدّث الآن':'Update now')+'</button>'
      +(soft?'<button type="button" id="uwLater" style="margin-top:12px;background:none;border:none;color:var(--muted);font-weight:800;font-family:inherit;font-size:.95rem;cursor:pointer">'+(A?'لاحقًا':'Later')+'</button>':'')+'</div>';
    document.body.appendChild(w);
    document.getElementById('uwGo').onclick=async function(){
      try{ if(plat==='android' && info.immediateUpdateAllowed){ await AU.performImmediateUpdate(); } else { await AU.openAppStore({ country:'SA' }); } }
      catch(e){ try{ await AU.openAppStore({ country:'SA' }); }catch(_){} } };
    const l=document.getElementById('uwLater'); if(l) l.onclick=function(){ w.remove(); };
  }catch(e){}
}

        <option value="90" ${o.warrantyDays==90?'selected':''}>ضمان 90 يوم</option>
      </select></span></div>`:''}
    </div>
    <div class="tacts">${acts}</div>
  </div>`;
}
function render(){
  if(!me){ showLogin(''); return; }

  // متاح: مدن خدمته + (مفتوح للكل أو معروض عليه حصرياً) · نخفي المعروض حصرياً لغيره
  const _pid=myPid();
  const _tcity=(me.tech && me.perms && me.perms.city) ? me.perms.city : null;   // مدينة الفني المخصّصة

  const _seen=seenAvail();
  avail.forEach(o=>{ o._new=!_seen.has(o.dbId); });
  avail.sort((x,y)=> (y._new?1:0)-(x._new?1:0) || new Date(y.createdAt||0)-new Date(x.createdAt||0));
  const mine=ORDERS.filter(o=>(me.tech ? o.handledBy===me.uid : o.providerPhone===me.phone) && o.status!=='cancelled')
    .sort((a,b)=>{ const r=s=>s==='done'?1:0; if(r(a.status)!==r(b.status)) return r(a.status)-r(b.status); return (a.date+String(a.startMin).padStart(4,'0')).localeCompare(b.date+String(b.startMin).padStart(4,'0')); });
  const myDone=mine.filter(o=>o.status==='done').length;
  const active=mine.filter(o=>o.status==='confirmed'||o.status==='progress').length;
  const owed=commOwed(mine);
  // فلترة بيوم التقويم المختار (طلباته هو فقط)
  const availF = pvCalFilter ? avail.filter(o=>o.date===pvCalFilter) : avail;
  const mineF  = pvCalFilter ? mine.filter(o=>o.date===pvCalFilter)  : mine;
  // قائمة الطلبات المتاحة (تظهر تحت المربّعات بالرئيسية)
  const availList = availF.length ? availF.map(o=>jobCard(o,'available')).join('') : `${myCities().length? emptyAvail() : `<div class="empty"><div class="ico">🧰</div><h3>حدّد مدن خدمتك من «حسابي» لتصلك الطلبات</h3></div>`}`;

  const _rev=mine.filter(o=>o.status==='done').reduce((s,o)=>s+orderInvTotal(o),0);
  const _stockVal=PINV.reduce((s,it)=>s+(+it.qty||0)*(+it.sell_price||0),0);
  const _stockCost=seeBuy()?PINV.reduce((s,it)=>s+(+it.qty||0)*(+it.buy_price||0),0):0;
  const _monthly=+((me&&me.monthly_cost)||0);
  const _net=_rev-_stockCost-_monthly;
  const METRICS={ available:ar(avail.length), active:ar(active), done:ar(myDone),
    revenue:pvMoney(_rev), stock:pvMoney(_stockVal), monthly:pvMoney(_monthly),
    net:pvMoney(_net), owed:pvMoney(owed), team:ar(TECHS.length),
    customers:ar(PCUST.length), kpi:pvMoney((me&&me.kpi_value)||0) };
  const dashKeys = me.tech ? ['available','active','done'] : ((me.dash_metrics&&me.dash_metrics.length)?me.dash_metrics:['available','active','done']);
  const statsHTML = dashKeys.map(k=>METRIC_DEFS[k]?`<div class="stat"><b>${METRICS[k]}</b><small>${(k==='kpi'&&me.kpi_label)?esc(me.kpi_label):METRIC_DEFS[k].label}</small></div>`:'').join('');
  const listArr = tab==='available'?availF:mineF;
  const list = listArr.length ? listArr.map(o=>jobCard(o, tab)).join('') : `${(!pvCalFilter && tab==='available' && myCities().length)? emptyAvail() : `<div class="empty"><div class="ico">🧰</div><h3>${pvCalFilter?'لا طلبات في هذا اليوم':(tab==='available'?'حدّد مدن خدمتك من الإدارة لتصلك الطلبات':'ما قبلت طلبات بعد')}</h3></div>`}`;

        <button class="tbtn done" style="margin-top:12px;width:100%" onclick="saveMyCities()">💾 حفظ المدن</button>
      </div>`;

  // ═ التنقل الجديد (تطبيق مستقل): شريط سفلي بخمس تبويبات، والأقسام الأخرى تحت «المزيد» ═
  const isJobTab=(tab==='available'||tab==='mine');

  window._pvBarKeys=BAR.map(b=>b[0]);

  const _SEC={available:['inbox','الطلبات المتاحة'],mine:['briefcase','طلباتي'],stock:['box','المخزن'],invoices:['receipt','الفواتير'],route:['map','مسار اليوم'],ratings:['star','تقييماتي'],numbers:['chart','لوحة الأرقام'],team:['team','الفريق'],tasks:['tasks',me.tech?'مهامي':'المهام'],reminders:['bell','تذكيرات الصيانة'],manage:['user','حسابي'],more:['grid','المزيد'],schedule:['calendar','الجدول'],customers:['customers','العملاء'],notes:['pencil','الملاحظات'],settings:['sliders','الإعدادات']}[tab];

      <div style="margin-top:12px;padding-bottom:100px">${body}</div>
    `}
    ${barHTML}`;
  /* بعد ما شاف القائمة، الجديد الحالي يُعتبر مقروءاً بالعرض الجاي */
  if(tab==='home'||tab==='available'){

  }
  /* شريط التقويم: يتمركز على اليوم المختار أو اليوم الحالي مرة واحدة فقط (أول عرض أو تغيير الشهر أو الاتجاه)،
     وبعدها يرجع لمكان تمرير المستخدم المحفوظ في _pvStrip فلا يهتز مع كل إعادة رسم (قيم scrollLeft السالبة في RTL تُحفظ كما هي) */
  setTimeout(function(){

      if(_pvStrip && _pvStrip.key===key){ strip.scrollLeft=_pvStrip.left; return; }

      if(t&&t.scrollIntoView) t.scrollIntoView({inline:'center',block:'nearest'});
      _pvStrip={ key:key, left:strip.scrollLeft };
    }catch(e){}
  }, 60);
}

/* ═══════════ مسار اليوم (مربّع بالرئيسية) ═══════════ */
function geoPt(a){ const la=Number(a&&a.lat), ln=Number(a&&a.lng);
  if(isFinite(la)&&isFinite(ln)&&la&&ln&&Math.abs(la)<=90&&Math.abs(ln)<=180) return encodeURIComponent(la.toFixed(6)+','+ln.toFixed(6));
  return encodeURIComponent([a&&a.city,a&&a.district,a&&a.street].filter(Boolean).join(' ')); }
/* حالة «لا طلبات متاحة»: طمأنة إن الإشعار بيوصل، وإن التطبيق بينشر قريبًا */

    .sort((a,b)=>((a.date||'')+String(a.startMin).padStart(4,'0')).localeCompare((b.date||'')+String(b.startMin).padStart(4,'0')));
  const todayJobs=jobs.filter(o=>o.date===today);
  let routeBtn='';
  if(todayJobs.length>=1){
    const stops=todayJobs.map(o=>geoPt(o.address)).filter(Boolean);
    routeBtn=`<a class="tbtn done" style="display:block;text-align:center;text-decoration:none;margin-bottom:12px" href="https://www.google.com/maps/dir/${stops.join('/')}" target="_blank" rel="noopener">🗺️ ${LX('افتح مسار اليوم',"Open today's route")} (${_uiEN()?todayJobs.length:ar(todayJobs.length)} ${todayJobs.length===1?LX('محطة','stop'):LX('محطات','stops')})</a>`;
  }
  const rows=jobs.length? jobs.map(o=>{const a=o.address||{};
    return `<div class="irow">
      <div class="in-nm"><b>${esc(o.customer.name||'عميل')}</b><small>${fmtTime(o.startMin)} · ${pvDate(o.date)} · ${esc([cityLabel(a.city),a.district].filter(Boolean).join(' · ')||'—')}</small></div>
      <a class="pill" href="https://www.google.com/maps/dir/?api=1&destination=${geoPt(a)}" target="_blank" rel="noopener">🗺️ اذهب</a>

    <div class="hint">مواقع طلباتك · افتح المسار كامل ورتّب مشوارك ووفّر وقتك.</div>

/* ═══════════ الفواتير (طلبات المزوّد المنجزة) ═══════════ */
/* بند 19: عمولة المنصة بنفس قواعد الخادم (khafet_admin_commission): نسبة من أجرة اليد بلا قطع ولا رسوم، والطلب الكبير بنسبة وسقف.
   النسب من الإعدادات لو كانت مقروءة لهذا الحساب، وإلا المعتمدة حاليًا */
const COMM_DEF={ pct:5, firstJobs:10, firstPct:5, bigMin:1000, bigPct:5, bigCap:150 };
let COMM_CFG=Object.assign({},COMM_DEF);
async function loadCommCfg(){ if(!cloudReady||!sb) return; try{ const M={commission_provider_pct:'pct',commission_first_jobs:'firstJobs',commission_first_pct:'firstPct',commission_big_min:'bigMin',commission_big_pct:'bigPct',commission_big_cap:'bigCap'};
  const r=await sb.from('khafet_settings').select('key,value').in('key',Object.keys(M)); if(r.error||!Array.isArray(r.data)) return;
  r.data.forEach(x=>{ const k=M[x&&x.key], v=parseFloat(x&&x.value); if(k && isFinite(v) && v>=0) COMM_CFG[k]=v; }); }catch(e){} loadMyComm(); }
/* جولة الإصلاح 1 (بند 19): عمولة المنصة المستحقة من الخادم نفسه (khafet_my_commission، نفس حساب لوحة الإدارة) لصاحب المؤسسة،
   والحساب المحلي أدناه احتياط فقط (بلا الخادم أو لفني المؤسسة) ولا يحسب حجوزات المؤسسة الخاصة */
let MY_COMM=null;
async function loadMyComm(){ if(!cloudReady||!sb||!me||me.tech) return; try{ const { data, error }=await sb.rpc('khafet_my_commission'); if(!error && data && data.ok){ const v=Math.round((+data.total||0)*100)/100; if(v!==MY_COMM){ MY_COMM=v; if(me) render(); } } }catch(e){} }
function orderLabor(o){
  const isPart=it=>!!(it&&(String(it.id||'').startsWith('part:')||it.stockId||it.id==='stock'||it.part));
  const isFee=it=>!!(it&&(it.id==='fee'||it.id==='smallfee'));
  let v=0;
  if(!o.quick) (o.items||[]).forEach(it=>{ if(!it||!it.id||it.id==='quick'||isPart(it)||isFee(it)) return; const s=svc(it.id); if(s&&!s.custom) v+=invLineAmt(it); });
  const inv=o.invoice; if(inv&&Array.isArray(inv.items)) inv.items.forEach(it=>{ if(!it||it.booked||it.id==='swap'||isPart(it)||isFee(it)) return; v+=invLineAmt(it); });
  return Math.round(v*100)/100;
}
function commOwed(list){
  if(me && !me.tech && MY_COMM!=null) return MY_COMM;
  const C=COMM_CFG; const done=(list||[]).filter(o=>o.status==='done' && o.source!=='staff').slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||((+a.orderNo||0)-(+b.orderNo||0)));
  let t=0; done.forEach((o,i)=>{ const lab=orderLabor(o); if(lab<=0) return; const p0=Math.min(C.pct, i<C.firstJobs?C.firstPct:C.pct);
    t+= lab>=C.bigMin ? Math.round(Math.min(lab*C.bigPct/100, C.bigCap)*100)/100 : Math.round(lab*p0)/100; });
  return Math.round(t*100)/100;
}
function orderInvTotal(o){ if(o&&o.dbId) return Math.max(0,+o.finalPrice||0); const inv=o&&o.invoice; if(inv&&String(inv.v)==='2'&&+inv.total>0) return +inv.total; if(inv&&inv.items) return inv.items.reduce((s,it)=>s+(+it.price||0)*(+it.qty||1),0); return (inv&&inv.total)||0; }
function pvDate(iso){ if(!iso) return ''; const p=String(iso).split('-'); if(p.length<3) return esc(String(iso)); if(_uiEN()) return (+p[2])+' '+(EN_MON[(+p[1]||1)-1]||''); return ar(+p[2])+' '+(AR_MON[(+p[1]||1)-1]||''); }
function renderInvoices(){
  const done=myJobsList().filter(o=>o.status==='done').sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  const total=done.reduce((s,o)=>s+orderInvTotal(o),0);
  const rows=done.length? done.map(o=>`
    <div class="irow">
      <div class="in-nm"><b>${esc(o.customer.name||'عميل')}</b><small>${o.id} · ${pvDate(o.date)}</small></div>
      <b style="color:var(--gold-deep);white-space:nowrap">${pvMoney(orderInvTotal(o))}</b>
      <button class="pill" onclick="printOrderInv('${o.id}')">🖨️</button>
    </div>`).join('') : `<div class="hint" style="text-align:center;padding:22px">ما فيه فواتير بعد · تظهر بعد إنجاز الطلبات وإصدار فواتيرها.</div>`;
  return `
    <div class="mpanel">
      <h3>🧾 ${LX('الفواتير','Invoices')} ${done.length?`(${_uiEN()?done.length:ar(done.length)})`:''}</h3>
      <div class="mrow" style="border-bottom:0;padding-bottom:0"><span class="hint" style="margin:0">إجمالي المنجز</span><b style="color:var(--gold-deep);font-size:1.2rem">${pvMoney(total)}</b></div>
      ${done.length?`<button class="tbtn" style="width:100%;margin-top:12px;background:var(--gold-tint);color:var(--gold-deep);font-size:.95rem;padding:11px" onclick="exportInvoices()">⤓ تصدير Excel</button>`:''}
    </div>
    <div class="mpanel">${rows}</div>`;
}
function printOrderInv(id){ const o=ORDERS.find(x=>x.id===id); if(o) printInvoiceDoc(o); }

async function submitBooking(){
  const g=id=>((document.getElementById(id)||{}).value||'').trim();
  const name=g('bk_name'), phone=g('bk_phone'), city=g('bk_city');
  const date=g('bk_date')||new Date().toISOString().slice(0,10), time=g('bk_time'), tech=g('bk_tech');
  if(!name){ toast('اكتب اسم العميل'); return; }
  // الخدمة تُكتب في ملاحظة الطلب (الحجز الخاص طلب سريع في الخادم، والبنود تُسعَّر في الفاتورة)
  const sid=g('bk_svc'); let svcTxt='';
  if(sid==='custom'){ const nm=g('bk_svc_name'), pr=+g('bk_svc_price')||0; if(nm) svcTxt=nm+(pr?' · '+pr+' ر.س':''); }
  else if(sid){ const s=svc(sid); if(s) svcTxt=s.name+(s.price?' · '+s.price+' ر.س':''); }
  const note=[svcTxt, g('bk_note')].filter(Boolean).join(' · ').slice(0,2000);
  let start=600; if(time&&time.indexOf(':')>0){ const p=time.split(':'); start=(+p[0])*60+(+p[1]); }
  if(!cloudReady||!sb){ toast('لا يوجد اتصال بالخادم'); return; }
  try{
    const { data, error }=await sb.rpc('provider_book_order',{ p_customer:name, p_phone:phone, p_city:city, p_items:[], p_date:date, p_start:start, p_duration:60, p_note:note, p_tech:tech||null });
    if(error) throw error;
    if(data&&data.ok){
      toast(LX('✅ تم الحجز #'+ar(data.order_no),'✅ Booked #'+data.order_no)); bookOpen=false; bookPrefill=null;
      // عميل جديد بجوال غير مسجّل في سجل عملائه؟ يُضاف تلقائيًا (المالك فقط)
      const p05=custPhone05(phone);
      if(!me.tech && p05 && !PCUST.some(c=>custPhone05(c.phone)===p05)){ try{ await sb.from('provider_customers').insert({ provider_id:myPid(), name, phone, city }); loadCustomers(); }catch(e){} }
      loadOrders();
    }
    else { const R={ not_my_tech:'الفني مو من فريقك', bad_date:'التاريخ خارج المدى المسموح', bad_phone:'رقم جوال العميل غير صحيح', too_many:'وصلت للحد اليومي للحجوزات، حاول لاحقًا', not_approved:'حسابك موقوف أو قيد المراجعة · تواصل مع الإدارة', not_provider:'هذا الحساب ليس حساب مزوّد' }; toast((data&&R[data.reason])||'تعذّر الحجز'); }
  }catch(e){ toast(/KHAFET_/.test(String((e&&e.message)||''))?srvMsgP(e):'تعذّر الحجز'); }
}

function jobWhat(o){ const items=(o.items||[]).filter(i=>i&&i.id!=='quick'&&i.id!=='fee'&&i.id!=='smallfee'); const first=items[0]; if(first) return svcName(first.name)+(items.length>1?' +'+pvNum(items.length-1):''); if(o.note) return String(o.note).slice(0,60); return o.quick?LX('طلب سريع (معاينة)','Quick job (inspection)'):''; }

async function taskAdd(){
  const g=id=>((document.getElementById(id)||{}).value||'').trim();
  const title=g('task_title'); if(!title){ toast('اكتب عنوان المهمة'); return; }
  if(!cloudReady||!sb){ toast('لا يوجد اتصال بالخادم'); return; }

  try{
    const r=await sb.rpc('provider_task_add',{ p_title:title, p_date:taskDate, p_tech:tech, p_note:note, p_repeat:rep });
    if(r.error) throw r.error;
    const n=+((r.data&&r.data.count)||1);
    toast(n>1?LX(`✅ أُضيفت ${ar(n)} مهمة`,`✅ ${n} tasks added`):'✅ أُضيفت المهمة');

}
async function taskToggle(id){

    const r=await sb.from('provider_tasks').update({ done:nv }).eq('id',t.id).select().maybeSingle();
    if(r.error) throw r.error;
    Object.assign(t, (r.data&&typeof r.data==='object')?r.data:{ done:nv, done_at:nv?new Date().toISOString():null, done_by:nv?((me&&me.uid)||null):null });
    render(); toast(nv?'✅ تم':'رجعت المهمة غير منجزة');
  }catch(e){ toast(srvMsgP(e)); }
}
async function taskDel(id){

  if(!confirm(LX('حذف المهمة «'+t.title+'»؟','Delete task "'+t.title+'"?'))) return;

async function pvUploadPartPhoto(itemId, file){
  const pid=myPid(); if(!pid||!sb||!cloudReady) throw new Error('offline');
  const blob=await whCompress(file,800,0.82);
  const path='pinv/'+pid+'/'+itemId+'.jpg';
  const { error }=await sb.storage.from('khafet-parts').upload(path, blob, { upsert:true, contentType:'image/jpeg' });
  if(error) throw error;
  const { data }=sb.storage.from('khafet-parts').getPublicUrl(path);
  const url=data.publicUrl+'?v='+Date.now();
  const r=await sb.from('provider_inventory').update({ image_url:url }).eq('id',itemId); if(r.error) throw r.error;
  return url;
}

function pvReasonTxt(r){ r=String(r||''); if(!_uiEN()) return r; PV_REASON_EN.forEach(([a,b])=>{ r=r.split(a).join(b); }); return r; }
/* اسم الصنف في سجل الحركة: الاسم المحفوظ وقت الحركة بالعربي، وبالإنجليزي من المخزن لو الواجهة إنجليزية */
function pvLogItemName(e){ if(_uiEN()&&e&&e.item_id!=null){ const it=PINV.find(x=>String(x.id)===String(e.item_id)); if(it&&it.name_en) return it.name_en; } return (e&&e.item_name)||''; }
function renderPvStockLog(){
  if(!PSTOCKLOG.length) return `<div class="sl-empty">ما فيه حركة مسجّلة بعد</div>`;
  return PSTOCKLOG.map(e=>{ const dv=+e.delta||0, plus=dv>0; const d=new Date(e.created_at||Date.now()); const when=(isNaN(d)?'':(pvDate(dateISO(d))+' · '+fmtTime(d.getHours()*60+d.getMinutes())));
    return `<div class="slog"><span class="sl-d ${plus?'in':'out'}">${plus?'+':'−'}${pvNum(Math.abs(dv))}</span><span class="sl-m"><b>${esc(pvLogItemName(e))}</b><span>${esc(pvReasonTxt(e.reason))} · 👤 ${esc(e.actor||'')}</span></span><span class="sl-t">${when}</span></div>`; }).join('');
}

/* ---- محرّك الترجمة (مطابق لتطبيق العميل) ---- */
function _west(s){ return String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)); }
const _TOK=[["ريال","SAR"],["ر.س","SAR"],["٪","%"]];
const T_DICT_N={}; for(const _k in T_DICT){ T_DICT_N[_west(_k).trim()]=T_DICT[_k]; }
const _EMO=/^((?:[←-⯿️‍\u{1F000}-\u{1FAFF}]+\s*)+)([\s\S]+)$/u;
function _uiEN(){ return (typeof UILANG!=='undefined') && UILANG==='en'; }
function LX(a,e){ return _uiEN()?e:a; }
function _tr(raw){
  if(raw==null) return raw;
  const s=String(raw);
  const m0=s.match(/^(\s*)([\s\S]*?)(\s*)$/); const lead=m0[1], core=m0[2], trail=m0[3];
  if(!core) return raw;
  const h=T_DICT_N[_west(core)];
  if(h!=null && h!=='') return lead+h+trail;
  const em=core.match(_EMO);
  if(em){ const r=T_DICT_N[_west(em[2].trim())]; if(r!=null && r!=='') return lead+em[1]+r+trail; }
  let out=core, ch=false;
  for(const [a,b] of _TOK){ if(out.indexOf(a)>=0){ out=out.split(a).join(b); ch=true; } }
  const w=_west(out); if(w!==out){ out=w; ch=true; }
  return ch? lead+out+trail : raw;
}
function TR(s){ return _uiEN()? _tr(s): s; }
const _SKIP='.notr';
function _translateEl(root){
  if(!root) return;
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes=[]; let n; while(n=w.nextNode()) nodes.push(n);
  for(const node of nodes){
    if(node.parentElement && node.parentElement.closest(_SKIP)) continue;
    if(node.__o===undefined) node.__o=node.nodeValue;
    const t=_tr(node.__o);
    if(t!==node.nodeValue) node.nodeValue=t;
  }
  root.querySelectorAll('[placeholder]').forEach(el=>{ if(el.__po===undefined) el.__po=el.getAttribute('placeholder'); const t=T_DICT_N[_west((el.__po||'').trim())]; if(t) el.setAttribute('placeholder',t); });
}
function _restoreEl(root){
  if(!root) return;
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let n; while(n=w.nextNode()){ if(n.__o!==undefined && n.nodeValue!==n.__o) n.nodeValue=n.__o; }
  root.querySelectorAll('[placeholder]').forEach(el=>{ if(el.__po!=null) el.setAttribute('placeholder',el.__po); });
}
let _mo=null;
function _startI18n(){
  if(!_mo) _mo=new MutationObserver(()=>{ if(_uiEN()) applyLang(); });
  try{ _mo.disconnect(); }catch(e){}
  const app=document.getElementById('app'), hd=document.querySelector('header.top');
  if(app) _mo.observe(app,{childList:true,subtree:true,characterData:true});
  if(hd)  _mo.observe(hd,{childList:true,subtree:true,characterData:true});
}
function applyLang(){
  if(!_uiEN()) return;
  if(_mo){ try{_mo.disconnect();}catch(e){} }
  _translateEl(document.querySelector('header.top'));
  _translateEl(document.getElementById('app'));
  _startI18n();
}
function syncLangBtn(){ const b=document.getElementById('langBtn'); if(b){ const s=b.querySelector('.ht'); if(s) s.textContent = _uiEN()?'ع':'EN'; } }
function setUILang(l){
  UILANG=l; try{localStorage.setItem('khafet_uilang',l);}catch(e){}
  document.documentElement.lang = l==='en'?'en':'ar';
  document.documentElement.dir  = l==='en'?'ltr':'rtl';
  document.title = LX('خافِت | بوابة المزوّد','Khafet | Provider Portal');
  render();
  if(l==='en') applyLang(); else _restoreEl(document.querySelector('header.top'));
  syncLangBtn();
  try{window.scrollTo(0,0);}catch(e){}
}
function toggleLang(){ setUILang(_uiEN()?'ar':'en'); }

  try{ if(!me && localStorage.getItem('khafet_provider_phone') && localStorage.getItem('khafet_remember')!=='0'){ showChecking(); return; } }catch(e){}

/* 👁 إظهار/إخفاء كلمة المرور · يُطبَّق تلقائياً على أي حقل كلمة مرور يظهر بالصفحة */
const _EYE_OPEN='<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
const _EYE_OFF='<svg viewBox="0 0 24 24"><path d="M10.6 5.2A9.9 9.9 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3 3.8M6.2 6.2A17 17 0 0 0 2 12s3.6 7 10 7a9.8 9.8 0 0 0 4.2-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M2 2l20 20"/></svg>';
function _pwToggle(btn){
  const inp=btn.parentNode.querySelector('input');
  if(!inp) return;
  const show = inp.type==='password';
  inp.type = show?'text':'password';
  btn.innerHTML = show?_EYE_OFF:_EYE_OPEN;
  btn.setAttribute('aria-label', show?LX('إخفاء كلمة المرور','Hide password'):LX('إظهار كلمة المرور','Show password'));
  try{ inp.focus({preventScroll:true}); }catch(e){}
}
function applyPwEyes(){
  document.querySelectorAll('input[type="password"]').forEach(function(inp){
    if(inp.parentNode && inp.parentNode.classList && inp.parentNode.classList.contains('pwwrap')) return;
    const w=document.createElement('span'); w.className='pwwrap';
    inp.parentNode.insertBefore(w, inp); w.appendChild(inp);
    const b=document.createElement('button');
    b.type='button'; b.className='pweye'; b.innerHTML=_EYE_OPEN;
    b.setAttribute('aria-label',LX('إظهار كلمة المرور','Show password'));
    b.setAttribute('tabindex','-1');
    b.onclick=function(e){ e.preventDefault(); e.stopPropagation(); _pwToggle(b); };
    w.appendChild(b);
  });
}
/* يراقب الصفحة: أي حقل كلمة مرور جديد يُرسم، ينضاف له الزر تلقائياً */
try{
  new MutationObserver(function(){ applyPwEyes(); })
    .observe(document.documentElement,{childList:true,subtree:true});
}catch(e){}
document.addEventListener('DOMContentLoaded', applyPwEyes);
setTimeout(applyPwEyes, 300);
