<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>خافِت | بوابة المزوّد</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23141414'/><text y='.9em' x='18' font-size='60'>🤝</text></svg>" />
<meta name="theme-color" content="#141414" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" /></noscript>
<style>
  :root{ --gold:#F5C518; --gold-strong:#E7B70B; --gold-deep:#B8860B; --gold-soft:#FBF1C9; --gold-tint:#FDF8E7;
    --ink:#1A1712; --bg:#FAF7EF; --panel:#F3EEE2; --card:#fff; --text:#1A1712; --muted:#6E685B; --line:#EBE5D6;
    --ok:#15803D; --ok-soft:#DCFCE7; --danger:#DC2626; --danger-soft:#FBE4E4;
    --r:18px; --shadow:0 1px 2px rgba(40,32,10,.04),0 10px 28px rgba(40,32,10,.06); --shadow-sm:0 1px 2px rgba(40,32,10,.04),0 4px 12px rgba(40,32,10,.045); }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Cairo','Segoe UI',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit;font-size:1rem}
  a{color:inherit;text-decoration:none}
  header.top{position:sticky;top:0;z-index:30;background:rgba(250,247,239,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
  .top .wrap{display:flex;align-items:center;gap:12px;min-height:64px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.15rem}
  .brand .mk{width:36px;height:36px;border-radius:10px;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-size:1.1rem;flex-shrink:0}
  .brand small{display:block;color:var(--muted);font-size:.72rem;font-weight:700}
  .spacer{flex:1}
  .logout{color:var(--muted);font-weight:700;font-size:.85rem}

  .login{max-width:400px;margin:40px auto;padding:0 18px;text-align:center}
  .login .ic{font-size:3rem;margin-bottom:8px}
  .login h1{font-size:1.5rem;font-weight:900}
  .login p{color:var(--muted);margin:6px 0 20px}
  .login input{width:100%;padding:15px;border-radius:13px;background:var(--card);border:1px solid var(--line);color:var(--text);text-align:center;font-weight:700;font-size:1.1rem;margin-bottom:12px}
  .btn{width:100%;background:var(--gold);color:var(--ink);font-weight:900;padding:16px;border-radius:13px;font-size:1.05rem;transition:.15s}
  .btn:hover{background:var(--gold-strong)}
  .login .reg{display:block;margin-top:16px;color:var(--gold-deep);font-weight:800}
  .login .reg2{display:block;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);color:var(--muted);font-weight:700;font-size:.9rem}
  .login .reg2:hover{color:var(--text)}
  .login .msg{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:#fca5a5;border-radius:12px;padding:12px;margin-top:12px;font-weight:600}
  .login .msg.wait{background:rgba(245,197,24,.12);border-color:rgba(245,197,24,.3);color:var(--gold-deep)}

  .hero{padding:18px 0 6px}
  .hero h1{font-size:1.3rem;font-weight:900}
  .hero .sub{color:var(--muted);font-size:.9rem}
  .owed{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;margin-top:10px;font-size:.85rem;font-weight:700;color:var(--muted)}
  .owed b{color:var(--gold-deep)}
  .tabs{display:flex;gap:7px;margin:16px 0;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:10px 15px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:800;color:var(--muted);text-align:center;white-space:nowrap;font-size:.93rem}
  .tab.active{background:var(--gold);color:var(--ink);border-color:var(--gold-deep)}
  .tab .cnt{opacity:.7}
  /* عناصر المخزن/العملاء */
  .biz-add{display:flex;gap:8px;margin-bottom:12px}
  .biz-add input{flex:1}
  .irow{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:9px}
  .irow .in-nm{flex:1;min-width:0}
  .irow .in-nm b{font-weight:900;font-size:.98rem;display:block}
  .irow .in-nm small{color:var(--muted);font-size:.8rem}
  .irow .qty{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .irow .qbtn{width:32px;height:32px;border-radius:9px;background:#FBF9F3;border:1px solid var(--line);color:var(--text);font-size:1.2rem;font-weight:900;display:grid;place-items:center}
  .irow .qbtn:active{background:var(--gold)}
  .irow .qn{min-width:34px;text-align:center;font-weight:900;font-size:1.05rem}
  .irow .qn.low{color:#c0392b}
  .pill{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--gold-tint);color:var(--gold-deep);border:1px solid var(--line)}
  .x-btn{background:rgba(220,70,70,.14);border:1px solid rgba(220,70,70,.35);color:#c0392b;border-radius:9px;padding:6px 10px;font-weight:800;font-size:.82rem;flex-shrink:0}
  .assign-sel{flex:1;min-width:150px;padding:11px;border-radius:11px;border:1px solid var(--line);background:#FBF9F3;color:var(--text);font-weight:700;font-family:inherit;font-size:.9rem}
  /* لوحة الأرقام */
  .fin-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .fin-cell{background:#FBF9F3;border:1px solid var(--line);border-radius:12px;padding:13px 10px;text-align:center}
  .fin-cell b{display:block;font-size:1.28rem;font-weight:900;color:var(--ink);line-height:1.2}
  .fin-cell small{color:var(--muted);font-size:.76rem;font-weight:700}
  .fin-cell.rev b{color:var(--ok)}
  .fin-cell.cost b{color:#c0392b}
  .fin-cell.net b{color:var(--gold-deep)}
  .fin-cell.neg b{color:#c0392b}
  .fin-cell.kpi{background:var(--gold-tint);border-color:var(--gold)}
  .fin-cell.kpi b{color:var(--gold-deep)}
  /* عرض حصري «معروض عليك» */
  .tjob-offer{border:2px solid var(--gold);box-shadow:0 0 0 4px rgba(245,197,24,.14)}
  .offer-banner{background:var(--gold);color:#1A1712;font-weight:900;font-size:.9rem;text-align:center;padding:9px 12px;border-radius:12px;margin-bottom:10px;line-height:1.4}
  .status.offer{background:var(--gold);color:#1A1712}
  /* الإعدادات */
  .set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--ink);font-family:inherit;text-align:right}
  .set-row:last-child{border-bottom:0}
  .set-row .sr-l{display:flex;align-items:center;gap:11px;font-weight:700;font-size:.95rem}
  .set-row .sr-ic{font-size:1.2rem}
  .set-row .sr-ar{color:var(--muted);font-weight:900;font-size:1.2rem}
  .set-row.danger .sr-l{color:#c0392b}
  .set-body{padding:6px 2px 12px}
  .set-body input{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:#FBF9F3;color:var(--text);font-weight:700;font-size:1rem}
  /* اختيار أرقام الداشبورد — شرائط مضغوطة */
  .mchips{display:flex;flex-wrap:wrap;gap:8px}
  .mchip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:#FBF9F3;color:var(--muted);font-weight:800;font-size:.85rem}
  .mchip.on{background:var(--gold);color:#1A1712;border-color:var(--gold-deep)}
  /* شرائح اختيار متعدد (مدن/خدمات) */
  .picks{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:4px 0 6px;max-height:190px;overflow-y:auto}
  .pick-chip{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);border-radius:20px;padding:6px 13px;font-size:.86rem;cursor:pointer;background:var(--card);font-weight:700;color:var(--text)}
  .pick-chip input{margin:0;width:15px;height:15px;accent-color:var(--gold-deep)}
  .pick-chip:has(input:checked){background:var(--gold);color:#1A1712;border-color:var(--gold-deep)}
  /* ═ مربّعات الرئيسية (زي لوحة الإدارة) ═ */
  .hgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
  @media(max-width:430px){.hgrid{grid-template-columns:1fr}}
  .hcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:right;cursor:pointer;box-shadow:var(--shadow);transition:.14s;display:flex;flex-direction:column;gap:5px}
  .hcard:hover{border-color:var(--gold);transform:translateY(-2px)}
  .hcard:active{transform:scale(.98)}
  .hcard .hc-ic{font-size:2rem;line-height:1}
  .hcard h3{font-size:1.16rem;font-weight:900;color:var(--ink)}
  .hcard p{color:var(--muted);font-size:.85rem;font-weight:700;flex:1}
  .hcard .hc-open{color:var(--gold-deep);font-weight:800;font-size:.82rem;margin-top:2px}
  .hcard .hc-badge{position:absolute;top:14px;left:14px;background:#e11d48;color:#fff;font-weight:900;font-size:.75rem;padding:2px 9px;border-radius:999px;min-width:24px;text-align:center}
  .backbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 16px;font-weight:800;color:var(--ink);font-family:inherit;cursor:pointer}
  .backbtn:hover{border-color:var(--gold)}
  /* صلاحيات الفني */
  .tech-card{background:#FBF9F3;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:10px}
  .tc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .perm-title{color:var(--muted);font-size:.78rem;font-weight:800;margin:9px 0 6px}
  .perm-chips{display:flex;flex-wrap:wrap;gap:7px}
  .pchip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);font-weight:800;font-size:.82rem}
  .pchip.on{background:var(--ok);color:#fff;border-color:var(--ok)}
  /* مفتاح تشغيل/إيقاف */
  .sw-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
  .sw-row:last-child{border-bottom:0}
  .sw-row .sw-tx b{font-weight:800;font-size:.95rem}
  .sw-row .sw-tx small{display:block;color:var(--muted);font-size:.78rem}
  .sw{width:50px;height:29px;border-radius:999px;background:#d9d2c2;border:none;position:relative;flex-shrink:0;transition:.15s;cursor:pointer}
  .sw.on{background:var(--ok)}
  .sw::after{content:"";position:absolute;top:3px;right:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:.15s}
  .sw.on::after{right:24px}
  /* لوحة نظيفة: إحصاءات + بطاقات إدارة */
  .stats{display:flex;gap:9px;margin-top:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:3px}
  .stats::-webkit-scrollbar{display:none}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 15px;text-align:center;flex:0 0 auto;min-width:96px}
  .stat b{display:block;font-size:1.45rem;font-weight:900;color:var(--gold-deep);line-height:1.2}
  .stat small{color:var(--muted);font-size:.78rem;font-weight:700}
  .mpanel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .mpanel h3{font-size:1rem;font-weight:900;margin-bottom:6px}
  .mpanel .hint{color:var(--muted);font-size:.84rem;margin-bottom:10px;line-height:1.7}
  .mpanel input{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:#FBF9F3;color:var(--text);font-size:1rem;font-weight:700}
  .mrow{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
  .mrow:last-child{border-bottom:none}
  .code-card{background:linear-gradient(135deg,rgba(245,197,24,.16),rgba(245,197,24,.05));border:1px solid rgba(245,197,24,.45);border-radius:16px;padding:18px;text-align:center;margin-bottom:14px}
  .code-card .cc-code{font-size:1.9rem;font-weight:900;color:var(--gold-deep);letter-spacing:6px;margin:6px 0}
  .code-card small{color:var(--muted);font-size:.84rem;line-height:1.7;display:block}
  /* تقويم أيام المزوّد — طلباته هو فقط */
  .calbar{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:14px}
  .cal-head{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px;font-weight:900}
  .cal-nav{background:#FBF9F3;border:1px solid var(--line);color:var(--text);width:32px;height:32px;border-radius:10px;font-size:1.1rem}
  .cal-nav:active{background:var(--gold);color:var(--ink)}
  .cal-strip{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
  .cal-day{flex-shrink:0;width:56px;background:#FBF9F3;border:1px solid var(--line);border-radius:11px;padding:7px 2px;text-align:center;color:var(--muted)}
  .cal-day .cd-w{display:block;font-size:.68rem;font-weight:700}
  .cal-day .cd-n{display:block;font-size:1.05rem;font-weight:900;color:var(--text)}
  .cal-day .cd-c{display:block;font-size:.68rem;font-weight:800;color:var(--gold-deep)}
  .cal-day.has{border-color:rgba(245,197,24,.5)}
  .cal-day.today{border-color:var(--gold-deep);background:rgba(245,197,24,.12)}
  .cal-day.sel{background:var(--gold);border-color:var(--gold-deep)}
  .cal-day.sel .cd-n,.cal-day.sel .cd-w,.cal-day.sel .cd-c{color:var(--ink)}
  .cal-filter{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;font-weight:800;font-size:.9rem}
  .cal-filter button{background:var(--ink);color:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 14px;font-weight:800;font-size:.82rem}

  .tjob{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
  .tj-head{background:linear-gradient(90deg,rgba(245,197,24,.14),rgba(245,197,24,.04));padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
  .tj-when{font-weight:900;font-size:1.2rem}
  .status{font-size:.76rem;font-weight:800;padding:5px 12px;border-radius:999px;background:var(--gold-tint);color:var(--muted);border:1px solid var(--line)}
  .status.new{background:var(--gold-tint);color:#8a6d00;border-color:var(--gold-soft)}
  .status.confirmed,.status.progress{background:#E6F1FB;color:#185FA5;border-color:#B5D4F4}
  .status.done{background:var(--ok-soft);color:var(--ok);border-color:#BBF7D0}
  .tj-body{padding:15px 18px}
  .tj-row{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:1.05rem}
  .tj-row:last-child{border-bottom:none}
  .tj-k{min-width:110px;color:var(--muted);font-weight:700;font-size:.95rem;flex-shrink:0}
  .tj-v{flex:1;font-weight:800}
  .tj-v a{color:var(--gold-deep)}
  .quick-tag{display:inline-block;background:var(--gold);color:var(--ink);font-weight:900;padding:6px 14px;border-radius:999px;font-size:.9rem;margin-bottom:6px}
  .tvideo{display:inline-flex;gap:6px;background:#7c3aed;color:#fff !important;padding:9px 15px;border-radius:11px;font-weight:800;font-size:.92rem;margin-top:4px}
  .tmap{display:inline-flex;gap:6px;margin-top:8px;background:var(--gold);color:var(--ink);padding:9px 15px;border-radius:11px;font-weight:800;font-size:.9rem}
  .tacts{display:flex;gap:10px;padding:0 18px 16px}
  .tbtn{flex:1;padding:16px;border-radius:13px;font-weight:900;font-size:1.1rem;text-align:center}
  .tbtn.accept{background:var(--gold);color:var(--ink)}
  .tbtn.done{background:var(--ok);color:#fff}
  .tbtn.inv{background:var(--gold-tint);border:1px solid var(--gold-soft);color:var(--gold-deep)}
  .tbtn.inv.sent{background:var(--ok-soft);color:var(--ok)}
  .tbtn.donelbl{background:var(--ok-soft);color:var(--ok)}
  .empty{text-align:center;padding:50px 20px;color:var(--muted)}
  .empty .ico{font-size:3rem;margin-bottom:10px;opacity:.5}

  /* Invoice modal */
  .inv-modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
  .inv-modal.show{display:flex}
  .inv-card{background:var(--panel);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px}
  .inv-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .inv-head b{font-size:1.3rem;font-weight:900}
  .inv-head button{width:38px;height:38px;border-radius:50%;background:var(--card);font-size:1.2rem}
  .inv-add{display:flex;gap:8px;margin-bottom:14px}
  .inv-add select{flex:1;padding:15px 12px;border-radius:12px;background:var(--card);color:var(--text);border:1px solid var(--line);font-weight:800;font-size:1.05rem}
  .inv-add .cust{padding:15px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--text);font-weight:800;white-space:nowrap}
  .inv-row{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
  .inv-row .ir-name{flex:1;font-weight:800;font-size:1.15rem}
  .inv-row .ir-qty{display:flex;align-items:center;background:var(--card);border-radius:11px;overflow:hidden}
  .inv-row .ir-qty button{width:38px;height:40px;font-weight:900;color:var(--gold-deep);font-size:1.35rem}
  .inv-row .ir-qty span{min-width:30px;text-align:center;font-weight:900;font-size:1.15rem}
  .inv-row .ir-price{width:92px;padding:11px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--text);font-weight:900;text-align:center;font-size:1.1rem}
  .inv-row .ir-del{color:var(--danger);font-size:1.3rem;padding:6px}
  .inv-empty{color:var(--muted);text-align:center;padding:20px;font-weight:700}
  .inv-total{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;border-top:2px solid var(--line);font-weight:900;font-size:1.5rem}
  .inv-total b{color:var(--gold-deep)}
  .inv-acts{display:flex;gap:10px;margin-top:18px}
  .inv-acts .tbtn{flex:1}

  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--gold);color:var(--ink);padding:14px 24px;border-radius:14px;font-weight:800;z-index:80;opacity:0;transition:.3s;box-shadow:var(--shadow);max-width:90%;text-align:center;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* الطلب المنجز منصفط: سطر واحد يفتح بالضغط */
  .tjob-mini{width:100%;display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-right:3px solid var(--ok,#22C55E);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;font-family:inherit;text-align:right;color:inherit}
  .tjob-mini:active{transform:scale(.99)}
  .tm-ic{font-size:1.05rem;flex-shrink:0;color:#22C55E}
  .tm-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;text-align:start}
  .tm-tx b{font-size:.95rem;font-weight:800}
  .tm-tx small{color:var(--muted);font-size:.78rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tm-badge{background:rgba(34,197,94,.15);color:#6ee7a0;font-size:.72rem;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap;flex-shrink:0}

async function changePass(){
  const a=((document.getElementById('np1')||{}).value)||'', b=((document.getElementById('np2')||{}).value)||'';
  if(a.length<6){ toast('كلمة المرور ٦ خانات على الأقل'); return; }

async function confirmPassOtp(){
  const code=((document.getElementById('np_otp')||{}).value||'').trim();
  if(code.length<4){ toast('اكتب كود التأكيد'); return; }
  try{
    const { error:ve }=await sb.auth.verifyOtp({ phone: pvPhoneE164(), token: code, type:'sms' });
    if(ve) throw ve;
    const { error:ue }=await sb.auth.updateUser({ password: _pendPass });
    if(ue) throw ue;
    _pendPass=null;
    ['np1','np2','np_otp'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
    const box=document.getElementById('np_otp_box'); if(box) box.style.display='none';
    const btn=document.getElementById('np_btn'); if(btn) btn.textContent='💾 تحديث كلمة المرور';
    toggleSet('pass'); toast('✅ تم تغيير كلمة المرور');

let invEditing=null, invItems=[];
function openInvoice(id){ const o=ORDERS.find(x=>x.id===id); if(!o) return; invEditing=id;
  invItems=(o.invoice&&o.invoice.items)?o.invoice.items.map(it=>({id:it.id||'custom',name:it.name,qty:+it.qty||1,price:+it.price||0})):[]; renderInvoice(); }
function closeInvoice(){ invEditing=null; const m=document.getElementById('invModal'); m.classList.remove('show'); m.innerHTML=''; }
function captureInvPrices(){ document.querySelectorAll('.ir-price').forEach(inp=>{ const i=+inp.dataset.i; if(invItems[i]) invItems[i].price=+inp.value||0; }); }
function addInvItem(id){ if(!id) return; captureInvPrices(); const s=svc(id); if(s) invItems.push({id:s.id,name:s.name,qty:1,price:s.price}); renderInvoice(); }
function addCustomItem(){ captureInvPrices(); const nm=prompt('اسم الخدمة:'); if(!nm) return; const pr=+prompt('السعر:')||0; invItems.push({id:'custom',name:nm,qty:1,price:pr}); renderInvoice(); }
function invQty(i,d){ captureInvPrices(); if(invItems[i]) invItems[i].qty=Math.max(1,(invItems[i].qty||1)+d); renderInvoice(); }
function invRemove(i){ captureInvPrices(); invItems.splice(i,1); renderInvoice(); }
function invTotal(){ return invItems.reduce((a,it)=>a+(+it.price||0)*(+it.qty||1),0); }
async function saveInvoice(){
  captureInvPrices(); const o=ORDERS.find(x=>x.id===invEditing); if(!o) return;
  const invoice={ items:invItems.map(it=>({name:it.name,qty:+it.qty||1,price:+it.price||0})), total:invTotal(), createdAt:Date.now() };
  o.invoice=invoice;
  try{ await sb.from('khafet_orders').update({invoice:invoice}).eq('id',o.dbId); }catch(e){}
  toast('أُرسلت الفاتورة ✓'); closeInvoice(); loadOrders();
}

async function submitSignup(){
  const g=id=>((document.getElementById(id)||{}).value||'').trim();
  const name=g('su_name'), pass=g('su_pass'), d=normPhone(g('su_phone'));
  const cities=[...document.querySelectorAll('#su_cities input:checked')].map(c=>c.value);
  const svcs=[...document.querySelectorAll('#su_svcs input:checked')].map(c=>c.value);
  const cr=g('su_cr');
  if(!name){ showSignup('اكتب الاسم'); return; }
  if(d.length<12){ showSignup('رقم الجوال غير صحيح'); return; }
  if(pass.length<6){ showSignup('كلمة المرور ٦ أحرف على الأقل'); return; }
  if(!cities.length){ showSignup('اكتب مدن الخدمة'); return; }
  if(!svcs.length){ showSignup('اختر نوع الخدمات'); return; }
  if(!cloudReady){ showSignup('لا يوجد اتصال، حاول بعد قليل'); return; }
  signupCtx={ name, pass, cities, svcs, cr, e164:'+'+d, local:'0'+d.slice(3) };
  const btn=document.querySelector('.login .btn'); if(btn){ btn.disabled=true; btn.textContent='⏳ نرسل رمز التحقق...'; }
  try{
    const { data, error }=await sb.auth.signUp({ phone:signupCtx.e164, password:pass });
    if(error){
      if(/already|registered|exists/i.test(error.message||'')){ signupCtx.existing=true;
        const r=await sb.auth.signInWithOtp({ phone:signupCtx.e164 }); if(r.error) throw r.error; }
      else throw error;

/* ---- مدن الخدمة: المزوّد يحدّدها بنفسه، وأي طلب منها يوصله ---- */
let citiesOpen=false;
function myCities(){
  const arr = (Array.isArray(me.cities) && me.cities.length) ? me.cities : (me.city ? [me.city] : []);
  return arr.map(s=>String(s).trim()).filter(Boolean);
}
function servesCity(o){
  const c=(o.address&&o.address.city||'').trim();
  const list=myCities();
  if(!list.length) return true;   // ما حدّد مدنه بعد → يشوف الكل
  if(!c) return true;             // طلب بلا مدينة محدّدة → يظهر للجميع حتى ما يضيع
  return list.some(x=>x===c);
}
function toggleCities(){ citiesOpen=!citiesOpen; render(); }

/* ═══════════ المخزن (مشترك: المزوّد + فريقه) ═══════════ */
function stockLow(it){ return (+it.qty||0)<=2; }
function renderStock(){
  if(!myPid()) return `<div class="empty"><div class="ico">📦</div><h3>غير متاح</h3></div>`;
  const items=PINV.slice().sort((a,b)=>String(a.name).localeCompare(b.name,'ar'));
  const sellVal=items.reduce((s,it)=>s+(+it.qty||0)*(+it.sell_price||0),0);
  const buyVal =items.reduce((s,it)=>s+(+it.qty||0)*(+it.buy_price||0),0);
  const profit=sellVal-buyVal, margin=buyVal>0?Math.round(profit/buyVal*100):0;
  const rows=items.length? items.map(it=>{
    const buy=+it.buy_price||0, sell=+it.sell_price||0, pu=sell-buy, mg=buy>0?Math.round(pu/buy*100):0;
    const info=[ buy?'شراء '+pvMoney(buy):'', sell?'بيع '+pvMoney(sell):'' ].filter(Boolean).join(' · ');
    return `<div class="irow">
      <div class="in-nm"><b>${esc(it.name)}</b>
        <small>${info||esc(it.unit||'حبة')}${(buy&&sell)?` · <span style="color:${pu>=0?'var(--ok)':'#c0392b'};font-weight:800">ربح ${pvMoney(pu)} (${ar(mg)}٪)</span>`:''}</small></div>
      <div class="qty">
        <button class="qbtn" onclick="stockAdj(${it.id},-1)">−</button>
        <span class="qn ${stockLow(it)?'low':''}">${ar(+it.qty||0)}</span>
        <button class="qbtn" onclick="stockAdj(${it.id},1)">＋</button>
      </div>
      <button class="x-btn" onclick="stockDel(${it.id},'${esc(String(it.name).replace(/'/g,''))}')">حذف</button>
    </div>`; }).join('') : `<div class="hint" style="text-align:center;padding:20px">ما فيه أصناف بعد — أضف أول صنف فوق.</div>`;
  return `
    <div class="mpanel">
      <h3>📦 مخزن ${me.tech?'المزوّد':'الفريق'} ${items.length?`(${ar(items.length)})`:''}</h3>
      <div class="hint">أصناف مشتركة بينك وبين ${me.tech?'زملائك':'فنيّينك'} — الكل يشوف نفس الكميات.</div>
      <div class="biz-add">
        <input id="st_name" placeholder="اسم الصنف" onkeydown="if(event.key==='Enter')stockAdd()" />
        <input id="st_qty" type="number" inputmode="numeric" placeholder="كمية" style="max-width:80px" />
      </div>
      <div class="biz-add" style="margin-top:-4px">
        <input id="st_buy" type="number" inputmode="numeric" placeholder="سعر الشراء" />
        <input id="st_price" type="number" inputmode="numeric" placeholder="سعر البيع" />
        <button class="tbtn done" style="padding:0 18px;flex:0 0 auto" onclick="stockAdd()">➕</button>
      </div>
    </div>
    <div class="mpanel">
      <div class="mrow" style="padding-top:0"><span class="hint" style="margin:0">💰 قيمة المخزون (بالبيع)</span><b style="color:var(--gold-deep)">${pvMoney(sellVal)}</b></div>
      <div class="mrow"><span class="hint" style="margin:0">📦 التكلفة (بالشراء)</span><b>${pvMoney(buyVal)}</b></div>
      <div class="mrow" style="border-bottom:1px solid var(--line)"><span class="hint" style="margin:0">📈 الربح المتوقّع</span><b style="color:${profit>=0?'var(--ok)':'#c0392b'}">${pvMoney(profit)} · ${ar(margin)}٪</b></div>
      ${rows}
      ${items.length?`<button class="tbtn" style="width:100%;margin-top:12px;background:var(--gold-tint);color:var(--gold-deep);font-size:.95rem;padding:11px" onclick="exportStock()">⤓ تصدير Excel</button>`:''}
    </div>`;
}
async function stockAdd(){
  const n=((document.getElementById('st_name')||{}).value||'').trim();
  const q=+((document.getElementById('st_qty')||{}).value||0);
  const buy=+((document.getElementById('st_buy')||{}).value||0);
  const p=+((document.getElementById('st_price')||{}).value||0);
  if(!n){ toast('اكتب اسم الصنف'); return; }
  const pid=myPid(); if(!pid) return;
  try{
    const { error }=await sb.from('provider_inventory').insert({ provider_id:pid, name:n, qty:q, buy_price:buy, sell_price:p });
    if(error) throw error;
    await sb.from('provider_stock_log').insert({ provider_id:pid, item_name:n, delta:q, reason:'إضافة صنف', actor:me.name });
    toast('✅ أُضيف الصنف'); await loadBiz();
  }catch(e){ toast('تعذّرت الإضافة'); }
}
async function stockAdj(id,delta){
  const it=PINV.find(x=>x.id===id); if(!it) return;
  const nq=Math.max(0,(+it.qty||0)+delta);
  try{
    await sb.from('provider_inventory').update({ qty:nq }).eq('id',id);
    await sb.from('provider_stock_log').insert({ provider_id:it.provider_id, item_id:id, item_name:it.name, delta, reason:delta<0?'صرف':'توريد', actor:me.name });
    it.qty=nq; render();
  }catch(e){ toast('تعذّر التعديل'); }
}
async function stockDel(id,name){
  if(!confirm('حذف الصنف '+(name||'')+'؟')) return;
  try{ await sb.from('provider_inventory').delete().eq('id',id); await loadBiz(); toast('حُذف'); }catch(e){ toast('تعذّر الحذف'); }
}

/* ═══════════ الفواتير (طلبات المزوّد المنجزة) ═══════════ */
function orderInvTotal(o){ const inv=o&&o.invoice; if(inv&&inv.items) return inv.items.reduce((s,it)=>s+(+it.price||0)*(+it.qty||1),0); return (inv&&inv.total)||0; }
function pvDate(iso){ if(!iso) return ''; const p=String(iso).split('-'); if(p.length<3) return String(iso); return ar(+p[2])+' '+(AR_MON[(+p[1]||1)-1]||''); }
function renderInvoices(){
  const done=myJobsList().filter(o=>o.status==='done').sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  const total=done.reduce((s,o)=>s+orderInvTotal(o),0);
  const rows=done.length? done.map(o=>`
    <div class="irow">
      <div class="in-nm"><b>${esc(o.customer.name||'عميل')}</b><small>${o.id} · ${pvDate(o.date)}</small></div>
      <b style="color:var(--gold-deep);white-space:nowrap">${pvMoney(orderInvTotal(o))}</b>
      <button class="pill" onclick="printOrderInv('${o.id}')">🖨️</button>
    </div>`).join('') : `<div class="hint" style="text-align:center;padding:22px">ما فيه فواتير بعد — تظهر بعد إنجاز الطلبات وإصدار فواتيرها.</div>`;
  return `
    <div class="mpanel">
      <h3>🧾 الفواتير ${done.length?`(${ar(done.length)})`:''}</h3>
      <div class="mrow" style="border-bottom:0;padding-bottom:0"><span class="hint" style="margin:0">إجمالي المنجز</span><b style="color:var(--gold-deep);font-size:1.2rem">${pvMoney(total)}</b></div>
      ${done.length?`<button class="tbtn" style="width:100%;margin-top:12px;background:var(--gold-tint);color:var(--gold-deep);font-size:.95rem;padding:11px" onclick="exportInvoices()">⤓ تصدير Excel</button>`:''}
    </div>
    <div class="mpanel">${rows}</div>`;
}
function printOrderInv(id){ const o=ORDERS.find(x=>x.id===id); if(o) printInvoiceDoc(o); }

/* ═══════════ الحجز المباشر + التوزيع على فني ═══════════ */
function toggleBook(){ bookOpen=!bookOpen; render(); }
function bookPanel(){
  if(!bookOpen) return `<button class="tbtn done" style="width:100%;margin-bottom:14px" onclick="toggleBook()">➕ حجز جديد لعميل</button>`;
  const today=new Date().toISOString().slice(0,10);
  return `<div class="mpanel">
    <h3>➕ حجز جديد لعميل</h3>
    <div class="hint">أضف طلباً مباشرة — يظهر في «طلباتي»${TECHS.length?' وتقدر توزّعه على فني':''}.</div>
    <input id="bk_name" placeholder="اسم العميل" />
    <input id="bk_phone" inputmode="tel" placeholder="جوال العميل" style="margin-top:8px" />
    <input id="bk_city" placeholder="المدينة" style="margin-top:8px" />
    <input id="bk_note" placeholder="الخدمة / المشكلة" style="margin-top:8px" />
    <div style="display:flex;gap:8px;margin-top:8px">
      <input id="bk_date" type="date" value="${today}" style="flex:1" />
      <input id="bk_time" type="time" value="10:00" style="flex:1" />
    </div>
    ${TECHS.length?`<select id="bk_tech" class="assign-sel" style="width:100%;margin-top:8px">
      <option value="">— بدون توزيع —</option>
      ${TECHS.map(t=>`<option value="${t.user_id}">🧑‍🔧 ${esc(t.name||'فني')}</option>`).join('')}
    </select>`:''}
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="tbtn done" onclick="submitBooking()">💾 احجز</button>
      <button class="tbtn" style="background:var(--gold-tint);color:var(--ink)" onclick="toggleBook()">إلغاء</button>
    </div>
  </div>`;
}
async function submitBooking(){
  const g=id=>((document.getElementById(id)||{}).value||'').trim();
  const name=g('bk_name'), phone=g('bk_phone'), city=g('bk_city'), note=g('bk_note');
  const date=g('bk_date')||new Date().toISOString().slice(0,10), time=g('bk_time'), tech=g('bk_tech');
  if(!name){ toast('اكتب اسم العميل'); return; }
  let start=600; if(time&&time.indexOf(':')>0){ const p=time.split(':'); start=(+p[0])*60+(+p[1]); }
  try{
    const { data }=await sb.rpc('provider_book_order',{ p_customer:name, p_phone:phone, p_city:city, p_items:[], p_date:date, p_start:start, p_duration:60, p_note:note, p_tech:tech||null });
    if(data&&data.ok){ toast('✅ تم الحجز #'+ar(data.order_no)); bookOpen=false; loadOrders(); }
    else toast('تعذّر الحجز');
  }catch(e){ toast('تعذّر الحجز'); }
}
async function assignOrder(dbId,techUid){
  try{
    const { data }=await sb.rpc('assign_order_tech',{ p_order:Number(dbId), p_tech:techUid||null });
    if(data&&data.ok){ toast(techUid?'✅ وُزّع على الفني':'أُلغي التوزيع'); loadOrders(); }
    else toast(data&&data.reason==='not_my_tech'?'الفني مو من فريقك':'تعذّر التوزيع');
  }catch(e){ toast('تعذّر التوزيع'); }
}
/* تخطّي عرض حصري → ينتقل للمزوّد التالي */
async function skipOffer(id){
  const o=OPEN.find(x=>x.id===id); if(!o) return;
  try{ await sb.rpc('decline_offer',{ p_order:o.dbId }); toast('تخطّيت الطلب'); loadOrders(); }
  catch(e){ toast('تعذّر، حاول ثانية'); }
}

let techsOpen=false, TECHS=[];
async function loadTechs(){ if(!me||!cloudReady) return; try{ const { data }=await sb.rpc('my_techs'); TECHS=data||[]; }catch(e){ TECHS=[]; } }
async function toggleTechs(){ techsOpen=!techsOpen; if(techsOpen) await loadTechs(); render(); }
function copyMyCode(){ const c=(me&&me.code)||''; try{ navigator.clipboard.writeText(c); toast('📋 نُسخ كودك: '+c); }catch(e){ toast('كودك: '+c); } }
async function removeTech(uid,name){ if(!confirm('إزالة الفني '+(name||'')+' من فريقك؟')) return; try{ await sb.rpc('remove_my_tech',{ p_uid:uid }); }catch(e){} await loadTechs(); toast('تمت الإزالة'); render(); }
async function addTechByCode(){
  const el=document.getElementById('add_tech_code'); const code=((el&&el.value)||'').trim();
  if(code.length<4){ toast('اكتب كود الفني أو جواله'); return; }
  try{
    const { data }=await sb.rpc('add_tech_by_code',{ p_code:code });
    if(data && data.ok){ toast('✅ أُضيف الفني: '+(data.name||'')); if(el) el.value=''; await loadTechs(); render(); }
    else toast(data && data.reason==='bad_code' ? '❌ الكود أو الجوال غير صحيح — تأكّد أنه سجّل كفني' : 'تعذّرت الإضافة');
  }catch(e){ toast('تعذّرت الإضافة، حاول ثانية'); }
}
function setTab(t){ tab=t; render(); if(t==='manage'&&me&&!me.tech){ loadTechs().then(render); } if((t==='stock'||t==='customers'||t==='invoices')&&me){ loadBiz(); } }
/* المزوّد يتحكّم وش يظهر لفنيّيه */
async function toggleVis(which){
  if(!me||me.tech) return;
  if(which==='stock') me.techs_see_stock=!me.techs_see_stock;
  else if(which==='customers') me.techs_see_customers=!me.techs_see_customers;
  else if(which==='invoices') me.techs_see_invoices=!me.techs_see_invoices;
  render();
  try{ await sb.rpc('set_tech_visibility',{ p_stock:!!me.techs_see_stock, p_customers:!!me.techs_see_customers, p_invoices:!!me.techs_see_invoices }); toast('💾 حُفظ'); }
  catch(e){ toast('تعذّر الحفظ'); }
}
/* المزوّد يختار أرقام صفحته الرئيسية */
async function toggleMetric(k){
  if(!me||me.tech) return;
  let arr=(me.dash_metrics||[]).slice();
  if(arr.includes(k)) arr=arr.filter(x=>x!==k); else arr.push(k);
  if(!arr.length) arr=['available'];
  me.dash_metrics=arr; render();
  try{ await sb.rpc('set_dash_metrics',{ p_metrics:arr }); }catch(e){ toast('تعذّر الحفظ'); }
}
/* المزوّد يمنح/يسحب صلاحية لفني */
async function toggleTechPerm(uid,pk){
  const t=TECHS.find(x=>x.user_id===uid); if(!t) return;
  t.perms=t.perms||{}; t.perms[pk]=!t.perms[pk];
  render();
  try{ await sb.rpc('set_tech_perms',{ p_uid:uid, p_perms:t.perms }); toast('💾 حُدّثت الصلاحيات'); }
  catch(e){ toast('تعذّر الحفظ'); }
}
/* حفظ أرقام لوحة المزوّد المالية */
async function saveFinance(){
  if(!me||me.tech) return;
  const m=+((document.getElementById('fin_monthly')||{}).value||0);
  const kl=((document.getElementById('fin_klabel')||{}).value||'').trim();
  const kvRaw=(document.getElementById('fin_kvalue')||{}).value;
  const kv=(kvRaw===''||kvRaw==null)?null:+kvRaw;
  me.monthly_cost=m; me.kpi_label=kl; me.kpi_value=kv;
  render();
  try{ await sb.rpc('set_provider_finance',{ p_monthly:m, p_label:kl||null, p_value:kv }); toast('💾 حُفظت الأرقام'); }
  catch(e){ toast('تعذّر الحفظ'); }
}
function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.classList.add('show'); clearTimeout(window._tt); window._tt=setTimeout(()=>el.classList.remove('show'),2200); }

/* ?techreg=1 → يفتح نموذج تسجيل الفني مباشرة (من رابط بوابة الفنيين) */
function initialScreen(){ try{ if(new URLSearchParams(location.search).get('techreg')==='1' && !me){ showTechReg(''); return; } }catch(e){} render(); }
initialScreen();
if(window.supabase) initCloud(); else window.addEventListener('load', initCloud);
</script>
