/* صفحة مدير التوسع (2026-11-19): المؤسسات وأماكنها وفرقها فقط. نفس نظام لوحة خافت الجديدة (admin.html). */
:root{
  --bg:#ffffff; --fg:#09090b; --card:#ffffff; --muted:#f4f4f5; --muted-fg:#71717a; --border:#e4e4e7; --input:#e4e4e7; --ring:#a1a1aa;

  --green-bg:#ecfdf3; --green-bd:#bbf7d0; --yellow-bg:#fefce8; --yellow-bd:#fde68a; --red:#dc2626; --red-bg:#fef2f2; --red-bd:#fecaca; --gray-bg:#fafafa; --gray-bd:#e4e4e7;
  --c-green:#2A9D8F; --c-yellow:#E9C46A; --c-red:#E76F51; --c-gray:#a1a1aa;
  --fh:"Cairo","Segoe UI",Tahoma,sans-serif; --fb:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 var(--fb);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{font-family:var(--fh);margin:0;letter-spacing:-.01em}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.top{position:sticky;top:0;z-index:40;height:56px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 14px}
.brand{display:flex;align-items:center;gap:9px;font:800 17px/1 var(--fh)}
.brand .mk{width:30px;height:30px;border-radius:9px;background:var(--brand);display:grid;place-items:center}
.sp{flex:1}
.wrap{max-width:860px;margin:0 auto;padding:16px 14px 80px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--sh)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);font:600 13.5px/1 var(--fb);color:var(--fg);box-shadow:var(--sh);white-space:nowrap}
.btn:hover{background:var(--muted)} .btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)} .btn.pri:hover{background:#27272a}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;box-shadow:none}
.btn.danger{color:var(--red)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--border);background:var(--card);font:600 12.5px/1 var(--fb);color:#3f3f46;display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:var(--muted)} .chip.on{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.chip i{font-style:normal;font-size:11px;opacity:.8;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font:700 11.5px/1 var(--fh);border:1px solid transparent}
.badge.g{background:var(--green-bg);color:#15803d;border-color:var(--green-bd)} .badge.y{background:var(--yellow-bg);color:#a16207;border-color:var(--yellow-bd)}
.badge.r{background:var(--red-bg);color:#b91c1c;border-color:var(--red-bd)} .badge.n{background:var(--gray-bg);color:#52525b;border-color:var(--gray-bd)}
.in,select.in,textarea.in{width:100%;min-height:40px;padding:8px 12px;border:1px solid var(--input);border-radius:9px;background:var(--card)}
textarea.in{min-height:72px;resize:vertical;line-height:1.6}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bar .in{flex:1;min-width:160px} .bar select.in{flex:0 1 150px;min-width:120px}
.list{display:grid;gap:10px;margin-top:12px}
.org{padding:13px 14px;border-inline-start:4px solid var(--c-gray)}
.org.approved{border-inline-start-color:var(--c-green)} .org.pending{border-inline-start-color:var(--c-yellow)} .org.suspended,.org.rejected{border-inline-start-color:var(--c-red)}
.oh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.oh b{font:700 15.5px/1.4 var(--fh)} .oh .no{color:var(--muted-fg);font-size:12px;font-variant-numeric:tabular-nums}
.oh .tel{margin-inline-start:auto;font-weight:600;text-decoration:none;border-bottom:2px solid var(--brand);direction:ltr}
.ol{margin-top:5px;color:#3f3f46;overflow-wrap:anywhere}
.om{margin-top:7px;display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--muted-fg);font-size:12.5px;align-items:center}
.om b{color:var(--fg);font-weight:600}
.oa{margin-top:11px;display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:36px 14px;text-align:center;color:var(--muted-fg)}
.login{max-width:380px;margin:12vh auto 0;display:grid;gap:12px;padding:22px}
.login .mk{width:48px;height:48px;border-radius:14px;background:var(--brand);display:grid;place-items:center;margin:0 auto 6px}
.login h1{font-size:20px;text-align:center}
.login p{margin:0;color:var(--muted-fg);text-align:center;font-size:13.5px}
.err{color:#b91c1c;background:var(--red-bg);border:1px solid var(--red-bd);border-radius:8px;padding:8px 10px;font-size:13px}
.ov{position:fixed;inset:0;z-index:60;background:rgba(9,9,11,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;box-shadow:var(--sh-md);padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:640px){.ov{align-items:center}.sheet{border-radius:14px}}
.sh-h{display:flex;align-items:center;gap:8px;margin-bottom:12px} .sh-h h2{font-size:17px;flex:1}
.fld{display:grid;gap:5px;margin-bottom:12px} .fld>span{font:600 12.5px/1.4 var(--fb);color:#3f3f46}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sh-f{display:flex;gap:8px;margin-top:6px} .sh-f .btn{flex:1;height:42px}
.rowi{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--border);flex-wrap:wrap}
.card.me{padding:12px 14px;margin-bottom:12px;display:grid;gap:8px} .me-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap} .me-h b{font:700 15px/1.3 var(--fh);flex:1} .me-l{display:flex;gap:8px} .me-l .in{flex:1;min-width:0;font-size:12.5px} .rowi .gi small{display:block;line-height:1.6} .rowi .gi b.n{display:inline;color:var(--fg)} .rowi .gi small.lk{word-break:break-all;font-size:11.5px}
.rowi:first-child{border-top:0} .rowi .gi{flex:1;min-width:0} .rowi .gi b{display:block;font-weight:600} .rowi .gi small{color:var(--muted-fg)}
.chk{display:flex;align-items:center;gap:8px;font-weight:500}
.toast{position:fixed;bottom:22px;inset-inline:0;margin:auto;width:max-content;max-width:88vw;z-index:80;background:var(--primary);color:var(--primary-fg);padding:10px 16px;border-radius:10px;box-shadow:var(--sh-md);font-weight:600}
@media(max-width:480px){.row2{grid-template-columns:1fr}.oh .tel{margin-inline-start:0;width:100%}}
@media(prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(14px);opacity:0}}}
</style>

<script>
'use strict';

const DEMO=/[?&]demo=1/.test(location.search) && (!location.hostname || /^(localhost|127[.]0[.]0[.]1)$/.test(location.hostname));   // معاينة التصميم بلا دخول على الجهاز المحلي فقط
const CITIES=[['الخبر','Al Khobar'],['الدمام','Dammam'],['الظهران','Dhahran'],['القطيف','Qatif'],['الجبيل','Jubail'],['الأحساء','Al Ahsa'],['الرياض','Riyadh'],['جدة','Jeddah'],['مكة','Makkah'],['المدينة','Madinah'],['الطائف','Taif'],['القصيم','Qassim'],['أبها وخميس مشيط','Abha and Khamis'],['تبوك','Tabuk'],['حائل','Hail'],['جازان','Jazan'],['نجران','Najran'],['ينبع','Yanbu'],['الخرج','Al Kharj']];

async function rpc(fn,args){ if(DEMO) return demoRpc(fn,args||{}); const { data, error }=await sb.rpc(fn,args||{}); if(error) throw error; return data; }

/* ── الدخول ── */
function normPhone(v){ let d=String(v||'').replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/\D+/g,''); if(d.startsWith('00')) d=d.slice(2); if(d.startsWith('05')) d='966'+d.slice(1); else if(d.startsWith('5')&&d.length===9) d='966'+d; return d; }

async function sendOtp(){
  const d=normPhone(($('au')||{}).value||''); if(d.length<12){ lgFail(LX('رقم الجوال غير صحيح','Invalid number')); return; }

  catch(e){ lgFail(LX('تعذّر إرسال الرمز، تأكد من الرقم','Could not send the code')); }
}

  await enter(true);
}
async function enter(fromLogin){
  let me=null; try{ me=await rpc('growth_me'); }catch(e){ if(fromLogin) lgFail(LX('تعذّر الاتصال بالخادم','Could not reach the server')); booting=false; render(); return; }

function orgCities(o){ return (o.cities&&o.cities.length?o.cities:[o.city]).filter(Boolean); }

function readOrg(){ const f=S.f, v=id=>(($(id)||{}).value||'').trim(); f.name=v('o_name'); if(!f.id){ f.phone=v('o_phone'); f.approved=!!(($('o_ok')||{}).checked); } f.areas=v('o_areas'); f.cr_number=v('o_cr'); f.experience=v('o_exp'); f.note=v('o_note'); const c2=v('o_city2'); if(c2&&!f.cities.includes(c2)) f.cities.push(c2); }

function openOrg(o){ S={ t:'org', f:o?{ id:o.id, name:o.name||'', phone:o.phone||'', cities:orgCities(o).slice(), areas:o.areas||'', services:(o.services||[]).slice(), cr_number:o.cr_number||'', experience:o.experience||'', note:o.note||'' }
  :{ id:null, name:'', phone:'', cities:[], areas:'', services:[], cr_number:'', experience:'', note:'', approved:true } }; renderSheet(); const i=$('o_name'); if(i&&!o) i.focus(); }
async function saveOrg(){
  readOrg(); const f=S.f; S.err='';
  if(!f.name){ S.err=errL('name'); renderSheet(); return; }
  if(!f.id&&normPhone(f.phone).length!==12){ S.err=errL('phone'); renderSheet(); return; }
  if(!f.services.length){ S.err=errL('services'); renderSheet(); return; }
  S.busy=true; renderSheet();
  try{ const r=await rpc('growth_org_save',{ p:{ id:f.id||'', name:f.name, phone:f.phone, cities:f.cities, areas:f.areas, services:f.services, cr_number:f.cr_number, experience:f.experience, note:f.note, status:f.approved?'approved':'pending' } });
    if(!r||!r.ok){ S.busy=false; S.err=errL(r&&r.error); renderSheet(); return; }
    S=null; renderSheet(); toast(LX('انحفظت','Saved')); load();
  }catch(e){ S.busy=false; S.err=errL(''); renderSheet(); }
}
async function setStatus(id,to){
  const o=ORGS.find(x=>x.id===id); if(!o) return;
  if(to==='suspended'&&!confirm(LX('إيقاف «'+o.name+'»؟','Suspend "'+o.name+'"?'))) return;
  if(to==='rejected'&&!confirm(LX('رفض «'+o.name+'»؟','Reject "'+o.name+'"?'))) return;
  try{ const r=await rpc('growth_org_status',{ p_id:id, p_status:to }); if(!r||!r.ok) throw 0; o.status=to; toast(stL(to)); load(); }catch(e){ toast(errL('')); }
}

async function openTeam(id){ const o=ORGS.find(x=>x.id===id); if(!o) return; S={ t:'team', id, name:o.name, rows:null }; renderSheet(); try{ S.rows=await rpc('growth_org_team',{ p_id:id })||[]; }catch(e){ S.rows=[]; } if(S&&S.t==='team') renderSheet(); }

async function saveBranch(){

  S.busy=true; renderSheet();
  try{ const r=await rpc('growth_branch_save',{ p:{ id:f.id||'', provider_id:S.id, name:f.name, city:f.city, district:f.district, phone:f.phone, address:f.address, is_main:f.is_main, active:f.active } });

async function addMgr(){
  const name=(($('m_name')||{}).value||'').trim(), phone=(($('m_phone')||{}).value||'').trim(); S.err='';
  if(normPhone(phone).length!==12){ S.err=errL('phone'); renderSheet(); return; }

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return; const a=el.dataset.a, id=el.dataset.id;
  if(a==='ovclose'){ if(e.target===el){ S=null; renderSheet(); } return; }
  if(a==='send') sendOtp(); else if(a==='verify') verifyOtp(); else if(a==='chnum'){ otpSent=false; otpPhone=''; lgErr=''; render(); }
  else if(a==='lang') setLang(); else if(a==='out') signOut();
  else if(a==='fst'){ fSt=el.dataset.to; render(); }
  else if(a==='add') openOrg(null); else if(a==='edit') openOrg(ORGS.find(x=>x.id===id));
  else if(a==='st') setStatus(id,el.dataset.to); else if(a==='doc') openDoc(id);
  else if(a==='team') openTeam(id); else if(a==='branches') openBranches(id);
  else if(a==='close'){ S=null; renderSheet(); }
  else if(a==='pick'){ const arr=S.f[el.dataset.g], v=el.dataset.v, i=arr.indexOf(v); if(i<0) arr.push(v); else arr.splice(i,1); el.classList.toggle('on',i<0); el.setAttribute('aria-pressed',i<0?'true':'false'); }
  else if(a==='saveorg') saveOrg();
  else if(a==='bradd'){ S.f={ id:null, name:'', city:'', district:'', phone:'', address:'', is_main:false, active:true }; S.err=''; renderSheet(); }
  else if(a==='bredit'){ const b=(S.rows||[]).find(x=>x.id===id); if(b){ S.f=Object.assign({},b); S.err=''; renderSheet(); } }
  else if(a==='brback'){ S.f=null; S.err=''; renderSheet(); } else if(a==='savebr') saveBranch();
  else if(a==='mgrs') openMgrs(); else if(a==='mgradd') addMgr(); else if(a==='copylink') copyText(joinLink(el.dataset.c));
  else if(a==='mgrtog'){ const m=(S.rows||[]).find(x=>x.phone===el.dataset.p); rpc('growth_staff_set',{ p_phone:el.dataset.p, p_name:m?m.name:'', p_active:el.dataset.on==='1' }).then(loadMgrs).catch(()=>toast(errL(''))); }
  else if(a==='mgrdel'){ if(confirm(LX('حذف الشريك؟','Remove this partner?'))) rpc('growth_staff_remove',{ p_phone:el.dataset.p }).then(loadMgrs).catch(()=>toast(errL(''))); }
});
