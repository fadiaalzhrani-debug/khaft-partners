<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>خافِت | بوابة الفنيين — Technicians Portal</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23141414'/><text y='.9em' x='20' font-size='60'>🧑‍🔧</text></svg>" />
<meta name="theme-color" content="#141414" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" /></noscript>
<style>
  :root{
    --gold:#F5C518; --gold-strong:#E7B70B; --gold-deep:#B8860B; --gold-soft:#FBF1C9; --gold-tint:#FDF8E7;
    --ink:#1A1712; --brand-soft:#FBF1C6;
    --bg:#FAF7EF; --panel:#F3EEE2; --card:#fff; --line:#EBE5D6;
    --text:#1A1712; --muted:#6E685B;
    --ok:#15803D; --ok-soft:#DCFCE7; --danger:#DC2626;
    --r:18px; --r-sm:12px; --shadow:0 1px 2px rgba(40,32,10,.04),0 10px 28px rgba(40,32,10,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Cairo','Segoe UI',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:920px;margin:0 auto;padding:0 16px}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  a{color:inherit;text-decoration:none}

  header.top{position:sticky;top:0;z-index:30;background:rgba(250,247,239,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
  .top .wrap{display:flex;align-items:center;gap:12px;min-height:66px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:900;font-size:1.2rem}
  .brand .mk{width:38px;height:38px;border-radius:11px;background:var(--gold);color:var(--ink);display:grid;place-items:center;flex-shrink:0}
  .brand .mk svg{width:26px;height:26px}
  .brand small{display:block;color:var(--muted);font-size:.72rem;font-weight:700}
  .spacer{flex:1}
  .langsw{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
  .langsw button{padding:8px 12px;border-radius:9px;font-weight:800;font-size:.85rem;color:var(--muted)}
  .langsw button.active{background:var(--gold);color:var(--ink)}

  .hero{padding:20px 0 4px}
  .hero h1{font-size:1.35rem;font-weight:900}
  .hero p{color:var(--muted);font-size:.92rem;margin-top:2px}
  .stat-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:120px}
  .stat .n{font-size:1.5rem;font-weight:900;line-height:1}
  .stat .n.gold{color:var(--gold-deep)}
  .stat .l{color:var(--muted);font-size:.8rem;margin-top:4px}

  .jobs{margin-top:18px;padding-bottom:40px}
  .day-head{position:sticky;top:0;z-index:5;font-weight:900;font-size:1.02rem;color:var(--gold-deep);background:var(--gold-tint);border:1px solid var(--line);border-radius:12px;padding:11px 16px;margin:22px 2px 12px}
  .day-head:first-child{margin-top:4px}
  /* تقويم الشهر */
  .inv-toggle{width:100%;margin-top:16px;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:14px 16px;font-weight:900;font-size:1.05rem;text-align:right;cursor:pointer;font-family:inherit;display:flex;justify-content:space-between;align-items:center}
  .inv-toggle span{color:var(--gold-deep)}
  .inv-box{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
  .inv-add-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .inv-add-row input{padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-family:inherit;font-weight:700;flex:1;min-width:120px}
  .inv-add-row input#inv_new_unit,.inv-add-row input#inv_new_qty{max-width:90px;flex:0 0 auto}
  .inv-list{margin-top:12px;display:grid;gap:10px}
  .inv-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}
  .inv-item.low{border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.08)}
  .inv-info{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .inv-info b{font-size:1.05rem;color:var(--text)}
  .inv-qty{font-weight:800;color:var(--muted);font-size:.9rem}
  .inv-item.low .inv-qty{color:#fca5a5}
  .inv-ctl{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .inv-ctl .inv-amt{width:80px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:800;text-align:center;font-family:inherit}
  .inv-ctl .tbtn{flex:0 0 auto;padding:10px 14px;font-size:.95rem}
  .calbar{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px}
  .cal-head{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:11px;font-weight:900;font-size:1.05rem;color:var(--gold-deep)}
  .cal-nav{background:var(--card);border:1px solid var(--line);color:var(--text);width:34px;height:34px;border-radius:10px;font-size:1.25rem;font-weight:900;cursor:pointer;line-height:1;font-family:inherit}
  .cal-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
  .cal-day{flex:0 0 auto;width:66px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:.12s;color:var(--muted);font-family:inherit}
  .cal-day .cd-w{font-size:.68rem;font-weight:700}
  .cal-day .cd-n{font-size:1.18rem;font-weight:900;color:var(--text);line-height:1}
  .cal-day .cd-c{font-size:.72rem;font-weight:800;color:var(--muted);white-space:nowrap}
  .cal-day.has{background:rgba(245,197,24,.1);border-color:rgba(245,197,24,.4)}
  .cal-day.has .cd-c{color:var(--gold-deep)}
  .cal-day.today{border-color:var(--gold)}
  .cal-day.today .cd-n{color:var(--gold-deep)}
  .cal-day.sel{background:var(--gold);border-color:var(--gold)}
  .cal-day.sel .cd-w,.cal-day.sel .cd-n,.cal-day.sel .cd-c{color:var(--ink)}
  .cal-filter{margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.9rem;color:var(--gold-deep);font-weight:800}
  .cal-filter button{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:5px 13px;font-weight:800;cursor:pointer;font-family:inherit;font-size:.85rem}
  .tjob{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
  .tjob.done{opacity:.6}
  .tj-head{background:linear-gradient(90deg,rgba(245,197,24,.14),rgba(245,197,24,.05));padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
  .tj-when{font-weight:900;font-size:1.28rem;display:flex;align-items:center;gap:8px}
  .status{font-size:.76rem;font-weight:800;padding:5px 12px;border-radius:999px;white-space:nowrap;background:var(--gold-tint);color:var(--muted);border:1px solid var(--line)}
  .status.new{background:rgba(245,197,24,.15);color:var(--gold-deep)}
  .status.confirmed{background:rgba(56,132,255,.15);color:#7fb0ff}
  .status.progress{background:rgba(245,197,24,.15);color:var(--gold-deep)}
  .status.done{background:rgba(34,197,94,.15);color:#6ee7a0}
  .tj-body{padding:16px 18px}
  .tj-row{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);font-size:1.12rem}
  .tj-row:last-child{border-bottom:none}
  .tj-k{min-width:124px;color:var(--muted);font-weight:700;font-size:1rem;flex-shrink:0}
  .tj-v{flex:1;font-weight:800}
  .tj-v a{color:var(--gold-deep);font-weight:800}
  .quick-tag{display:inline-block;background:var(--gold);color:var(--ink);font-weight:900;padding:6px 14px;border-radius:999px;font-size:.9rem;margin-bottom:6px}
  .tj-row.early-row{background:rgba(37,211,102,.08);border-radius:10px;padding:10px 8px;border-bottom:none}
  .tj-row.early-row .tj-v{color:#5ee68f;font-weight:800}
  .tvideo{display:inline-flex;align-items:center;gap:6px;background:#7c3aed;color:#fff !important;padding:9px 15px;border-radius:11px;font-weight:800;font-size:.92rem;margin-top:4px}
  .ttrans{display:inline-block;background:rgba(56,132,255,.15);color:#7fb0ff !important;padding:3px 10px;border-radius:999px;font-weight:800;font-size:.82rem;margin-right:6px;white-space:nowrap}
  .tmap{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:var(--gold);color:var(--ink);padding:9px 15px;border-radius:11px;font-weight:800;font-size:.9rem}
  .tacts{display:flex;flex-wrap:wrap;gap:10px;padding:0 18px 16px}
  .tbtn{flex:1;padding:16px;border-radius:13px;font-weight:900;font-size:1.12rem;text-align:center}
  .tbtn.start{background:var(--gold);color:var(--ink)}
  .tbtn.done{background:var(--ok);color:#fff}
  .tbtn.donelbl{background:var(--ok-soft);color:#6ee7a0}
  .tbtn.reject{flex:0 0 auto;background:transparent;border:1px solid rgba(248,113,113,.45);color:#fca5a5;font-size:.95rem}
  .rj-list{display:grid;gap:9px}
  .rj-opt{width:100%;text-align:start;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:14px 15px;font-weight:700;font-size:1rem;cursor:pointer;font-family:inherit}
  .rj-opt:hover{border-color:#fca5a5}
  .tbtn.follow{flex:0 0 auto;background:rgba(56,132,255,.14);border:1px solid rgba(56,132,255,.4);color:#7fb0ff;font-size:.95rem}
  .fu-field{margin-bottom:13px}
  .fu-field label{display:block;font-weight:800;color:var(--muted);font-size:.9rem;margin-bottom:6px}
  .fu-field input,.fu-field textarea{width:100%;padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--text);font-weight:700;font-size:1.05rem;font-family:inherit}
  .fu-field input:focus,.fu-field textarea:focus{outline:none;border-color:var(--gold)}
  .delay-ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 18px;background:rgba(255,149,0,.08);border-top:1px solid var(--line)}
  .delay-ctl .dc-l{font-weight:800;color:#f0a340;font-size:.95rem}
  .delay-ctl .dc-l b{color:#ffb347}
  .delay-ctl .dc-btns{display:flex;gap:7px}
  .delay-ctl .dc-btns button{background:#2a2318;border:1px solid rgba(255,149,0,.4);color:#ffb347;font-weight:900;border-radius:10px;padding:9px 13px;font-size:.95rem;cursor:pointer;font-family:inherit}
  .delay-ctl .dc-btns .dc-reset{background:var(--card);border-color:var(--line);color:var(--muted)}
  .tbtn.arrive{background:#25D366;color:#fff}
  .tbtn.arrivedlbl{background:rgba(37,211,102,.15);color:#5ee68f}
  .tbtn.waitpay{background:rgba(96,165,250,.15);color:#93c5fd}
  .tbtn.devpay{background:#2563eb;color:#fff}
  .status.due-b{background:rgba(96,165,250,.18);color:#93c5fd;border-color:transparent}
  .status.paid-b{background:rgba(37,211,102,.18);color:#5ee68f;border-color:transparent}
  .inv-pay{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:6px 13px}
  .inv-pay div{display:flex;justify-content:space-between;padding:7px 0;font-weight:800;font-size:.98rem}
  .inv-pay div+div{border-top:1px dashed var(--line)}
  .inv-pay .due{font-size:1.15rem;color:#93c5fd}
  .inv-row .ir-lock{font-size:.8rem;font-weight:800;color:#5ee68f;margin-inline-start:6px}
  .inv-row .ir-static{min-width:74px;text-align:center;font-weight:900;font-size:1.05rem}
  .tbtn.onway{background:#3884ff;color:#fff}
  .tbtn.onwaylbl{background:rgba(56,132,255,.15);color:#7fb0ff}
  .tj-badges{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .status.arrived-b{background:rgba(37,211,102,.18);color:#5ee68f;border-color:transparent}
  .twa{display:inline-flex;align-items:center;gap:4px;background:rgba(37,211,102,.14);color:#5ee68f !important;padding:3px 10px;border-radius:999px;font-weight:800;white-space:nowrap}

  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty .ico{font-size:3.4rem;margin-bottom:12px;opacity:.5}
  .offline{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:#fca5a5;border-radius:12px;padding:12px 16px;margin-top:14px;font-size:.9rem;font-weight:600}

  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--gold);color:var(--ink);padding:14px 24px;border-radius:14px;font-weight:800;z-index:60;opacity:0;transition:.3s;box-shadow:var(--shadow);max-width:90%;text-align:center;pointer-events:none}
  .tbtn.inv{background:var(--gold-tint);border:1px solid var(--gold-soft);color:var(--gold-deep)}
  .tbtn.inv.sent{background:rgba(34,197,94,.14);border-color:transparent;color:#6ee7a0}
  /* محرر الفاتورة */
  .inv-modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);backdrop-filter:blur(2px);display:none;align-items:flex-end;justify-content:center}
  .inv-modal.show{display:flex}
  .inv-card{background:var(--panel);color:var(--text);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px}
  .inv-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .inv-head b{font-size:1.35rem;font-weight:900}
  .inv-head button{width:38px;height:38px;border-radius:50%;background:var(--card);color:var(--text);font-size:1.2rem}
  .inv-add{display:flex;gap:8px;margin-bottom:14px}
  .inv-add select{flex:1;padding:15px 12px;border-radius:12px;background:var(--card);color:var(--text);border:1px solid var(--line);font-weight:800;font-size:1.05rem}
  .inv-add .cust{padding:15px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--text);font-weight:800;white-space:nowrap;font-size:1rem}
  .inv-row{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
  .inv-row .ir-name{flex:1;font-weight:800;font-size:1.15rem}
  .inv-row .ir-pname{flex:1;min-width:0;padding:11px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--text);font-weight:800;font-size:1.05rem;font-family:inherit}
  .inv-row .ir-pname:focus{outline:none;border-color:var(--gold)}
  .inv-row .ir-qty{display:flex;align-items:center;background:var(--card);border-radius:11px;overflow:hidden}
  .inv-row .ir-qty button{width:38px;height:40px;font-weight:900;color:var(--gold-deep);font-size:1.35rem}
  .inv-row .ir-qty span{min-width:30px;text-align:center;font-weight:900;font-size:1.15rem}
  .inv-row .ir-price{width:92px;padding:11px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--text);font-weight:900;text-align:center;font-size:1.1rem}
  .inv-row .ir-del{color:var(--danger);font-size:1.3rem;padding:6px}
  /* بنود الحجز: القطعة المحجوزة لها ✕ (العميل عنده الغرض) وخيارات اللون */
  .inv-row .ir-bk{flex:1;min-width:0}
  .inv-row .ir-img{width:46px;height:46px;border-radius:10px;object-fit:contain;border:1px solid var(--line);background:#fff;flex-shrink:0}
  /* إعلان الإدارة للفنيين */
  #updWall{position:fixed;inset:0;z-index:99999;background:var(--bg);display:grid;place-items:center;padding:24px;text-align:center}
  #updWall .uw-box{max-width:360px}
  #updWall .uw-ic{width:88px;height:88px;border-radius:28px;background:var(--gold);display:grid;place-items:center;font-size:2.5rem;margin:0 auto 18px;box-shadow:0 12px 30px rgba(245,197,24,.35)}
  #updWall h2{font-size:1.55rem;font-weight:900;margin:0}
  #updWall p{color:var(--muted);margin:10px 0 22px;line-height:1.9;font-weight:600;font-size:1rem}
  #updWall .uw-btn{display:block;width:100%;background:var(--ink);color:#fff;border:none;border-radius:16px;padding:16px;font-weight:900;font-size:1.05rem;font-family:inherit;text-decoration:none;cursor:pointer}
  .rz-banner{margin:12px 0 0;background:#FFF3C4;border:1.5px solid var(--gold);border-radius:14px;padding:11px 14px;font-weight:800;font-size:.95rem;line-height:1.6}
  .inv-row .ir-bk .ir-name{display:block}
  .ir-opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .ir-opts button{border:1.5px solid var(--line);background:#fff;color:var(--text);border-radius:999px;padding:4px 11px;font-size:.82rem;font-weight:800;font-family:inherit;cursor:pointer}
  .ir-opts button.on{background:var(--gold);border-color:var(--gold);color:#1a1408}
  .inv-pay .refund{color:#0b7a3b;font-weight:900}
  .inv-empty{color:var(--muted);text-align:center;padding:20px;font-weight:700;font-size:1.05rem}
  .inv-disc{margin-top:12px;background:rgba(37,211,102,.12);border:1px solid rgba(37,211,102,.35);border-radius:10px;padding:9px 13px;color:#5ee68f;font-weight:800;font-size:.92rem}
  .inv-total{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:14px;border-top:2px solid var(--line);font-weight:900;font-size:1.5rem}
  .inv-total b{color:var(--gold-deep)}
  .inv-acts{display:flex;gap:10px;margin-top:18px}
  .inv-acts .tbtn{flex:1;font-size:1.08rem;padding:17px}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .logout{color:var(--muted);font-weight:700;font-size:.85rem;padding:6px 10px}
  /* تسجيل الدخول */
  .login{max-width:380px;margin:44px auto;padding:0 18px;text-align:center}
  .login-top{display:flex;justify-content:flex-start;margin:-24px 0 14px}
  .login-back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:.95rem}
  .login .ic{font-size:3rem;margin-bottom:8px}
  .login h1{font-size:1.5rem;font-weight:900}
  .login p{color:var(--muted);margin:6px 0 20px;font-size:.9rem}
  .login input{width:100%;padding:15px;border-radius:13px;background:var(--card);border:1px solid var(--line);color:var(--text);font-weight:700;font-size:1.05rem;margin-bottom:12px}
  .login input:focus{outline:none;border-color:var(--gold)}
  .login .btn{width:100%;background:var(--gold);color:var(--ink);font-weight:900;padding:16px;border-radius:13px;font-size:1.05rem;transition:.15s}
  .login .btn:hover{background:var(--gold-strong)}
  .login .lgerr{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:#fca5a5;border-radius:12px;padding:12px;margin-top:12px;font-weight:600;font-size:.9rem}

  /* ===== الشريط السفلي: أربعة أقسام ===== */
  body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;background:rgba(23,26,32,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tb{flex:1;padding:8px 3px 7px;background:none;border:none;color:var(--muted);font-family:inherit;cursor:pointer;position:relative}
  .tb i{display:block;font-size:1.15rem;font-style:normal;line-height:1.3}
  .tb span{display:block;font-size:.6rem;font-weight:800;margin-top:1px}
  .tb.on{color:var(--gold-deep)}
  .tb.on::before{content:"";position:absolute;top:0;right:24%;left:24%;height:2px;background:var(--gold);border-radius:0 0 3px 3px}
  .tb .tdot{position:absolute;top:6px;left:27%;width:7px;height:7px;border-radius:50%;background:var(--gold);border:1.5px solid var(--card)}

  /* ===== المستودع الاحترافي ===== */
  :root{ --amber:#FBBF24; --red:#F87171; }
  /* ==== تبويب حسابي ==== */
  .acc-wrap{padding:18px 0 100px}
  .acc-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .acc-av{width:56px;height:56px;border-radius:16px;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-size:1.8rem;flex-shrink:0}
  .acc-head b{display:block;font-size:1.18rem;font-weight:900;line-height:1.3}
  .acc-head span{color:var(--muted);font-size:.85rem;font-weight:700}
  .acc-panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
  .acc-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-weight:700}
  .acc-row:last-child{border-bottom:0}
  .acc-row span{color:var(--muted)}
  .acc-lbl{font-weight:900;padding:14px 0 10px}
  .acc-langs{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 14px}
  .acc-lang{padding:9px 16px;border-radius:11px;font-weight:800;font-size:.9rem;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
  .acc-lang.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
  .acc-code{background:linear-gradient(135deg,rgba(245,197,24,.16),rgba(245,197,24,.05));border:1px solid rgba(245,197,24,.45);border-radius:16px;padding:18px;text-align:center;margin-bottom:14px}
  .acc-code small{color:var(--muted);font-size:.84rem;line-height:1.6;display:block}
  .acc-code-v{font-size:1.9rem;font-weight:900;color:var(--gold-deep);letter-spacing:6px;margin:8px 0}
  .set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--ink);font-family:inherit;text-align:inherit}
  .set-row:last-child{border-bottom:0}
  .set-row .sr-l{display:flex;align-items:center;gap:11px;font-weight:700;font-size:.95rem}
  .set-row .sr-ic{font-size:1.2rem}
  .set-row .sr-ar{color:var(--muted);font-weight:900;font-size:1.2rem}
  .set-row.danger .sr-l{color:#c0392b}
  .set-body{padding:6px 2px 12px}
  .set-body input{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:#FBF9F3;color:var(--text);font-weight:700;font-size:1rem}
  /* ═ مربّعات الرئيسية (زي لوحة الإدارة) ═ */
  .hgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
  @media(max-width:430px){.hgrid{grid-template-columns:1fr}}
  .hcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:start;cursor:pointer;box-shadow:var(--shadow);transition:.14s;display:flex;flex-direction:column;gap:5px}
  .hcard:hover{border-color:var(--gold);transform:translateY(-2px)}
  .hcard:active{transform:scale(.98)}
  .hcard .hc-ic{font-size:2rem;line-height:1}
  .hcard h3{font-size:1.16rem;font-weight:900;color:var(--ink)}
  .hcard p{color:var(--muted);font-size:.85rem;font-weight:700;flex:1;margin:0}
  .hcard .hc-open{color:var(--gold-deep);font-weight:800;font-size:.82rem;margin-top:2px}
  .backbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 16px;font-weight:800;color:var(--ink);font-family:inherit;cursor:pointer}
  .backbtn:hover{border-color:var(--gold)}
  .worth{background:linear-gradient(135deg,rgba(245,197,24,.14),rgba(245,197,24,.04));border:1px solid rgba(245,197,24,.32);border-radius:14px;padding:14px 15px;margin-top:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
  .worth .w-lbl{color:var(--muted);font-size:.7rem;font-weight:700;margin-bottom:3px}
  .worth .w-big{font-size:1.65rem;font-weight:900;color:var(--gold-deep);font-variant-numeric:tabular-nums;line-height:1}
  .worth .w-big span{font-size:.85rem}
  .worth .w-side{text-align:end;display:flex;flex-direction:column;gap:6px}
  .worth .w-side b{font-size:.85rem;font-weight:800;font-variant-numeric:tabular-nums}
  .w-chip{font-size:.62rem;font-weight:800;padding:2px 8px;border-radius:99px}
  .w-chip.a{background:rgba(251,191,36,.14);color:var(--amber)} .w-chip.r{background:rgba(248,113,113,.14);color:var(--red)} .w-chip.g{background:rgba(74,222,128,.13);color:#6ee7a0}

  .inv-add-toggle{width:100%;margin-top:11px;background:var(--card);border:1px dashed var(--gold-line, rgba(245,197,24,.32));color:var(--gold-deep);border-radius:12px;padding:12px;font-weight:800;font-size:.92rem;cursor:pointer;font-family:inherit}
  .isearch{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:2px 12px;margin-top:11px}
  .isearch i{color:var(--muted);font-style:normal}
  .isearch input{flex:1;background:none;border:none;color:var(--text);font-family:inherit;font-size:.9rem;font-weight:600;padding:11px 0;outline:none}
  .ifilters{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
  .ifl{flex:0 0 auto;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:.74rem;font-weight:800;color:var(--muted);white-space:nowrap;cursor:pointer;font-family:inherit;font-variant-numeric:tabular-nums}
  .ifl.on{background:var(--gold);border-color:var(--gold);color:#141414}
  .ilist{display:flex;flex-direction:column;gap:9px;margin-top:11px}

  .ii-thumb{width:78px;height:78px;border-radius:13px;object-fit:cover;background:#F3EDE0;border:1px solid var(--line);flex-shrink:0;display:grid;place-items:center;font-size:1.4rem;overflow:hidden}
  .ii-thumb img{width:100%;height:100%;object-fit:cover;display:block}

  .ib.cam{position:relative;overflow:hidden} .ib.cam input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .sp-wrap{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:8px}
  .sp-search{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);font-family:inherit;font-weight:700;margin-bottom:8px;background:#fff}
  .sp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:46vh;overflow:auto}
  .sp-it{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;text-align:center;cursor:pointer;font-family:inherit}
  .sp-it:active{transform:scale(.97)} .sp-it.out{opacity:.45}
  .sp-it .im{width:100%;aspect-ratio:1;border-radius:9px;background:#F3EDE0;display:grid;place-items:center;font-size:1.6rem;overflow:hidden}
  .sp-it .im img{width:100%;height:100%;object-fit:cover;display:block}
  .sp-it b{display:block;font-size:.76rem;line-height:1.25;margin-top:5px;max-height:2.5em;overflow:hidden}
  .sp-it small{display:block;font-size:.68rem;color:var(--muted);font-weight:700}
  .iitem{background:var(--card);border:1px solid var(--line);border-right:3px solid var(--line);border-radius:13px;padding:12px 13px}
  .iitem.ok{border-right-color:var(--ok, #22C55E)} .iitem.low{border-right-color:var(--amber)} .iitem.out{border-right-color:var(--red)}
  .ii-top{display:flex;align-items:flex-start;gap:10px}
  .ii-name{flex:1;min-width:0}
  .ii-name b{font-size:.96rem;font-weight:800}
  .ii-min{display:block;color:var(--muted);font-size:.68rem;font-weight:600;margin-top:1px}
  .ii-min em{font-style:normal;color:var(--amber);font-weight:700}
  .iitem.out .ii-min em{color:var(--red)}
  .ii-qty{text-align:end;flex-shrink:0}
  .ii-num{font-size:1.4rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
  .ii-num.ok{color:#6ee7a0} .ii-num.low{color:var(--amber)} .ii-num.out{color:var(--red)}
  .ii-u{color:var(--muted);font-size:.6rem;font-weight:700}
  .ii-badge{display:inline-block;font-size:.6rem;font-weight:800;padding:2px 7px;border-radius:99px;margin-top:3px;white-space:nowrap}
  .ii-badge.ok{background:rgba(74,222,128,.13);color:#6ee7a0} .ii-badge.low{background:rgba(251,191,36,.14);color:var(--amber)} .ii-badge.out{background:rgba(248,113,113,.14);color:var(--red)}
  .ii-mid{display:flex;gap:8px;margin-top:10px}
  .iprice{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
  .iprice small{display:block;color:var(--muted);font-size:.6rem;font-weight:800}
  .iprice b{font-size:.9rem;font-weight:800;font-variant-numeric:tabular-nums}
  .iprice.sell b{color:var(--gold-deep)}
  .imar{color:#6ee7a0;font-size:.62rem;font-weight:700}
  .ii-acts{display:flex;gap:6px;margin-top:10px;align-items:center}
  .ii-acts .inv-amt{width:62px;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-family:inherit;font-weight:800;text-align:center}
  .ib{flex:1;padding:9px 4px;border-radius:9px;border:none;font-family:inherit;font-size:.8rem;font-weight:800;cursor:pointer}
  .ib.in{background:rgba(74,222,128,.14);color:#6ee7a0} .ib.out{background:rgba(248,113,113,.14);color:#fca5a5} .ib.out:disabled{opacity:.35}
  .ib.edit{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:9px 11px}

  /* ===== سجل حركة المستودع ===== */
  .sl-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:22px 2px 10px;font-weight:900;font-size:1.02rem;color:var(--gold-deep)}
  .sl-head span{color:var(--muted);font-weight:600;font-size:.76rem}
  .sl-list{display:flex;flex-direction:column;gap:7px}
  .sl-empty{color:var(--muted);text-align:center;padding:18px;font-size:.9rem;background:var(--card);border:1px solid var(--line);border-radius:12px}
  .slog{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
  .sl-d{font-weight:900;font-size:.95rem;font-variant-numeric:tabular-nums;min-width:44px;text-align:center;padding:5px 6px;border-radius:8px;flex-shrink:0}
  .sl-d.in{color:#6ee7a0;background:rgba(34,197,94,.12)}
  .sl-d.out{color:#fca5a5;background:rgba(248,113,113,.12)}
  .sl-m{flex:1;min-width:0}
  .sl-m b{display:block;font-size:.86rem;font-weight:800}
  .sl-m span{color:var(--muted);font-size:.72rem;font-weight:600}
  .sl-t{color:var(--muted);font-size:.68rem;font-weight:600;text-align:end;flex-shrink:0;white-space:nowrap}

  /* ===== قسم: حجز لعميل ===== */
  .bk-loc{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .bk-loc .tbtn{flex:1;font-size:.95rem;padding:13px 10px}
  .bk-loc-ok{font-size:.85rem;font-weight:800;color:#16a34a}
  .bk-loc-ok a{color:#16a34a}
  .bk-wa{background:var(--card);border:1.5px solid #128C7E;border-radius:16px;padding:14px;margin-top:14px}
  .bk-wa-h{display:flex;align-items:center;gap:10px;justify-content:space-between}
  .bk-wa-h b{font-weight:900;color:#0f7a6d;font-size:1.02rem}
  .bk-wa-go{background:#128C7E;color:#fff;border-radius:11px;padding:9px 14px;font-weight:800;font-size:.92rem}
  .bk-wa-hint{color:var(--muted);font-size:.84rem;font-weight:700;margin:6px 0 8px}
  .bk-wa textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fbfdfc;font:inherit;font-weight:600;font-size:.95rem;color:var(--text);resize:vertical}
  .bk-wa-acts{display:flex;gap:8px;margin-top:10px}
  .bk-wa-acts .tbtn{font-size:1rem;padding:12px}
  .bk-found{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .bk-found span{font-size:.8rem;font-weight:800;padding:2px 10px;border-radius:999px;background:#e3f5ea;color:#15803d}
  .bk-found span.miss{background:#fdefd5;color:#a15c07}
  .bk-svc{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
  .bk-svc-n b{display:block;font-weight:800;line-height:1.35}
  .bk-svc-n small{color:var(--muted);font-weight:700;font-size:.8rem}
  .bk-qty{display:flex;align-items:center;gap:4px;background:var(--panel);border-radius:10px;padding:2px}
  .bk-qty button{width:32px;height:32px;border-radius:8px;font-weight:900;font-size:1.1rem}
  .bk-qty span{min-width:18px;text-align:center;font-weight:900}
  .bk-x{width:34px;height:34px;border-radius:9px;color:var(--muted);font-size:1.15rem;font-weight:800}
  .bk-add{width:100%;margin-top:10px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font:inherit;font-weight:700;font-size:.98rem;color:var(--text)}
  .bk-est{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-weight:800}
  .bk-exact{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:13px;border:1.5px dashed var(--line);background:#fcfbf7}
  .bk-exact.on{border-style:solid;border-color:var(--gold);background:var(--gold-tint)}
  .bk-exact label{font-weight:800;color:var(--muted);font-size:.92rem;flex:1;min-width:140px}
  .bk-exact input{padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--card);font:inherit;font-weight:800;font-size:1.05rem;color:var(--text);min-width:130px}
  .bk-exact-ok{margin-top:8px;font-weight:800;color:#15803d;font-size:.92rem}
  .bk-clash{margin-top:6px;font-weight:800;color:#b45309;font-size:.88rem}
  .bk-maplink{display:flex;gap:8px;margin-bottom:8px}
  .bk-maplink input{flex:1;min-width:0;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--text);font-weight:700;font-size:.95rem;font-family:inherit}
  .bk-maplink .tbtn{flex:0 0 auto;font-size:.95rem;padding:12px 14px}
  .bk-photo{display:flex;align-items:center;gap:10px}
  .bk-photo img{width:96px;height:96px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
  .bk-photo .tbtn{flex:1;font-size:.95rem;padding:12px}
  .bk-photo-btn{position:relative;display:block;overflow:hidden;font-size:.98rem;padding:13px;cursor:pointer}
  .bk-photo-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .bookf{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px;display:flex;flex-direction:column;gap:11px}
  /* اختيار اليوم ونافذة الوصول — منسوخ حرفياً من تطبيق خافت */
  .bkpanel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:16px}
  .bkpanel h3{font-size:1.05rem;font-weight:800;margin-bottom:15px;display:flex;align-items:center;gap:8px}
  .dates{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .dchip{flex-shrink:0;min-width:76px;text-align:center;padding:11px 8px;border-radius:15px;border:1.5px solid var(--line);background:#fcfbf7;transition:.15s;font-family:inherit;color:inherit;cursor:pointer}
  .dchip.active{background:var(--ink,#1A1712);color:#fff;border-color:var(--ink,#1A1712)}
  .dchip small{display:block;font-size:.8rem;opacity:.85;font-weight:700}
  .dchip b{font-size:1.45rem;display:block;font-weight:800}
  .dchip .mon{font-size:.8rem}
  .more-date{position:relative;border-style:dashed;border-color:var(--gold-strong,#E7B70B);background:rgba(245,197,24,.12);cursor:pointer;display:block}
  .more-date b{color:var(--gold-deep,#B8860B)}
  .more-date.active{border-style:solid;background:var(--ink,#1A1712);color:#fff;border-color:var(--ink,#1A1712)}
  .more-date.active b{color:#fff}
  .more-date input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:none;padding:0}
  .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:4px}
  .slot{padding:13px 6px;border-radius:13px;border:1.5px solid var(--line);background:#fcfbf7;font-weight:700;text-align:center;transition:.15s;font-size:1rem;font-family:inherit;color:inherit;cursor:pointer}
  .slot.win{white-space:nowrap;font-size:.98rem;font-weight:800}
  .slot.active{background:var(--ink,#1A1712);color:#fff;border-color:var(--ink,#1A1712)}
  .slot:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
  /* نافذة عليها حجز: تنضغط وتفتح تفاصيله — والجديدة غير المقروءة بالأخضر */
  .slot .bl{display:block;font-size:.78rem;font-weight:800;margin-top:3px}
  .slot.busy{background:#F3EEE2;border-style:dashed;color:var(--muted)}
  .slot.busy .bl{color:#B8860B}
  .slot.busy.newbk{background:rgba(22,163,74,.14);border-color:#16a34a;border-style:solid;color:#166534}
  .slot.busy.newbk .bl{color:#16a34a}
  /* جدول اليوم بالرئيسية: أخضر = جديد، ذهبي = محجوز، رمادي = فاضي */
  .slot.free{background:#EFEAE0;border-color:var(--line);color:var(--muted)}
  .slot.b-new{background:rgba(22,163,74,.15);border-color:#16a34a;color:#166534}
  .slot.b-new .bl{color:#16a34a}
  .slot.b-seen{background:var(--gold);border-color:var(--gold);color:#1a1408}
  .slot.b-seen .bl{color:#1a1408;opacity:.75}
  .slot.b-done{background:rgba(37,99,235,.10);border-color:#2563eb;color:#1e40af}
  .slot.b-done .bl{color:#2563eb}
  .notify-toggle{display:flex;align-items:center;gap:12px;margin-top:14px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:.15s}
  .notify-toggle.on{border-color:#25D366;background:rgba(37,211,102,.1)}
  .notify-toggle .nt-check{width:26px;height:26px;flex-shrink:0;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;color:#fff;font-size:1rem}
  .notify-toggle.on .nt-check{background:#25D366;border-color:#25D366}
  .notify-toggle .nt-t b{display:block;font-weight:800;font-size:.98rem;color:var(--text)}
  .notify-toggle .nt-t small{color:var(--muted);font-size:.82rem}
  .nextbar{position:fixed;left:0;right:0;z-index:45;bottom:calc(56px + env(safe-area-inset-bottom));background:var(--ink,#1A1712);color:#fff;box-shadow:0 -10px 30px rgba(26,23,18,.2);border-top:1px solid rgba(245,197,24,.25)}
  .nextbar .nbwrap{display:flex;align-items:center;gap:14px;height:74px;max-width:560px;margin:0 auto;padding:0 18px}
  .nextbar .nb-info{flex:1;line-height:1.3}
  .nextbar .nb-info b{font-size:1.02rem}
  .nextbar .nb-info small{opacity:.72;display:block;font-size:.82rem}
  .nextbar .nb-go{background:var(--gold);color:#1A1712;font-weight:900;padding:14px 26px;border-radius:13px;display:flex;gap:8px;align-items:center;font-size:1.02rem;border:none;font-family:inherit;cursor:pointer}
  .nextbar .nb-go.need{animation:nbpulse 1.5s ease-in-out infinite}
  @keyframes nbpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  /* طلب جديد غير مقروء — زي بريد الإيميل */
  .tjob.unread{border:1.5px solid #16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.12)}
  .newband{display:flex;align-items:center;gap:8px;background:#16a34a;color:#fff;font-weight:900;font-size:.85rem;padding:7px 14px}
  .newband .dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:nbpulse 1.2s infinite}

  /* ===== قسم: الفواتير ===== */
  .iv-sum{display:flex;justify-content:space-between;gap:10px;background:var(--card);border:1px solid rgba(245,197,24,.3);border-radius:14px;padding:14px 16px;margin-top:14px}

  async setItem(k,v){ try{ localStorage.setItem(k,v); }catch(e){} try{ if(_khPrefs) await _khPrefs.set({key:k,value:String(v)}); }catch(e){} _secSet(k,v); },
  async removeItem(k){ try{ localStorage.removeItem(k); }catch(e){} try{ if(_khPrefs) await _khPrefs.remove({key:k}); }catch(e){} _secRm(k); }

/* رقم نسخة المحتوى: يُرسل للخادم في X-Client-Info، ويُقارن بالحد الأدنى في الإعدادات (إجبار التحديث). زِده بواحد مع كل رفع للمتاجر */

try{ const _set=Storage.prototype.setItem, _rm=Storage.prototype.removeItem;
  Storage.prototype.setItem=function(k,v){ _set.call(this,k,v); try{ if(this===localStorage&&_khPrefs&&KH_MIRROR.has(k)) _khPrefs.set({key:k,value:String(v)}).catch(()=>{}); if(this===localStorage) _secSet(k,v); }catch(e){} };
  Storage.prototype.removeItem=function(k){ _rm.call(this,k); try{ if(this===localStorage&&_khPrefs&&KH_MIRROR.has(k)) _khPrefs.remove({key:k}).catch(()=>{}); if(this===localStorage) _secRm(k); }catch(e){} };
}catch(e){}
/* عند فتح التطبيق: لو ذاكرة المتصفح انمسحت نرجّع المفاتيح من مخزن النظام */
async function khRestore(){ if(!_khPrefs&&!_khSec) return []; const back=[]; for(const k of KH_MIRROR){ try{ if(localStorage.getItem(k)!=null) continue; let v=null; try{ if(_khPrefs){ const r=await _khPrefs.get({key:k}); if(r&&r.value!=null) v=r.value; } }catch(e){} if(v==null) v=await _secGet(k); if(v!=null){ localStorage.setItem(k,v); back.push(k); } }catch(e){} } return back; }

}

/* حساب الفاتورة: أجرة الحجز الصافية + الإضافات */
function invOrder(){ return ORDERS.find(x=>x.id===invEditing); }
function invExtras(){ return invItems.filter(it=>!it.booked).reduce((a,it)=>a+(+it.price||0)*(+it.qty||1),0); }
function invBookedNet(){
  const o=invOrder(); const f=1-invPct()/100;
  const dropped=invDrops.reduce((a,d)=>a+(+d.amount||0),0);
  if(!invItems.some(it=>it.booked) && !dropped) return 0;
  // أجرة الحجز المدفوعة ناقص القطع اللي العميل عنده، زائد فرق تبديل اللون
  if(o && o.bookedFinal>0) return Math.max(0, Math.round((+o.bookedFinal - dropped*f + invAdj*f)*100)/100);

/* ضغط صورة الصنف قبل الرفع: أقصى بُعد 800px، JPEG 82% */
function compressImage(file, max, q){ return new Promise((res,rej)=>{ const img=new Image(); const url=URL.createObjectURL(file);
  img.onload=()=>{ const r=Math.min(1,(max||800)/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
    c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',q||0.82); };
  img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('img')); }; img.src=url; }); }
async function uploadPartPhoto(itemId, file){
  const src=invSrc();
  const blob=await compressImage(file,800,0.82);
  const path=(src.pid?('p/'+src.pid+'/'):'')+itemId+'.jpg';
  const { error }=await sb.storage.from('khafet-parts').upload(path, blob, { upsert:true, contentType:'image/jpeg' });
  if(error) throw error;
  const { data }=sb.storage.from('khafet-parts').getPublicUrl(path);
  const url=data.publicUrl+'?v='+Date.now();
  const r=await sb.from(src.table).update({image_url:url}).eq('id',itemId); if(r.error) throw r.error;
  return url;
}

async function saveInvoice(){
  if(window._invSaving) return;   // يمنع الضغط مرتين وخصم القطع مرتين
  captureInvPrices();
  const o=ORDERS.find(x=>x.id===invEditing); if(!o) return;
  const A=lang==='ar';
  invItems.forEach(it=>{ if(!(+it.price>=0)) it.price=0; if(!(+it.qty>=1)) it.qty=1; });
  if(!invItems.length){ toast(A?'أضف بندًا واحدًا على الأقل':'Add at least one item'); return; }
  const big=invItems.some(it=>(+it.price||0)*(+it.qty||1)>2000)||invTotal()>5000;
  if(big && !confirm(A?'المبلغ كبير غير معتاد: '+ar(invTotal())+' ريال. تأكد من الأسعار ثم اضغط موافق للحفظ.':'Unusually large total: '+invTotal()+' SAR. Check the prices, then press OK to save.')) return;

  // خصم قطع المستودع من المخزون — الفرق فقط (يمنع الخصم المزدوج عند إعادة الحفظ/التعديل)
  for(const it of invItems){
    if(it.id==='stock' && it.stockId){
      const inv=INV.find(x=>x.id===it.stockId); if(!inv) continue;
      const want=+it.qty||1, done=+it.deducted||0, delta=want-done;
      if(delta!==0){
        inv.qty=Math.max(0,(+inv.qty||0)-delta);
        await invSaveQty(inv);
        await logStock(inv, -delta, (lang==='ar'?'صرف — فاتورة ':'invoice — ')+o.id);
        it.deducted=want;
      }
    }
  }

function showForgotCode(msg){

async function confirmForgot(){
  const code=((document.getElementById('fg_code')||{}).value||'').trim();
  const a=((document.getElementById('fg_p1')||{}).value)||'', b=((document.getElementById('fg_p2')||{}).value)||'';
  if(code.length<4){ showForgotCode(lg('fcNoCode')); return; }
  if(a.length<6){ showForgotCode(lg('fcShort')); return; }
  if(a!==b){ showForgotCode(lg('fcMismatch')); return; }
  const btn=document.querySelector('.login .btn'); if(btn){ btn.disabled=true; btn.textContent='⏳...'; }
  try{
    const { error:ve }=await sb.auth.verifyOtp({ phone:_fgPhone, token:code, type:'sms' });
    if(ve){ showForgotCode(lg('fcBadCode')); return; }
    const { error:ue }=await sb.auth.updateUser({ password:a });
    if(ue){ showForgotCode(lg('fcSaveFail')); return; }
    _fgPhone=null;
    toast(lg('fcDone'));
    const { data:role }=await sb.rpc('staff_role');
    if(role){ MYROLE=String(role); try{ localStorage.setItem('khafet_role',MYROLE); localStorage.setItem('khafet_staff_ok','1'); }catch(e){} await loadMyName(); loggedIn=true; render(); loadOrders(); loadPrices(); loadInv(); loadStockLog(); initPush(); khMaybeTour(); }
    else showLogin();
  }catch(e){ showForgotCode(lg('tryAgain')); }
}
async function doLogin(){

  if(d.length<12){ lgFail(lg('badphone')); return; }

  if(btn){ btn.disabled=true; btn.textContent='⏳...'; }
  try{
    const { error }=await sb.auth.signInWithPassword({ phone:'+'+d, password:p });
    if(error) throw new Error('bad');
    const { data:role }=await sb.rpc('staff_role');
    if(!role){
      const st=await techState();
      if(st&&st.exists){ PENDING=st; try{ localStorage.setItem('khafet_remember', (document.getElementById('lg_rem')||{checked:true}).checked?'1':'0'); }catch(e){} render(); return; }
      await sb.auth.signOut(); throw new Error('no-role'); }
    MYROLE=String(role); try{ localStorage.setItem('khafet_role',MYROLE); }catch(e){}
    await loadMyName();
    try{ localStorage.setItem('khafet_remember', (document.getElementById('lg_rem')||{checked:true}).checked?'1':'0'); localStorage.setItem('khafet_staff_ok','1'); }catch(e){}
    loggedIn=true; render(); loadOrders(); loadPrices(); loadInv(); loadStockLog(); initPush(); khMaybeTour();   // المستودع والأسعار تُحمَّل بعد الدخول لا قبله
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent=lg('login'); }

  }
}

function renderCalendar(){
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  const days=new Date(y,m+1,0).getDate();
  const todayISO=dateISO(new Date());
  let cells='';
  for(let dd=1; dd<=days; dd++){
    const d=new Date(y,m,dd), iso=dateISO(d), c=jobCountOn(iso);
    const cls=[c?'has':'', iso===todayISO?'today':'', calFilter===iso?'sel':''].filter(Boolean).join(' ');

      <span class="cd-w">${wkShort(d.getDay())}</span>
      <b class="cd-n">${ar(dd)}</b>

  }

  const filterBar = calFilter
    ? `<div class="cal-filter"><b>📅 ${dayHeadLabel(calFilter)}</b><button onclick="calClear()">${showAll}</button></div>` : '';
  return `<div class="calbar">

}

async function invAddPrompt(){

  const unit=prompt(A?'الوحدة (حبة/متر/كرتون):':'Unit:','حبة')||'حبة';
  const qty=Math.abs(+prompt(A?'الكمية الحالية:':'Current qty:','0')||0);
  const buy=0;
  const sell=Math.abs(+prompt(A?'سعر البيع (ر.س):':'Sell price:','0')||0);
  const mn=Math.abs(+prompt(A?'الحد الأدنى للتنبيه:':'Min alert qty:','3')||3);

async function invEdit(id){

  const sell=prompt(A?('سعر بيع «'+it.name+'»:'):'Sell price:', it.sell_price||0); if(sell===null) return;
  const mn=prompt(A?'الحد الأدنى للتنبيه:':'Min alert:', it.min_qty||3); if(mn===null) return;

      :(bkFound?`<div class="bk-found">${bkFound.map(f=>`<span class="${f[1]?'ok':'miss'}">${f[1]?'✓':(A?'ناقص:':'Missing:')} ${f[0]}</span>`).join('')}</div>`:`<p class="bk-wa-hint">${A?'تنسخ رسائل العميل وتلصقها، وتتعبى البيانات لحالها.':'Paste the customer chat and the form fills itself.'}</p>`)}

  const locBlock = bkVals.mapUrl

    <div class="fu-field"><label>${A?'اسم العميل':'Customer name'}</label><input id="bk_name" value="${esc(bkVals.name||'')}" oninput="bkVals.name=this.value" placeholder="${A?'الاسم':'Name'}" /></div>

function bkLocate(){
  const A=lang==='ar';
  if(!navigator.geolocation){ toast('⚠️ '+(A?'الجهاز ما يدعم تحديد الموقع':'No geolocation')); return; }
  toast('⏳ '+(A?'جارٍ تحديد الموقع…':'Locating…'));
  navigator.geolocation.getCurrentPosition(function(pos){
    const la=+pos.coords.latitude.toFixed(6), ln=+pos.coords.longitude.toFixed(6);
    bkVals.lat=la; bkVals.lng=ln; bkVals.mapUrl='https://www.google.com/maps?q='+la+','+ln;
    toast('📍 '+(A?'تم تحديد الموقع':'Located')); render();
  }, function(){ toast('⚠️ '+(A?'تعذّر تحديد الموقع، فعّل GPS وأذونات الموقع':'Could not locate, enable GPS')); }, {enableHighAccuracy:true, timeout:15000, maximumAge:0});
}
async function createBooking(){

  let photoPath='';

    try{

      const path='loc_'+Date.now()+'_'+rnd+'.jpg';
      const up=await sb.storage.from('khafet-videos').upload(path, bkPhoto.blob, {upsert:false, contentType:'image/jpeg'});

      photoPath=path;
    }catch(e){ fail((A?'ما انرفعت الصورة، جرّب مرة ثانية أو شيل الصورة':'Photo upload failed, try again or remove it')+(e&&e.message?' ('+e.message+')':'')); return; }
  }
  const parts=bkSplitAddr(addrTxt);
  const payload={ customer_name:name, customer_phone:phone,
    address:{ city:parts.city, district:parts.district, street:parts.street, house:house, lat:bkVals.lat||'', lng:bkVals.lng||'', mapUrl:bkVals.mapUrl||'', photoUrl:photoPath },
    items:items,
    service_date:date, start_min:startMin, duration:duration, end_min:startMin+duration,
    price:0, final_price:0, free:false, status:'confirmed', rating:0, reminded:false,
    quick:true, note:note||(A?'حجز أنشأه الفني':'Created by technician'), video_url:'', invoice:null, provider_phone:null };
  if(cloudReady){
    try{ const r=await sb.from('khafet_orders').insert(payload).select().single(); if(r.error) throw r.error; }
    catch(e){ fail(e.message||''); return; }
  }
  toast('✅ '+(A?'تم الحجز':'Booked'));
  bkTime=null; bkExact=false; bkSvcs=[]; bkFound=null; bkWaOpen=false;
  if(bkPhoto&&bkPhoto.url) URL.revokeObjectURL(bkPhoto.url); bkPhoto=null;
  ['name','phone','svc','addr','house','lat','lng','mapUrl','mapIn','note','chat'].forEach(k=>{ bkVals[k]=''; });
  tab='orders'; calFilter=date;
  if(cloudReady) loadOrders(); else render();
}

function invOrderTotal(o){
  const iv=o.invoice; if(!iv) return 0;
  if(typeof iv.total==='number') return iv.total;
  return (iv.items||[]).reduce((s,it)=>s+((+it.price||0)*(+it.qty||1)),0);
}

function setLang(l){ lang=l; localStorage.setItem('khafet_techlang',l); if(invEditing) renderInvoice(); render(); }
/* الطلبات الجديدة غير المقروءة — زي بريد الإيميل */
function seenJobs(){ try{ return new Set(JSON.parse(localStorage.getItem('khafet_tech_seen')||'[]')); }catch(e){ return new Set(); } }
function markJobsSeen(ids){ try{ const s=seenJobs(); ids.forEach(i=>i&&s.add(i)); localStorage.setItem('khafet_tech_seen', JSON.stringify([...s].slice(-400))); }catch(e){} }
function jobAgo(o){
  if(!o.createdAt) return '';
  const mins=Math.max(1, Math.round((Date.now()-new Date(o.createdAt).getTime())/60000));
  const A=lang==='ar';
  if(mins<60) return A?('وصل قبل '+ar(mins)+' د'):(mins+'m ago');
  const h=Math.round(mins/60);
  if(h<24) return A?('وصل قبل '+ar(h)+' س'):(h+'h ago');
  const d=Math.round(h/24);
  return A?('وصل قبل '+ar(d)+' يوم'):(d+'d ago');
}

    }
    let head='';
    if(o.date!==lastDate){ lastDate=o.date; if(!(tab==='orders'&&calFilter)) head=`<div class="day-head">📅 ${dayHeadLabel(o.date)}</div>`; }
    // المنجز ينصفط في سطر واحد (الوقت · اليوم · مكتمل) — والضغط عليه يفتحه للفاتورة وغيرها
    if(o.status==='done' && !doneOpen[o.id]){
      return head+`<button class="tjob-mini" onclick="toggleDone('${o.id}')">
        <span class="tm-ic">✅</span>
        <span class="tm-tx"><b>${jobTime(o.startMin)} · ${jobDate(o.date)}</b><small>${esc((o.customer&&o.customer.name)||'')}</small></span>
        <span class="tm-badge">${t('st').done}</span>
        <span class="tm-arrow">▾</span>
      </button>`;
    }
    const isNew = o.dbId && o.status!=='done' && !window._sj.has(o.dbId);
    const agoS = isNew ? jobAgo(o) : '';
    return head+`<div class="tjob ${o.status==='done'?'done':''} ${o.quick?'quick':''} ${isNew?'unread':''}" id="job-${(o.dbId||'').replace(/[^a-zA-Z0-9_-]/g,'')}">
      ${isNew?`<div class="newband"><span class="dot"></span>${lang==='ar'?'جديد':'NEW'}${agoS?' • '+agoS:''}</div>`:''}
      <div class="tj-head">
        <span class="tj-when">🕐 ${jobTime(o.startMin)} · ${jobDate(o.date)}</span>
        <span class="tj-badges">${payDue(o)>0&&o.status!=='new'?`<span class="status due-b">💳 ${ar(payDue(o))}</span>`:(o.paidAmount>0&&o.status!=='cancelled'?`<span class="status paid-b">${lg('paidLbl')}</span>`:'')}${o.arrived?`<span class="status arrived-b">${t('arrivedBadge')}</span>`:''}<span class="status ${o.status}">${t('st')[o.status]}</span></span>
      </div>
      <div class="tj-body">
        ${o.quick?`<div class="quick-tag">${t('quickTag')}</div>`:''}${(!o.quick||(o.items||[]).some(i=>i&&i.id&&i.id!=='quick'))?`<div class="tj-row"><span class="tj-k">🔧 ${t('whatNeeded')}</span><span class="tj-v">${work}</span></div>`:''}
        ${partsTxt?`<div class="tj-row"><span class="tj-k">🔩 ${lang==='ar'?'قطع محجوزة مع الطلب':lang==='en'?'Parts booked':lang==='ur'?'بک شدہ پارٹس':'बुक पार्ट्स'}</span><span class="tj-v">${partsTxt}<div style="color:var(--muted);font-size:.8rem;font-weight:700;margin-top:2px">${lang==='ar'?'خذها معك من المستودع، مدفوعة مع الحجز':'Take them from stock, paid with the booking'}</div></span></div>`:''}
        ${o.note?`<div class="tj-row"><span class="tj-k">🛠️ ${t('problem')}</span><span class="tj-v">${esc(o.note)}${lang!=='ar'?` <a class="ttrans" href="https://translate.google.com/?sl=auto&tl=${lang}&text=${encodeURIComponent(o.note)}&op=translate" target="_blank" rel="noopener">${t('translate')}</a>`:''}</span></div>`:''}
        ${o.videoUrl?`<div class="tj-row"><span class="tj-k">📷 ${lang==='ne'?'फोटो/भिडियो':lang==='en'?'Photo/Video':lang==='hi'?'फोटो/वीडियो':lang==='ur'?'تصویر/ویڈیو':'صورة/مقطع'}</span><span class="tj-v"><button class="tvideo" data-media="${esc(o.videoUrl)}" onclick="openMedia(this.dataset.media)">${t('watchVideo')}</button></span></div>`:''}
        <div class="tj-row"><span class="tj-k">⏱️ ${t('duration')}</span><span class="tj-v">${jobDur(o.duration)}</span></div>
        <div class="tj-row loc-row"><span class="tj-k">📍 ${t('location')}</span><span class="tj-v">${[addr, a.house?t('house')+' '+esc(a.house):''].filter(Boolean).join(' · ')||(gpsPin?'📍 GPS':'')}
          ${a.mark?`<div style="color:var(--muted);font-weight:600;margin-top:2px">🚩 ${esc(a.mark)}</div>`:''}
          <a class="tmap" href="${mapUrl}" target="_blank" rel="noopener">🗺️ ${gpsPin?'📍 ':''}${t('openMap')}</a>
          ${a.photoUrl?`<button class="tmap" style="background:#7c3aed;color:#fff" data-media="${esc(a.photoUrl)}" onclick="openMedia(this.dataset.media)">🏠 ${lang==='ne'?'घरको फोटो':lang==='en'?'House photo':lang==='hi'?'घर की फोटो':lang==='ur'?'گھر کی تصویر':'صورة المنزل'}</button>`:''}</span></div>
        <div class="tj-row"><span class="tj-k">👤 ${t('customer')}</span><span class="tj-v">${esc(o.customer.name)}
          <div class="contact-btns">
            <a class="twa" href="${waLink(o.customer.phone,'')}" target="_blank" rel="noopener">💬 ${t('whatsapp')}</a>
            <a class="tcall" href="tel:${esc(o.customer.phone)}">📞 ${t('call')} ${esc(o.customer.phone)}</a>
          </div></span></div>
        ${(o.wantsEarlier && o.status!=='done')?`<div class="tj-row early-row"><span class="tj-k">🔔</span><span class="tj-v">${lang==='ne'?'ग्राहक चाँडो समयमा आउन तयार — रिक्त भए सम्पर्क गर्नुहोस्':lang==='en'?'Customer welcomes an earlier slot — contact them if one frees up':lang==='hi'?'ग्राहक जल्दी समय के लिए तैयार — खाली होने पर संपर्क करें':lang==='ur'?'گاہک جلد وقت کے لیے تیار — خالی ہونے پر رابطہ کریں':'العميل يرحّب بموعد أبكر — لو تيسّر تواصل معه وقدّمه'}</span></div>`:''}
        ${a.notes?`<div class="tj-row"><span class="tj-k">📝 ${t('notes')}</span><span class="tj-v">${esc(a.notes)}</span></div>`:''}
      </div>
      ${(o.status==='progress'||o.delayMin)?`<div class="delay-ctl">
        <span class="dc-l">⏳ ${t('extraTime')}${o.delayMin?`: <b>+${ar(o.delayMin)} ${t('min')}</b>`:''}</span>
        ${o.status==='progress'?`<div class="dc-btns">
          <button onclick="addDelay('${o.id}',15)">+${ar(15)}</button>
          <button onclick="addDelay('${o.id}',30)">+${ar(30)}</button>
          <button onclick="addDelay('${o.id}',60)">+${ar(60)}</button>
          ${o.delayMin?`<button class="dc-reset" onclick="addDelay('${o.id}',${-o.delayMin})">↺</button>`:''}
        </div>`:''}
      </div>`:''}
      ${acts?tactsHTML(acts,o):''}
    </div>`;
  }).join(''); }

  // الهيرو (رئيسية فقط) + محتوى الطلبات
  const heroHTML=`
    ${rizqBanner()}
    <div class="hero">
      <h1>${t('title')}</h1>
      <p>${t('sub')}</p>
      <div class="stat-row">
        <div class="stat"><div class="n gold">${ar(todayCount)}</div><div class="l">${t('today')}</div></div>
        <div class="stat"><div class="n">${ar(openCount)}</div><div class="l">${t('active')}</div></div>
      </div>
      ${!usingCloud?`<div class="offline">⚠️ ${t('offline')}</div>`:''}
    </div>`;
  const ordersContent=`${renderCalendar()}<div class="jobs">${cards}</div>`;

  // ═ مربّعات الرئيسية (زي لوحة الإدارة) — متعددة اللغات ═
  const CARDS=[['orders','📋',tl(0),ar(openCount)],['inv','📦',tl(1),ar((INV||[]).length)],['book','📅',tl(2),''],['invoices','🧾',tl(3),'']];
  const openLbl=lang==='ar'?'فتح ›':lang==='en'?'Open ›':lang==='ur'?'کھولیں ›':'खोल्नुहोस् ›';
  const cardsHTML=CARDS.map(([k,ic,lbl,sub])=>`<div class="hcard" onclick="setTab('${k}')"><span class="hc-ic">${ic}</span><h3>${lbl}</h3><p>${sub||'&nbsp;'}</p><span class="hc-open">${openLbl}</span></div>`).join('');
  const homeLbl=lang==='ar'?'الرئيسية':lang==='en'?'Home':lang==='ur'?'ہوم':'गृह';
  const secLbl=({orders:tl(0),inv:tl(1),book:tl(2),invoices:tl(3),acct:tl(4)})[tab]||'';

  let view;
  if(tab==='home'){
    /* الرئيسية: الجدول فقط — تفاصيل الحجز تطلع بس للمربع المضغوط */
    view=`${heroHTML}${schedHTML()}${shown.length?`
      <div style="margin-top:16px;font-weight:900;font-size:1.08rem">📋 ${lang==='ar'?'تفاصيل الحجز':'Booking details'}</div>
      <div class="jobs" style="margin-top:10px">${cards}</div>`:''}`;
  } else {
    let sec;
    if(tab==='inv')           sec=renderInvTab();
    else if(tab==='book')     sec=renderBookTab();
    else if(tab==='invoices') sec=renderInvoicesTab();
    else if(tab==='acct')     sec=renderAccountTab();
    else                      sec=ordersContent;
    view=`<div class="sechead" style="display:flex;align-items:center;gap:10px;margin-top:14px">
        <button class="backbtn" onclick="goHome()">‹ ${homeLbl}</button>
        ${tab==='orders'?`<b style="font-size:1.12rem;font-weight:900;flex:1">${secLbl}</b>`:''}
      </div>
      <div style="margin-top:12px">${sec}</div>`;
  }
  /* الشريط السفلي الثابت + مسافة تمنع تغطية آخر المحتوى */
  document.getElementById('app').innerHTML = view + '<div style="height:84px"></div>' + renderTabs();
  try{ const td=document.querySelector('.cal-day.sel')||document.querySelector('.cal-day.today'); if(td) td.scrollIntoView({inline:'center',block:'nearest'}); }catch(e){}
  /* بعد ما شاف قائمة الطلبات، الجديد الحالي يُعتبر مقروءاً */
  if(tab==='orders'){
    const ids=jobs.map(o=>o.dbId).filter(Boolean);
    setTimeout(function(){ markJobsSeen(ids); }, 1500);
  }
}

function tactsHTML(acts,o){
  const tpl=document.createElement('template'); tpl.innerHTML=acts;
  const els=[...tpl.content.children]; const A=lang==='ar';
  const PRIM=['onway','arrive','start','done','devpay'];
  let primary=null; const chips=[], more=[];
  els.forEach(el=>{
    if(el.tagName==='DIV'){ chips.push(el.outerHTML); return; }
    if(!primary && PRIM.some(c=>el.classList.contains(c))){ el.classList.add('primary'); primary=el.outerHTML; }
    else more.push(el);
  });
  // قيد التنفيذ بدون فاتورة: الفاتورة هي الخطوة الجاية، وتسجيل الدفع بالجهاز يروح للخيارات
  if(o && o.status==='progress' && !o.invoice){
    const inv=more.find(el=>el.classList.contains('inv'));
    if(inv){ if(primary){ const p=document.createElement('template'); p.innerHTML=primary; const pe=p.content.firstElementChild; pe.classList.remove('primary'); more.unshift(pe); } inv.classList.add('primary'); primary=inv.outerHTML; more.splice(more.indexOf(inv),1); }
  }
  return '<div class="tacts">'+(chips.length?'<div class="chips">'+chips.join('')+'</div>':'')+(primary||'')+(more.length?'<details><summary>'+(A?'خيارات أخرى ▾':'More ▾')+'</summary><div class="more">'+more.map(e=>e.outerHTML).join('')+'</div></details>':'')+'</div>';
}
function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.classList.add('show'); clearTimeout(window._tt); window._tt=setTimeout(()=>el.classList.remove('show'),1800); }

document.querySelectorAll('.langsw button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.l)));
loadLocal(); render();                 // اعرض فوراً من المحلي
(function(){ function go(){ if(window.supabase){ initCloud(); return true; } return false; } if(!go()){ document.addEventListener('DOMContentLoaded',function(){ if(!go()) window.addEventListener('load',go); }); } })();   // ثم من السحابة، أول ما تجهز المكتبة المحلية

/* 👁 إظهار/إخفاء كلمة المرور — يُطبَّق تلقائياً على أي حقل كلمة مرور يظهر بالصفحة */
const _EYE_OPEN='<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
const _EYE_OFF='<svg viewBox="0 0 24 24"><path d="M10.6 5.2A9.9 9.9 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3 3.8M6.2 6.2A17 17 0 0 0 2 12s3.6 7 10 7a9.8 9.8 0 0 0 4.2-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M2 2l20 20"/></svg>';
function _pwToggle(btn){
  const inp=btn.parentNode.querySelector('input');
  if(!inp) return;
  const show = inp.type==='password';
  inp.type = show?'text':'password';
  btn.innerHTML = show?_EYE_OFF:_EYE_OPEN;
  btn.setAttribute('aria-label', show?lg('hidePass'):lg('showPass'));
  try{ inp.focus({preventScroll:true}); }catch(e){}
}
function applyPwEyes(){
  document.querySelectorAll('input[type="password"]').forEach(function(inp){
    if(inp.parentNode && inp.parentNode.classList && inp.parentNode.classList.contains('pwwrap')) return;
    const w=document.createElement('span'); w.className='pwwrap';
    inp.parentNode.insertBefore(w, inp); w.appendChild(inp);
    const b=document.createElement('button');
    b.type='button'; b.className='pweye'; b.innerHTML=_EYE_OPEN;
    b.setAttribute('aria-label',(typeof lg==='function'?lg('showPass'):'إظهار كلمة المرور'));
    b.setAttribute('tabindex','-1');
    b.onclick=function(e){ e.preventDefault(); e.stopPropagation(); _pwToggle(b); };
    w.appendChild(b);
  });
}
/* يراقب الصفحة: أي حقل كلمة مرور جديد يُرسم، ينضاف له الزر تلقائياً */
try{
  new MutationObserver(function(){ applyPwEyes(); })
    .observe(document.documentElement,{childList:true,subtree:true});
}catch(e){}
document.addEventListener('DOMContentLoaded', applyPwEyes);
setTimeout(applyPwEyes, 300);
</script>
</body>
