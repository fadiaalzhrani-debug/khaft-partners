# بناء 2026-07-24 — أندرويد لرزق
# إعدادات بناء تطبيق «شركاء خافِت» على Codemagic (iOS)
# نفس آلية توقيع تطبيق العملاء المجرّبة — Bundle ID مستقل، فلا يؤثر على مراجعة خافِت.
# (نسخة v1 بدون إشعارات فورية لضمان بناء نظيف؛ الإشعارات تُضاف لاحقاً)
workflows:
  ios-partners:
    name: رزق iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    # بناء تلقائي: أي رفع (push) على main يبدأ البناء بنفسه — بدون ضغط زر
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    environment:
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.khafet.partners"
      node: 20.19.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: تثبيت الحزم
        script: npm install
      - name: تجهيز منصة iOS
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: أيقونة التطبيق وشاشة البداية
        script: |
          # يولّد كل مقاسات الأيقونة من assets/icon.png داخل مشروع iOS
          npx capacitor-assets generate --ios
          echo "— الأيقونات المولّدة —"
          ls ios/App/App/Assets.xcassets/AppIcon.appiconset/ | head -20
      - name: أذونات الجهاز ورقم الإصدار
        script: |
          PLIST="ios/App/App/Info.plist"
          setkey() {
            plutil -insert "$1" -string "$2" "$PLIST" 2>/dev/null || plutil -replace "$1" -string "$2" "$PLIST"
          }
          setkey NSCameraUsageDescription "لتصوير حالة العمل أو المشكلة وإرفاقها مع الطلب"
          setkey NSPhotoLibraryUsageDescription "لاختيار صورة من المعرض توضّح حالة العمل"
          setkey NSPhotoLibraryAddUsageDescription "لحفظ صور العمل في معرض صورك"
          setkey NSMicrophoneUsageDescription "لتسجيل مقطع فيديو يوضّح حالة العمل عند الحاجة"
          setkey CFBundleVersion "$BUILD_NUMBER"
          setkey CFBundleShortVersionString "1.1.0"
          setkey CFBundleDisplayName "رزق"
          # آيفون فقط + الحد الأدنى iOS 15 (آبل تحذّر تحت 15.0)
          ruby -e "require 'xcodeproj'; \
            p = Xcodeproj::Project.open('ios/App/App.xcodeproj'); \
            t = p.targets.find { |x| x.name == 'App' }; \
            t.build_configurations.each { |c| c.build_settings['TARGETED_DEVICE_FAMILY'] = '1'; \
              c.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0' }; \
            p.build_configurations.each { |c| c.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0' }; \
            p.save; puts '✅ آيفون فقط + الحد الأدنى iOS 15'"
          # HTTPS القياسي فقط = تشفير معفى، فلا تسأل آبل كل مرة
          plutil -insert ITSAppUsesNonExemptEncryption -bool false "$PLIST" 2>/dev/null || \
            plutil -replace ITSAppUsesNonExemptEncryption -bool false "$PLIST"
          echo "— الأذونات بعد التعديل —"
          plutil -p "$PLIST" | grep -i -e usagedescription -e CFBundleVersion -e CFBundleDisplayName
      - name: صلاحية الإشعارات الفورية
        script: |
          # مشروع iOS يتولّد كل بناء، فنضيف صلاحية Push تلقائياً
          ENT="ios/App/App/App.entitlements"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict/></plist>' > "$ENT"
          /usr/libexec/PlistBuddy -c "Add :aps-environment string production" "$ENT"
          ruby -e "require 'xcodeproj'; \
            p = Xcodeproj::Project.open('ios/App/App.xcodeproj'); \
            t = p.targets.find { |x| x.name == 'App' }; \
            t.build_configurations.each { |c| c.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'App/App.entitlements' }; \
            p.save; puts '✅ تمت إضافة صلاحية الإشعارات'"
          cat "$ENT"
      - name: ربط استقبال توكن الإشعارات
        script: |
          AD="ios/App/App/AppDelegate.swift"
          if grep -q "didRegisterForRemoteNotificationsWithDeviceToken" "$AD"; then
            echo "موجود - لا حاجة للتعديل"
          else
            echo "مفقود! نضيف تمرير توكن آبل للإضافة"
            LAST=$(grep -n '^}' "$AD" | tail -1 | cut -d: -f1)
            head -n $((LAST-1)) "$AD" > /tmp/ad.swift
            printf '%s\n' \
              '' \
              '    func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {' \
              '        NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)' \
              '    }' \
              '' \
              '    func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {' \
              '        NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)' \
              '    }' \
              '}' >> /tmp/ad.swift
            cp /tmp/ad.swift "$AD"
            echo "تمت الإضافة"
          fi
          grep -n "RemoteNotifications" "$AD" || echo "لا يزال مفقوداً!"
      - name: تجهيز مفتاح آبل
        script: |
          echo "$APP_STORE_CONNECT_KEY_B64" | base64 --decode > /tmp/AuthKey.p8
          echo "$CERTIFICATE_PRIVATE_KEY_B64" | base64 --decode > /tmp/cert_key.pem
          echo "تم تجهيز المفاتيح:"
          head -1 /tmp/AuthKey.p8
          head -1 /tmp/cert_key.pem
      - name: إنشاء وإعداد شهادات التوقيع
        script: |
          keychain initialize
          # المفاتيح متعددة الأسطر تُمرَّر عبر متغيّرات البيئة (الطريقة الموصى بها من Codemagic)
          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat /tmp/AuthKey.p8)"
          export CERTIFICATE_PRIVATE_KEY="$(cat /tmp/cert_key.pem)"
          # --create يُنشئ الشهادة وملف التوقيع تلقائياً؛ المفاتيح تُقرأ من متغيّرات البيئة
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: بناء ملف IPA
        script: |
          cd ios/App
          xcode-project build-ipa --workspace "App.xcworkspace" --scheme "App"
      - name: رفع للـ App Store Connect
        script: |
          IPA=$(find "$CM_BUILD_DIR" -name '*.ipa' | head -1)
          echo "الملف: $IPA"
          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat /tmp/AuthKey.p8)"
          set +e
          app-store-connect publish \
            --path "$IPA" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" 2>&1 | tee /tmp/publish.log
          CODE=${PIPESTATUS[0]}
          if [ "$CODE" -ne 0 ]; then
            echo ""
            echo "═════════ ❌ سبب فشل الرفع (مستخرج تلقائياً) ═════════"
            grep -oE '"(message|NSLocalizedDescription)" : "[^"]*"' /tmp/publish.log | sort -u
            grep -oE '"code" : [0-9-]+' /tmp/publish.log | sort -u
            echo "═══════════════════════════════════════════════════"
          fi
          exit $CODE
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  # ═══════════ أندرويد (Google Play) — يعيد استخدام مفتاح khafet_upload ═══════════
  android-partners:
    name: رزق Android
    instance_type: mac_mini_m2
    max_build_duration: 45
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    environment:
      groups:
        - appstore          # نفس المجموعة — نضيف فيها بيانات Google Play
      android_signing:
        - khafet_upload
      vars:
        PACKAGE_NAME: "com.khafet.partners"
      node: 20.19.0
    scripts:
      - name: تثبيت الحزم
        script: npm install
      - name: تجهيز منصة أندرويد + Firebase
        script: |
          # نُبقي إضافة الإشعارات — أندرويد صار يدعم Firebase الآن
          npx cap add android || true
          npx cap sync android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          # ملف google-services.json مضمّن مباشرة (يشمل com.khafet.partners من مشروع khaft1)
          echo '' | base64 --decode > android/app/google-services.json
          echo "✅ وُضع google-services.json"
          # استهداف المستوى 36 (شرط Google Play) + إضافة Firebase messaging
          python3 - <<'PY'
          import re
          p = 'android/variables.gradle'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', s)
          s = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', s)
          open(p, 'w', encoding='utf-8').write(s)
          gp = 'android/gradle.properties'
          g = open(gp, encoding='utf-8').read()
          if 'suppressUnsupportedCompileSdk' not in g:
              open(gp, 'a', encoding='utf-8').write('\nandroid.suppressUnsupportedCompileSdk=36\n')
          bp = 'android/build.gradle'
          b = open(bp, encoding='utf-8').read()
          if 'com.google.gms:google-services' not in b:
              b = re.sub(r'(dependencies\s*\{)', r"\1\n        classpath 'com.google.gms:google-services:4.4.2'", b, count=1)
              open(bp, 'w', encoding='utf-8').write(b)
          ap = 'android/app/build.gradle'
          a = open(ap, encoding='utf-8').read()
          if 'com.google.gms.google-services' not in a:
              a += "\napply plugin: 'com.google.gms.google-services'\n"
          if 'firebase-messaging' not in a:
              a = re.sub(r'(dependencies\s*\{)', r"\1\n    implementation platform('com.google.firebase:firebase-bom:33.7.0')\n    implementation 'com.google.firebase:firebase-messaging'", a, count=1)
          open(ap, 'w', encoding='utf-8').write(a)
          print('✅ compileSdk/targetSdk=36 + Firebase messaging مُضاف')
          PY
          (yes | sdkmanager "platforms;android-36" >/dev/null 2>&1) \
            || (yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" >/dev/null 2>&1) \
            || true
      - name: أيقونة التطبيق
        script: npx capacitor-assets generate --android || true
      - name: رقم الإصدار + إعداد التوقيع
        script: |
          python3 - <<'PY'
          import re, os
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          vc = str(int(os.environ.get('PROJECT_BUILD_NUMBER') or os.environ.get('BUILD_NUMBER') or '1') + 1000)
          s = re.sub(r'versionCode\s+\d+', 'versionCode ' + str(vc), s, count=1)
          s = re.sub(r'versionName\s+"[^"]*"', 'versionName "1.0.0"', s, count=1)
          s = re.sub(r'(buildTypes\s*\{\s*release\s*\{)', r'\1 signingConfig signingConfigs.release', s, count=1)
          lines = [
              '    signingConfigs {',
              '        release {',
              '            storeFile file(System.getenv("CM_KEYSTORE_PATH"))',
              '            storePassword System.getenv("CM_KEYSTORE_PASSWORD")',
              '            keyAlias System.getenv("CM_KEY_ALIAS")',
              '            keyPassword System.getenv("CM_KEY_PASSWORD")',
              '        }',
              '    }',
          ]
          s = s.replace('android {', 'android {\n' + '\n'.join(lines), 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('build.gradle updated: versionCode=' + str(vc))
          PY
      - name: بناء حزمة AAB موقّعة
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease
          find . -name "*.aab" -exec ls -lh {} \;
      - name: رفع تلقائي لـGoogle Play (اختبار داخلي)
        script: |
          # يتخطّى بأمان حتى تُضاف بيانات حساب الخدمة كمتغيّر GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
          if [ -z "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" ]; then
            echo "— لا توجد بيانات ربط Google Play بعد — نتخطّى الرفع (البناء نفسه ناجح) —"; exit 0; fi
          AAB=$(find "$CM_BUILD_DIR" -name "*.aab" | head -1)
          echo "الملف: $AAB"
          echo "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" > /tmp/gcloud_key.json
          fastlane supply \
            --aab "$AAB" \
            --json_key /tmp/gcloud_key.json \
            --package_name "$PACKAGE_NAME" \
            --track internal \
            --release_status completed \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true \
            --skip_upload_changelogs true
    artifacts:
      - android/app/build/outputs/bundle/**/*.aab
